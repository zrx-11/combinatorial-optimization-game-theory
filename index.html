<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习总手册</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px}
.brand{font-size:17px;font-weight:700;display:inline-block;margin-right:18px}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.tabs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.tab{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-right{float:right;display:flex;gap:8px;align-items:center;margin-top:2px}
#q{width:260px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:6px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
#progress-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.book-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.book-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel)}
.book-card h3{margin:0 0 6px;font-size:16px}
.book-card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.book-card .enter{font-size:13px}
.empty{color:var(--muted);padding:20px 0}
@media print{header,.sidebar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:820px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}
  .hdr-right{float:none;margin-top:8px}#q{width:100%}}
</style>

</head>
<body>
<header>
  <span class="brand">学习总手册<span>点化学习系统 · 统一入口</span></span>
  <span class="tabs" id="tabs"></span>

    <input id="q" type="search" placeholder="全书搜索…">
    <button id="theme-btn">🌙 深色</button>
  </span>
</header>
<div class="layout">

<script>
const BOOKS = {"combinatorial-optimization-and-game-theory":{"manifest": {"slug": "combinatorial-optimization-and-game-theory", "title": "组合优化与博弈论", "subtitle": "从线性规划到在线算法与博弈论：一套按结构判断难度的学习系统", "book": {"title": "组合优化与博弈论", "author": "谈之奕、林凌", "source": ["组合优化与博弈论.pdf（浙江大学出版社，270 页扫描版）"]}, "audience": "零基础到有基础的本科生", "goal": "能独立把现实问题写成优化模型，判断其复杂度，选对算法并说明保证", "learningPath": [{"step": "01", "title": "导言：优化三件套", "chapterIds": ["ch00"], "checkpoint": "能举一个局部最优不是全局最优的例子"}, {"step": "02", "title": "线性规划与对偶", "chapterIds": ["ch01"], "checkpoint": "手算单纯形表，得 x=(4,2)、值 14"}, {"step": "03", "title": "运输与指派", "chapterIds": ["ch02"], "checkpoint": "运输最优 43，指派最优 15"}, {"step": "04", "title": "整数规划", "chapterIds": ["ch03"], "checkpoint": "复算 −202.5、−198、−168 三个值"}, {"step": "05", "title": "图与网络优化", "chapterIds": ["ch04"], "checkpoint": "MST 总权 13，最大流 4"}, {"step": "06", "title": "组合优化与复杂度", "chapterIds": ["ch05"], "checkpoint": "能写一个归约的两步证明"}, {"step": "07", "title": "排序与装箱", "chapterIds": ["ch06"], "checkpoint": "LPT 得 12，Johnson 得 11"}, {"step": "08", "title": "在线问题", "chapterIds": ["ch07"], "checkpoint": "推出滑雪租赁 2 − 1/N"}, {"step": "09", "title": "博弈论", "chapterIds": ["ch08"], "checkpoint": "解出 2×2 博弈值 1/7"}], "chapters": [{"id": "ch00", "title": "第 0 章：导言", "file": "chapters/ch00-导言.md", "difficulty": 1}, {"id": "ch01", "title": "第 1 章：线性规划", "file": "chapters/ch01-线性规划.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：运输与指派", "file": "chapters/ch02-运输与指派.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：整数规划", "file": "chapters/ch03-整数规划.md", "difficulty": 3}, {"id": "ch04", "title": "第 4 章：图与网络优化", "file": "chapters/ch04-图与网络优化.md", "difficulty": 2}, {"id": "ch05", "title": "第 5 章：组合优化", "file": "chapters/ch05-组合优化.md", "difficulty": 3}, {"id": "ch06", "title": "第 6 章：排序与装箱", "file": "chapters/ch06-排序与装箱.md", "difficulty": 3}, {"id": "ch07", "title": "第 7 章：在线问题", "file": "chapters/ch07-在线问题.md", "difficulty": 3}, {"id": "ch08", "title": "第 8 章：博弈论", "file": "chapters/ch08-博弈论.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "单纯形法", "file": "concepts/c01-单纯形法.md", "chapterIds": ["ch01"]}, {"id": "c02", "title": "对偶与影子价格", "file": "concepts/c02-对偶与影子价格.md", "chapterIds": ["ch01", "ch08"]}, {"id": "c03", "title": "全么模与整数性", "file": "concepts/c03-全么模与整数性.md", "chapterIds": ["ch02", "ch03"]}, {"id": "c04", "title": "割平面与分枝定界", "file": "concepts/c04-割平面与分枝定界.md", "chapterIds": ["ch03"]}, {"id": "c05", "title": "匹配与增广路", "file": "concepts/c05-匹配与增广路.md", "chapterIds": ["ch02", "ch04"]}, {"id": "c06", "title": "最大流最小割", "file": "concepts/c06-最大流最小割.md", "chapterIds": ["ch04"]}, {"id": "c07", "title": "NP-完全与归约", "file": "concepts/c07-NP完全与归约.md", "chapterIds": ["ch05", "ch06"]}, {"id": "c08", "title": "近似比与 PTAS", "file": "concepts/c08-近似比与PTAS.md", "chapterIds": ["ch05", "ch06"]}, {"id": "c09", "title": "竞争比", "file": "concepts/c09-竞争比.md", "chapterIds": ["ch07"]}, {"id": "c10", "title": "Nash 均衡", "file": "concepts/c10-Nash均衡.md", "chapterIds": ["ch08"]}], "glossary": [{"term": "决策变量", "def": "你能拍板决定的那个量", "chapterId": "ch00"}, {"term": "目标函数", "def": "你想让它变大或变小的那个数", "chapterId": "ch00"}, {"term": "约束条件", "def": "决策变量必须满足的限制", "chapterId": "ch00"}, {"term": "可行解", "def": "同时满足所有约束的一组取值", "chapterId": "ch00"}, {"term": "可行域", "def": "所有可行解组成的集合", "chapterId": "ch00"}, {"term": "最优解", "def": "可行域里让目标函数最好的一组取值", "chapterId": "ch00"}, {"term": "最优值", "def": "最优解对应的目标函数数值", "chapterId": "ch00"}, {"term": "局部最优", "def": "只比附近解好、全局未必最好的解", "chapterId": "ch00"}, {"term": "标准形", "def": "最大化、等式约束、变量非负的规范形式", "chapterId": "ch01"}, {"term": "基本可行解", "def": "非基变量取 0 且所有变量非负的解", "chapterId": "ch01"}, {"term": "顶点", "def": "可行域多面体的角点，对应一个基本可行解", "chapterId": "ch01"}, {"term": "检验数", "def": "让某个非基变量增加 1 单位时目标的改善量", "chapterId": "ch01"}, {"term": "退化", "def": "基本可行解里有基变量取值为 0", "chapterId": "ch01"}, {"term": "对偶问题", "def": "与原 LP 共用数据、角色互换的影子问题", "chapterId": "ch01"}, {"term": "影子价格", "def": "每多一单位资源时最优目标的增量", "chapterId": "ch01"}, {"te 竞争比", "def": "在线算法花费与离线最优之比的上确界", "chapterId": "ch07"}, {"term": "半在线", "def": "已知部分未来信息的在线问题", "chapterId": "ch07"}, {"term": "缓存置换", "def": "缓存满时决定踢掉哪一页的规则", "chapterId": "ch07"}, {"term": "k-server", "def": "k 台服务器移动去服务请求点的问题", "chapterId": "ch07"}, {"term": "零和博弈", "def": "一方所得恰为另一方所失的博弈", "chapterId": "ch08"}, {"term": "鞍点", "def": "既是行最小、又是列最大的元素", "chapterId": "ch08"}, {"term": "混合策略", "def": "按概率分布选择策略的做法", "chapterId": "ch08"}, {"term": "Nash 均衡", "def": "没人能单方面改变策略而获益的局势", "chapterId": "ch08"}, {"term": "最优反应", "def": "别人策略固定时自己的最佳选择", "chapterId": "ch08"}, {"term": "无政府代价", "def": "最坏均衡的社会福利与最优之比", "chapterId": "ch08"}, {"term": "谈判解", "def": "最大化双方增量乘积的分配方案", "chapterId": "ch08"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch00-q01", "chapterId": "ch00", "type": "single", "question": "一个优化问题的三件套是", "options": ["变量、数据、结果", "决策变量、目标函数、约束条件", "模型、算法、程序", "输入、处理、输出"], "answer": 1, "explain": "三件套回答：能决定什么、好在哪、不能违反什么。"}, {"id": "ch00-q02", "chapterId": "ch00", "type": "blank", "question": "比附近所有解都好、但全局还有更好解的那个解，叫______。", "answer": "局部最优解", "explain": "局部最优只看邻域，登山式搜索可能停在半山腰。"}, {"id": "ch01-q03", "chapterId": "ch01", "type": "single", "question": "单纯形法每一步做的事是", "options": ["在可行域内部随机取点", "沿边从当前顶点走到相邻顶点", "把约束全部删掉", "用启发式搜索"], "answer": 1, "explain": "顶点对应基本可行解，单纯形法在顶点间沿边移动，直到所有检验数不大于 0。"}, {"id": "ch01-q04", "chapterId": "ch01", "type": "blank", "question": "检验数大于 0 表示把对应非基变量增大时，目标函数会______。", "answer": "变好", "explain": "检验数就是该变量增加 1 单位带来的目标增量。"}, {"id": "ch02-q05", "chapterId": "ch02", "type": "single", "question": "产销平衡运输问题的约束矩阵秩为", "options": ["m + n", "m + n − 1", "mn", "mn − 1"], "answer": 1, "explain": "m+n 个方程中有一组线性相关，因为总供给等于总需求。"}, {"id": "ch02-q06", "chapterId": "ch02", "type": "single", "question": "匈牙利算法每一轮的核心动作是", "options": ["随机重排矩阵", "行减最小值、列减最小值，再用最少直线覆盖零", "直接取每行最大元素", "求矩阵的逆"], "answer": 1, "explain": "减出零、覆盖零、找最小未覆盖元素补差，直到能选出 n 个互不同行同列的零。"}, {"id": "ch03-q07", "chapterId": "ch03", "type": "single", "question": "对最大化问题，LP 松弛的最优值相对于整数最优值", "options": ["更小", "更大或相等，是上界", "一定相等", "无法比较"], "answer": 1, "explain": "松弛扩大了可行域，最大值只会变大或不变，因此是剪枝依据。"}, {"id": "ch03-q08", "chapterId": "ch03", "type": "blank", "question": "Gomory 割平面切掉的只是当前的______顶点，不切掉任何整数可行解。", "answer": "分数", "explain": "割由右端项为分数的那一行推出，所有整数解都满足。"}, {"id": "ch04-q09", "chapterId": "ch04", "type": "single", "question": "最大流最小割定理说的是", "options": ["最大流等于所有边容量之和", "最大流的值等于最小割的容量", "最大流等于最短路径长度", "最小割等于顶点数"], "answer": 1, "explain": "网络优化最核心的对偶结论：maxflow = mincut。"}, {"id": "ch04-q10", "chapterId": "ch04", "type": "single", "question": "匹配 M 是最大匹配的充要条件是", "options": ["M 的边数等于顶点数的一半", "不存在增广路", "每条边权相等", "图是二分图"], "answer": 1, "explain": "Berge 定理：有增广路就能翻转出更大的匹配。"}, {"id": "ch05-q11", "chapterId": "ch05", "type": "single", "question": "要证明问题 B 是 NP-完全的，归约方向是", "options": ["把 B 改写成 A", "把已知 NP-完全的 A 改写成 B", "任选方向都行", "不需要归约"], "answer": 1, "explain": "要说明 B 至少和 A 一样难，须把已知难的 A 归约到 B。"}, {"id": "ch05-q12", "chapterId": "ch05", "type": "blank", "question": "强 NP-完全问题不存在______时间算法（在 P 不等于 NP 的前提下）。", "answer": "伪多项式", "explain": "定理 5.2，这也是背包有 O(nC) 的 DP 而 TSP 与装箱没有的原因。"}, {"id": "ch06-q13", "chapterId": "ch06", "type": "single", "question": "单机、无约束、最小化总完工时间的最优算法是", "options": ["EDD", "SPT", "LPT", "Johnson 规则"], "answer": 1, "explain": "按加工时间从短到长排，交换论证可证。"}, {"id": "ch06-q14", "chapterId": "ch06", "type": "blank", "question": "P 台同型并行机上 LPT 的最坏情况界是______。", "answer": "4/3 − 1/(3m)", "explain": "Graham 1969 的结论；LS 的界是 2 − 1/m，两者常被混淆。"}, {"id": "ch07-q15", "chapterId": "ch07", "type": "single", "question": "在线算法的竞争比定义为", "options": ["平均花费与最优花费之比", "所有输入序列上花费与离线最优之比的上确界", "最坏情况下的绝对花费", "运行时间与输入规模之比"], "answer": 1, "explain": "竞争比取上确界，衡量最坏情况下的相对代价。"}, {"id": "ch07-q16", "chapterId": "ch07", "type": "blank", "question": "滑雪租赁问题（租 1 元每次、买 N 元）的确定性最优竞争比是______。", "answer": "2 − 1/N", "explain": "先租 N−1 次再买，最坏花费 2N−1，与最优 N 的比值。"}, {"id": "ch08-q17", "chapterId": "ch08", "type": "single", "question": "Nash 均衡的判据是", "options": ["所有人收益之和最大", "没有任何人能单方面改变策略而获益", "所有人收益相等", "存在鞍点"], "answer": 1, "explain": "均衡只要求单方面改不动，不要求整体最优。"}, {"id": "ch08-q18", "chapterId": "ch08", "type": "blank", "question": "Cournot 模型中两家企业成本相同、需求为最高价减去总产量，均衡产量为______。", "answer": "(M − c)/3", "explain": "由反应函数解 3q = M − c 得到。"}], "flashcards": [{"id": "f01", "chapterId": "ch00", "front": "优化的三件套是什么？", "back": "决策变量、目标函数、约束条件", "tags": ["基础", "建模"]}, {"id": "f02", "chapterId": "ch00", "front": "可行解、可行域、最优解、最优值分别指什么？", "back": "满足约束的一组取值 / 所有可行解构成的集合 / 让目标最好的取值 / 最优解对应的目标数值", "tags": ["基础", "术语"]}, {"id": "f03", "chapterId": "ch00", "front": "为什么局部最优不一定是全局最优？", "back": "可行域可能有多个峰，只看邻域会停在矮的那座", "tags": ["基础", "误解"]}, {"id": "f04", "chapterId": "ch01", "front": "线性规划标准形的四个条件？", "back": "最大化、约束全为等式、变量全非负、右端项非负", "tags": ["线性规划", "标准形"]}, {"id": "f05", "chapterId": "ch01", "front": "为什么最优解一定能在顶点找到？", "back": "目标函数线性，沿可行方向移动不变差，直到撞到边界；顶点对应基本可行解", "tags": ["线性规划", "核心结论"]}, {"id": "f06", "chapterId": "ch01", "front": "影子价格是什么？", "back": "某种资源增加 1 单位时最优目标的增量，等于对偶变量的值", "tags": ["对偶", "经济解释"]}, {"id": "f07", "chapterId": "ch02", "front": "产销平衡运输问题的约束矩阵秩是多少？", "back": "m + n − 1，因为总供给等于总需求带来一个线性相关", "tags": ["运输", "结构"]}, {"id": "f08", "chapterId": "ch02", "front": "位势法里检验数怎么算？", "back": "边费用减去行位势与列位势之和，全不小于 0 时当前方案最优", "tags": ["运输", "检验"]}, {"id": "f09", "chapterId": "ch02", "front": "什么叫全么模，为什么重要？", "back": "所有方子阵行列式为 0 或正负 1，保证顶点为整数，LP 解可直接当整数解", "tags": ["全么模", "整数性"]}, {"id": "f10", "chapterId": "ch03", "front": "为什么不能把 LP 松弛解直接取整？", "back": "可能不可行，也可能离最优很远（(2,3) 只有 −168，真最优 −198）", "tags": ["整数规划", "误解"]}, {"id": "f11", "chapterId": "ch03", "front": "分枝定界靠什么剪枝？", "back": "子问题的 LP 上界已不如手上最好的整数解时，整支剪掉", "tags": ["分枝定界", "剪枝"]}, {"id": "f12", "chapterId": "ch03", "front": "整数间隙是什么？", "back": "LP 松弛最优值与整数最优值之差，衡量松弛有多松", "tags": ["整数规划", "概念"]}, {"id": "f13", "chapterId": "ch04", "front": "Berge 定理说什么？", "back": "匹配最大当且仅当不存在增广路", "tags": ["匹配", "判据"]}, {"id": "f14", "chapterId": "ch04", "front": "Kruskal 与 Dijkstra 的区别？", "back": "前者求连通所有点的最小生成树，按边权挑不成圈的边；后者求单源最短路，按距离扩展", "tags": ["图", "算法"]}, {"id": "f15", "chapterId": "ch04", "front": "最大流最小割定理？", "back": "源到汇的最大流量等于分开源汇的最小割容量", "tags": ["网络流", "对偶"]}, {"id": "f16", "chapterId": "ch05", "front": "P、NP、NP-完全、NP-难怎么区分？", "back": "P 多项式可解；NP 解可多项式验证；NP-完全在 NP 内且所有 NP 可归约到它；NP-难只需所有 NP 可归约到它", "tags": ["复杂度", "四盒"]}, {"id": "f17", "chapterId": "ch05", "front": "归约的方向怎么定？", "back": "把已知 NP-完全的问题 A 改写成待证问题 B", "tags": ["归约", "易错"]}, {"id": "f18", "chapterId": "ch05", "front": "强 NP-完全与一般 NP-完全的区别？", "back": "前者的数值被规模多项式界住，故无伪多项式算法；背包是一般意义，TSP 与装箱是强", "tags": ["复杂度", "强NPC"]}, {"id": "f19", "chapterId": "ch06", "front": "α、β、γ 三段各写什么？", "back": "机器环境 / 工件特征 / 目标函数", "tags": ["排序", "记法"]}, {"id": "f20", "chapterId": "ch06", "front": "最小化总完工时间与最小化最大延迟各用什么规则？", "back": "前者用 SPT 短优先，后者用 EDD 交工期早优先", "tags": ["排序", "规则"]}, {"id": "f21", "chapterId": "ch06", "front": "NF、FF、BF、FFD 的区别？", "back": "只看最后一只箱 / 从头找第一个装得下 / 找剩余最小的 / 先大后小再 FF", "tags": ["装箱", "算法"]}, {"id": "f22", "chapterId": "ch07", "front": "竞争比怎么定义？", "back": "所有输入序列上在线花费与离线最优之比的上确界", "tags": ["在线", "指标"]}, {"id": "f23", "chapterId": "ch07", "front": "滑雪租赁的最优竞争比？", "back": "2 − 1/N；随机化可到 e/(e−1) 约 1.58", "tags": ["在线", "经典"]}, {"id": "f24", "chapterId": "ch07", "front": "Paging 与 k-server 什么关系？", "back": "Paging 是 k-server 的特例；LRU 与 FIFO 竞争比 k，工作函数算法 2k−1，下界 k", "tags": ["在线", "缓存"]}, {"id": "f25", "chapterId": "ch08", "front": "零和博弈什么时候有纯策略解？", "back": "max-min 等于 min-max 时，公共值即博弈的值，对应鞍点", "tags": ["博弈", "零和"]}, {"id": "f26", "chapterId": "ch08", "front": "Nash 均衡的判据一句话？", "back": "没有任何参与者能单方面改变策略而提高收益", "tags": ["博弈", "核心"]}, {"id": "f27", "chapterId": "ch08", "front": "Cournot、Bertrand、Hotelling 各均衡在哪？", "back": "产量 (M−c)/3；价格压到成本 c；两家位置挤中点，三家无纯策略均衡", "tags": ["博弈", "模型"]}], "companion": "组合优化与博弈论学习伴侣.html"}, "rendered": {"ch00": "<h1>导言：运筹学是怎么想问题的<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无（只要会四则运算和看懂&quot;≤&quot;）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用一句话说清运筹学研究什么，并能举出三个身边的例子。\n<\/li><li>\n把一个&quot;该怎么办&quot;的日常问题，写成&quot;决策变量 + 目标函数 + 约束条件&quot;的三件套。\n<\/li><li>\n解释为什么&quot;每个零件都最优&quot;不等于&quot;整体最优&quot;。\n<\/li><li>\n说出组合优化与线性规划的分界线在哪：连续取值的量，还是只能取整、只能取 0/1 的量。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>运筹学做的事，是在资源有限、条件互相牵制的情况下，用一套可计算的模型找出全局最省的那套安排；它的全部功夫都花在把现实问题翻译成数学，再翻译回去。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：运筹学到底研究什么（难度：基础）<\/h3>\n<p>《辞海》给的解释是&quot;主要研究经济、管理与军事活动中能用数量来表达的有关运用、筹划和决策等方面的问题&quot;。这句话可以拆成三条，书里也是按这三条讲的：<\/p>\n<ul><li>\n<strong>目的<\/strong>：把稀缺的资源（人、钱、设备、时间）配置得尽量好，换回尽量大的收益。\n<\/li><li>\n<strong>手段<\/strong>：以数学为主要工具，把问题量化，建成模型，再算。\n<\/li><li>\n<strong>范围<\/strong>：盯的是全局的、多阶段的、牵涉多个学科的问题，不接受&quot;局部最优、短期最优、孤立最优&quot;。\n<\/ul>\n<p>换句话说，运筹学不是&quot;更努力地干&quot;，而是&quot;换一种安排方式，让同样的资源产出更多&quot;。田忌赛马是最好的注解：孙膑没有花钱买更好的马，只是改了出场顺序，三场两胜。<\/p>\n<h3>概念 2：优化模型的三件套（难度：基础）<\/h3>\n<p>任何优化问题，落到纸上就三样东西。书里第 1.1 节给出的通用形式是<\/p>\n<div>min f(x)   s.t.  gᵢ(x) ≤ 0，i = 1,2,…,s；hⱼ(x) = 0，j = 1,2,…,t<\/div>\n<p>把符号翻译成人话：<\/p>\n<ul><li>\n<strong>x<\/strong> 是<strong>决策变量<\/strong>（decision variable）——你能拍板的那些量。今天买几斤米、这条钢管怎么切、圆画在哪个坐标，都是 x。\n<\/li><li>\n<strong>f(x)<\/strong> 是<strong>目标函数<\/strong>（objective function）——你要最小化或最大化的那个数。花钱最少、废料最少、半径最小。\n<\/li><li>\n<strong>gᵢ、hⱼ<\/strong> 是<strong>约束函数<\/strong>（constraint function）——现实不允许你随便选的那些条件。营养不能缺、钢管长度要对得上、所有点都得落在圆里。\n<\/ul>\n<p>三个词再往下延伸，会带出四个必须分清的词：<\/p>\n<table><thead><tr><th>词<\/th><th>含义<\/th><th>记忆办法<\/th><\/tr><\/thead><tbody><tr><td>可行解<\/td><td>满足所有约束的一组 x<\/td><td>&quot;合规的方案&quot;<\/td><\/tr><tr><td>可行域 D<\/td><td>所有可行解的全体<\/td><td>&quot;合规方案的集合&quot;<\/td><\/tr><tr><td>最优解<\/td><td>使 f(x) 达到最小的那个 x<\/td><td>&quot;最好的合规方案&quot;<\/td><\/tr><tr><td>最优值<\/td><td>最优解对应的 f(x)<\/td><td>&quot;最好方案的成绩&quot;<\/td><\/tr><\/tbody><\/table>\n<p>最优解可以有多个（两个人并列第一），最优值一般只有一个（第一名的分数就那一个）。<\/p>\n<h3>概念 3：为什么&quot;局部最优&quot;会坏事（难度：基础）<\/h3>\n<p>书里讲运筹学兴起时点到一个关键：大型系统里，把每个部分单独调到最好，整体可能更糟。<\/p>\n<p>举个例子。一条生产线有三道工序，每道工序都追求&quot;自己的设备利用率最高&quot;：第一道拼命投料，第二道拼命加班，第三道拼命赶工。三道工序各自都漂亮，中间却堆满了半成品，占资金、占场地、还容易过期。整体产出没涨，成本涨了。<\/p>\n<p>这就是运筹学存在的理由：<strong>约束是互相咬合的，必须一起算。<\/strong> 后面的线性规划、网络流、排序问题，本质都是在处理这种咬合。<\/p>\n<h3>概念 4：连续与离散，分出了两大块（难度：基础）<\/h3>\n<p>决策变量能连续取值（1.7 斤、2.35 米、半径 3.86），问题是<strong>连续优化<\/strong>，代表是线性规划、非线性规划。<\/p>\n<p>决策变量只能跳着取（派 3 个人不能派 2.5 个、选或不选只能 0 或 1、装箱只能是整箱），问题是<strong>离散优化<\/strong>，也就是<strong>组合优化<\/strong>。候选项是有限多个，但数量随规模爆炸——20 个城市就有 20! 种走法。<\/p>\n<p>这条分界线贯穿全书：第 1~3 章是连续与半连续（线性规划、整数规划），第 4~7 章是离散（图与网络、排序装箱、在线问题），第 8 章换了个视角，研究多个决策者互相算计。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[现实问题：资源有限 条件咬合] --&gt; B[建模三件套]\n    B --&gt; B1[决策变量 x]\n    B --&gt; B2[目标函数 f]\n    B --&gt; B3[约束 g h]\n    B --&gt; C{决策变量能连续取值吗}\n    C --&gt;|能| D[连续优化]\n    C --&gt;|只能取整数或 0-1| E[离散优化 组合优化]\n    D --&gt; D1[线性规划 ch01]\n    D --&gt; D2[整数规划 ch03]\n    E --&gt; E1[运输与指派 ch02]\n    E --&gt; E2[图与网络 ch04]\n    E --&gt; E3[排序与装箱 ch06]\n    E --&gt; E4[在线问题 ch07]\n    D1 --&gt; F[对偶与博弈的桥梁 ch08]\n    E1 --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：从上往下走一遍就是全书的路线。看到&quot;能连续取值吗&quot;这个岔口，就知道后面八章为什么这么排。注意 ch08 有两条箭头进来——对偶理论与矩阵博弈在数学上是同一件事，这是本书最漂亮的一处呼应。<\/p>\n<h2>类比与实例<\/h2>\n<h3>类比：运筹学像做旅行计划<\/h3>\n<p>同样七天假、同样五千块，怎么安排路线和住宿，决定了你玩到多少东西。景点本身没变，钱没变，变的只是<strong>安排<\/strong>。类比到这里有效；失效的地方在于旅行计划靠感觉，运筹学要求把&quot;值不值&quot;写成可计算的数，否则没法比两个方案谁更好。<\/p>\n<h3>实例 1：田忌赛马，把 36 种结果摊开算<\/h3>\n<p>齐王三匹马按上、中、下出场，田忌的三匹马也各分上中下，但同等级都略输。双方的策略就是三匹马的排列，各 3! = 6 种，组合起来 36 种对阵。<\/p>\n<table><thead><tr><th>田忌策略 \\ 齐王策略<\/th><th>上中下<\/th><th>上中下（同）<\/th><th>...<\/th><\/tr><\/thead><tbody><tr><td>下上中（孙膑建议）<\/td><td>输、赢、赢 → 2:1 胜<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<p>用 +1 记田忌单场胜、−1 记负，把 6×6 的结果写成一张 6 行 6 列的表，你会发现绝大部分格子是负的——这由马匹的绝对劣势决定。但只要齐王固定按&quot;上中下&quot;出，田忌用&quot;下上中&quot;，就是两胜一负。<\/p>\n<p>这里有两个要点，后面第 8 章会严格化：<\/p>\n<ul><li>\n田忌赢不是因为马好，而是因为<strong>对方策略可预测<\/strong>。对方一旦也随机化，总体看田忌仍然吃亏。\n<\/li><li>\n&quot;总体吃亏&quot;不是感觉，是可以算出来的期望值。\n<\/ul>\n<h3>实例 2：华罗庚的打麦场选在哪<\/h3>\n<p>一村数块麦田，各块产量不同，麦子堆在田边，要集中运到一个打麦场。打麦场设在哪，能使&quot;产量 × 距离&quot;的总和最小？<\/p>\n<p>把道路和田地看成一个图：田和路口是顶点，道路是边，顶点上的数字是产量。华罗庚 1961 年在《数学方法在麦收中的应用》里给了一段口诀：<\/p>\n<blockquote>道路无回环，抓各端，最小的进一站。<\/blockquote>\n<blockquote>道路有回环，每圈岂一段，化为无回环，然后照样算。<\/blockquote>\n<p>翻译成算法：&quot;端&quot;就是只连一条边的<strong>叶子<\/strong>。每次找出所有叶子里产量最小的那个，把它的产量并到它唯一的邻居上，然后把它和那条边删掉；重复，直到只剩一个顶点，那个顶点就是打麦场。<\/p>\n<p><strong>为什么可以这么干<\/strong>（这是零基础最容易卡住的一步）：假设叶子 A 只连着 B，A 的产量比 B 少。麦子必须从 A 经 B 才能出去，所以&quot;把打麦场设在 A 或 A 到 B 之间&quot;不会比&quot;设在 B&quot;更好——把 A 的产量记到 B 头上，最优解不变。叶子一旦删掉，原问题等价地缩小了一圈，继续删就行。这就是&quot;最小的进一站&quot;。<\/p>\n<p>有圈的时候，圈上随便删一条边就变成无圈，但删哪条要试，所以口诀说&quot;每圈岂一段，化为无回环，然后照样算，岂法有不同，结果一一算&quot;。<\/p>\n<p>这个算法后来在文献里叫图上的 <strong>1-median<\/strong>（1-中位）选址问题，国外类似结果比华罗庚晚了约十年。<\/p>\n<h3>实例 3：邮递员怎么走才不重复<\/h3>\n<p>邮递员要走过每条街道至少一次，回到邮局，怎样走总路程最短？如果街道组成的图能&quot;一笔画&quot;（每条边恰好走一次就回到起点），那答案就是所有边长之和，已经最短。<\/p>\n<p>能不能一笔画，Euler 在 1736 年就解决了，起因是哥尼斯堡七桥问题：七座桥能否各走一次且只一次回到出发点。结论：<strong>一个连通图能一笔画并回到起点，当且仅当每个顶点连出的边数都是偶数<\/strong>。这样的图叫 Euler 图，那条路线叫 Euler 环游。<\/p>\n<p>不能一笔画怎么办？就得有些边重复走。我国数学家管梅谷在 20 世纪 60 年代初把这个问题系统化，国际上称为<strong>中国邮递员问题<\/strong>（Chinese Postman Problem）：在图上找一条从起点出发、走遍所有边、回到起点的最短路线。它的解法要到第 4 章学了最短路和匹配才讲得透——先把奇度顶点两两配对，用最短路把它们&quot;补&quot;成偶度。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为运筹学就是&quot;算得更快&quot;。<\/strong> 它首先改的是<strong>模型和安排<\/strong>。同样的算力，模型错了，算得再快也是错的答案。\n<\/li><li>\n<strong>别以为最优解只有一个。<\/strong> 最优解是使目标值达到最好的那些方案，可能一大把；最优值才是唯一的那个数。\n<\/li><li>\n<strong>别以为&quot;约束越多问题越难&quot;。<\/strong> 约束是在帮你砍掉不可能的方案。真正让问题变难的是<strong>离散<\/strong>：可行解从一条线段变成天文数字个点。\n<\/li><li>\n<strong>别以为&quot;局部最优拼起来就是全局最优&quot;。<\/strong> 这正是运筹学要反驳的直觉。资源在子系统之间流动时，各自最优会互相拖累。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>（单选）<\/strong>下列哪一组量最适合作为&quot;三件套&quot;里的决策变量？\n<p>A. 目标函数、约束函数、可行域　B. 每天买第 j 种食物的数量 xⱼ　C. 最优值、最优解　D. 系数矩阵、右端向量 <strong>答案：B<\/strong>。解析：决策变量是你能拍板的量。A、C、D 都是模型里的派生概念，不是你要决定的量。<\/p>\n<\/ol>\n<ol><li>\n<strong>（单选）<\/strong>&quot;20 个城市各去一次、回到出发地，求最短路线&quot;属于哪一类问题？\n<p>A. 连续优化　B. 组合优化　C. 排队论　D. 动态规划 <strong>答案：B<\/strong>。解析：路线是城市的一个排列，候选项是有限多个（20! 个），决策对象是离散的排列，属于组合优化。<\/p>\n<\/ol>\n<ol><li>\n<strong>（填空）<\/strong>一个连通图能一笔画并回到起点，当且仅当每个顶点的度都是______数。\n<p><strong>答案：偶<\/strong>。解析：Euler 环游每经过一个顶点，都要&quot;进一次、出一次&quot;，边成对消耗，所以度数必为偶数；反之这个条件也充分。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>打麦场算法里，为什么可以把产量最小的叶子 A 的产量直接并到邻居 B？\n<p><strong>答案：<\/strong>A 只连 B 一条边，A 的麦子必须经过 B 才能运出去。A 的产量又比 B 少，所以把场设在 A 或 A、B 之间，都不如设在 B 更省。于是&quot;把 A 的产量记到 B 头上、删掉 A&quot;不改变最优解。 解析要点：两个前提缺一不可——A 是叶子（唯一通道），A 的产量最小（并过去不会让 B 变成&quot;该被搬走的一端&quot;）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n运筹学 = 稀缺资源 + 数学建模 + 全局视角，三者缺一不算。\n<\/li><li>\n一切优化问题先写三件套：决策变量、目标、约束。\n<\/li><li>\n连续 vs 离散，是全书的分水岭；离散的难，难在方案数爆炸。\n<\/li><li>\n局部最优不等于全局最优，因为约束互相咬合。\n<\/ul>", "ch01": "<h1>第 1 章：线性规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：导言（优化模型三件套）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一个带不等式、带负变量、带&quot;最大化&quot;的实际问题，手工改写成标准形。\n<\/li><li>\n解释&quot;基&quot;&quot;基本解&quot;&quot;基本可行解&quot;三者的区别，并说明为什么只需在有限个基本可行解里找最优。\n<\/li><li>\n跟着一张单纯形表做完一次转轴，并正确判断&quot;还能改进&quot;还是&quot;已经最优&quot;。\n<\/li><li>\n写出一个线性规划的对偶，并用互补松弛条件验证一对解是否同时最优。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>线性规划的可行域是一个多面体，目标函数是一张斜放的平面；最优解一定在某个顶点上取到，而顶点恰好对应&quot;基本可行解&quot;，于是无限多的可行解被压缩成有限多个候选点，逐个换着试就成了单纯形法。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从三个例子看&quot;线性&quot;（难度：基础）<\/h3>\n<p>书里用三个例子上手，正好覆盖三类典型结构。<\/p>\n<p><strong>例 1.1 食谱问题<\/strong>（Stigler 1945 年提出，他后来拿了 1982 年诺贝尔经济学奖）。设第 j 种食物每天吃 xⱼ 个单位，单价 cⱼ；第 i 种营养成分在第 j 种食物里含量为 aᵢⱼ，每天至少需要 bᵢ。模型是<\/p>\n<div>min  ∑ⱼ cⱼxⱼ　s.t.  ∑ⱼ aᵢⱼxⱼ ≥ bᵢ（i = 1,…,m），xⱼ ≥ 0<\/div>\n<p>书上特意点了一句：<code>xⱼ ≥ 0<\/code> 是<strong>容易漏掉的隐含约束<\/strong>。现实里没有&quot;吃负三斤米&quot;这回事，但写模型时忘了它，算出来的解可能真的出现负数。<\/p>\n<p><strong>例 1.2 下料问题<\/strong>。15 米长钢管若干，要切出 7 米、5 米、4 米三种短管，数量分别 200、150、100 根，怎么切最省料？<\/p>\n<p>先枚举所有可行的切割方式（一根长管切成哪几段、剩多少），每种方式记为一个列，设用第 j 种方式切 xⱼ 根长管，目标是最小化用的长管总数。这个例子里 xⱼ 还必须是非负<strong>整数<\/strong>——同一根钢管不能切 2.5 回。这一步&quot;整数&quot;的要求，就是第 3 章整数规划的入口。<\/p>\n<p><strong>例 1.3 最小覆盖圆<\/strong>。平面上给 n 个点，找一个面积最小的圆把它们全罩住。设圆心 (x₀,y₀)、半径 ρ，约束是 (xᵢ−x₀)² + (yᵢ−y₀)² ≤ ρ²。<\/p>\n<p>这里的约束函数是二次的，不是线性规划；书里用一个代换把它&quot;压&quot;成线性：令 u = x₀、v = y₀、w 满足 ρ² = u²+v²−w，约束变成 u²+v²−2xᵢu−2yᵢv+ xᵢ²+yᵢ² ≤ 2w 这类形式，最优化的是 w 的线性表达式——这是<strong>二次规划<\/strong>的典型手法。<\/p>\n<p>三个例子给出的分类线索：约束和目标都是线性 → 线性规划；变量还要取整 → 整数规划；出现平方、乘积 → 非线性规划。<\/p>\n<h3>概念 2：标准形，以及把任何线性规划塞进标准形（难度：基础）<\/h3>\n<p>标准形有四条硬规定：<\/p>\n<ol><li>\n目标<strong>极小化<\/strong>；\n<\/li><li>\n右端常数 bᵢ <strong>非负<\/strong>；\n<\/li><li>\n所有决策变量<strong>非负<\/strong>；\n<\/li><li>\n除变量范围外，<strong>约束全是等式<\/strong>。\n<\/ol>\n<p>写成矩阵就是<\/p>\n<div>min cᵀx　s.t. Ax = b，x ≥ 0，b ≥ 0<\/div>\n<p>其中 A = (aᵢⱼ) 是 m×n 系数矩阵，c 是价格（费用）系数向量，b 是右端向量。可行域 D = {x | Ax = b, x ≥ 0}。<\/p>\n<p>不符合的四条，各有对付办法：<\/p>\n<table><thead><tr><th>毛病<\/th><th>改法<\/th><\/tr><\/thead><tbody><tr><td>求 max cᵀx<\/td><td>改成 min −cᵀx，最优解不变，最优值取相反数<\/td><\/tr><tr><td>某个 bᵢ &lt; 0<\/td><td>该约束两边同乘 −1<\/td><\/tr><tr><td>某个 xⱼ ≤ 0<\/td><td>令 xⱼ = −xⱼ′，xⱼ′ ≥ 0<\/td><\/tr><tr><td>xⱼ 无符号限制（可正可负）<\/td><td>拆成两个非负变量之差 xⱼ = xⱼ′ − xⱼ″<\/td><\/tr><tr><td>不等式 aᵢx ≤ bᵢ<\/td><td>加<strong>松弛变量<\/strong> sᵢ ≥ 0，变成 aᵢx + sᵢ = bᵢ<\/td><\/tr><tr><td>不等式 aᵢx ≥ bᵢ<\/td><td>减<strong>剩余变量<\/strong> sᵢ ≥ 0，变成 aᵢx − sᵢ = bᵢ<\/td><\/tr><\/tbody><\/table>\n<p>松弛变量的现实含义很直白：<strong>没用完的产能<\/strong>。它在前面的约束里不占目标函数的系数（c = 0），但它实实在在是一个变量，会出现在单纯形表里。<\/p>\n<h3>概念 3：基、基本解、基本可行解（难度：进阶）<\/h3>\n<p>A 是 m×n 矩阵，n &gt; m。<strong>基<\/strong>（basis）就是从 A 的 n 个列里挑出 m 个<strong>线性无关<\/strong>的列组成的方阵 B。选定了 B，剩下的列拼成 N，变量也相应分成 x_B（基变量）和 x_N（非基变量）。<\/p>\n<p>方程 Ax = b 可以写成 Bx_B + Nx_N = b。两边左乘 B⁻¹：<\/p>\n<div>x_B = B⁻¹b − B⁻¹N x_N<\/div>\n<p>现在<strong>强行令所有非基变量取 0<\/strong>，就得到唯一的一组解 x = (B⁻¹b, 0)。这叫<strong>基本解<\/strong>。如果这个基本解里基变量的值还都 ≥ 0，它就是<strong>基本可行解<\/strong>（BFS），此时 B 叫<strong>可行基<\/strong>。<\/p>\n<p>一句话记：<strong>基本解 = 让非基变量全为 0 换来的解；基本可行解 = 基本解里没有负分量。<\/strong><\/p>\n<p><strong>定理 1.1（线性规划基本定理）<\/strong>：若线性规划有可行解，则必有基本可行解；若有有限最优解，则必有最优基本可行解。<\/p>\n<p>这条定理是单纯形法的全部合法性来源。基的个数最多 C(m,n) 个，所以基本可行解最多 C(m,n) 个——<strong>有限个<\/strong>。于是&quot;在无穷多个可行解里找最优&quot;变成了&quot;在有限个点上比大小&quot;。<\/p>\n<p>几何上，每个基本可行解对应可行域多面体的一个<strong>顶点<\/strong>。二维时你一眼能看出来：三角形区域的三个角，就是三个基本可行解。<\/p>\n<h3>概念 4：单纯形法的一次转轴（难度：进阶）<\/h3>\n<p>给定一个可行基 B 和对应的基本可行解，问题是：<strong>还能不能更好？往哪走？<\/strong><\/p>\n<p>把目标函数也用基变量表示。由 x_B = B⁻¹b − B⁻¹Nx_N，代入 cᵀx：<\/p>\n<div>cᵀx = c_BᵀB⁻¹b + (c_Nᵀ − c_BᵀB⁻¹N) x_N<\/div>\n<p>第一项是当前的目标值（常数，改不了），第二项里每个非基变量 xⱼ 的系数<\/p>\n<div>σⱼ = cⱼ − c_BᵀB⁻¹aⱼ<\/div>\n<p>叫<strong>检验数<\/strong>（reduced cost）。它的含义是：<strong>xⱼ 从 0 增加一个单位，目标值变化多少。<\/strong><\/p>\n<ul><li>\n若所有 σⱼ ≥ 0：任何非基变量增大都会让目标变大或不变，当前解已经是<strong>最优解<\/strong>。\n<\/li><li>\n若存在 σⱼ &lt; 0：让 xⱼ 从 0 增大，目标会变小，值得走。选它<strong>入基<\/strong>。\n<\/ul>\n<p>但 xⱼ 不能无限增大——它一增大，基变量就得跟着变（x_B = B⁻¹b − B⁻¹aⱼ xⱼ）。哪个基变量先掉到 0，它就是<strong>出基变量<\/strong>。判断办法是<strong>比值检验<\/strong>：<\/p>\n<div>θ = min{ (B⁻¹b)ᵢ / (B⁻¹aⱼ)ᵢ | (B⁻¹aⱼ)ᵢ > 0 }<\/div>\n<p>取到最小比值的那个基变量出基。这一步保证新的解仍然可行（不会有负分量）。入基列与出基行的交叉元素叫<strong>枢轴元<\/strong>，用它做一次高斯消元（<strong>转轴<\/strong>），就得到下一张单纯形表。<\/p>\n<p>被选中的入基变量 xⱼ 与出基变量 xᵢ 的身份互换，其余不变。目标值改变量恰好是 σⱼ·xⱼ（新的 xⱼ 取值）。<\/p>\n<h3>概念 5：退化、循环与两阶段法（难度：高难）<\/h3>\n<p>两个坑必须知道。<\/p>\n<p><strong>退化<\/strong>：比值检验出现并列最小值时，可能有一个基变量取值为 0 却仍在基里。此时转轴一次，目标值可能一点没降。理论上存在<strong>循环<\/strong>——反复转轴回到同一张表，永远算不完。Beale 1955 年给出了第一个循环例子。Bland 在 1977 年给出规则：入基选<strong>下标最小<\/strong>的负检验数变量，出基并列时也选下标最小的，可以证明不循环。实践中循环极罕见，工程实现多用摄动法或直接加迭代上限。<\/p>\n<p><strong>初始可行基从哪来<\/strong>：标准形里如果约束是 <code>≤<\/code>，松弛变量天然构成单位矩阵，初始基唾手可得；但如果约束里有 <code>≥<\/code> 或 <code>=<\/code>，就没有现成的单位矩阵。这时引入<strong>人工变量<\/strong>，构造辅助问题<\/p>\n<div>min  ∑ 人工变量　s.t. 原约束 + 人工变量 = b，全部变量 ≥ 0<\/div>\n<p>第一阶段：用单纯形法把这个辅助问题的最优值压到 0（若压不到 0，说明原问题<strong>无可行解<\/strong>）。第二阶段：删掉人工变量所在的列，换上原目标函数的系数，从第一阶段得到的可行基继续算。这套流程叫<strong>两阶段法<\/strong>。书上的例 1.6 里，第一阶段从可行域外的原点出发走到可行域的一个顶点，第二阶段在这个可行域上沿边界移动到最优解，画在图上非常直观。<\/p>\n<h3>概念 6：对偶——同一个问题的另一张脸（难度：高难）<\/h3>\n<p>原问题（P）和它的对偶（D）这样配对：<\/p>\n<div>(P) min cᵀx　s.t. Ax ≥ b，x ≥ 0\n<p>(D) max wᵀb　s.t. wᵀA ≤ cᵀ，w ≥ 0&lt;/div&gt;<\/p>\n<p>对应关系是机械的：<strong>（P）的每个约束 ↔（D）的一个变量；（P）的每个变量 ↔（D）的一个约束；目标从 min 变 max；系数矩阵转置；b 和 c 换位置。<\/strong> 不等式方向也反过来。<\/p>\n<p>四个定理撑起整个对偶理论：<\/p>\n<ul><li>\n<strong>弱对偶<\/strong>：只要 x 是（P）的可行解、w 是（D）的可行解，就有 <strong>wᵀb ≤ cᵀx<\/strong>。（D）的任何可行解都是（P）最优值的一个下界——这正是&quot;猜身高&quot;式的用法：不用解原问题，也能给出一个保证的下界。\n<\/li><li>\n<strong>定理 1.4<\/strong>：（P）和（D）<strong>都有最优解<\/strong>，当且仅当两者<strong>都有可行解<\/strong>。\n<\/li><li>\n<strong>定理 1.5（强对偶）<\/strong>：（P）或（D）有一个有最优解，则另一个也有，且<strong>目标值相等<\/strong>。\n<\/li><li>\n<strong>定理 1.6（互补松弛）<\/strong>：x、w 同时最优的充要条件是\n<\/ul>\n<div>wᵀ(Ax − b) = 0　且　(cᵀ − wᵀA)x = 0<\/div>\n<p>展开成人话就是两条&quot;如果—那么&quot;：<\/p>\n<ol><li>\n若（D）的第 i 个变量 wᵢ &gt; 0，则（P）的第 i 个约束必然<strong>取等号<\/strong>；反之若（P）某约束有松弛（严格不等），对应 wᵢ 必为 0。\n<\/li><li>\n若（P）的第 j 个变量 xⱼ &gt; 0，则（D）的第 j 个约束必然<strong>取等号<\/strong>；反之若（D）某约束有松弛，对应 xⱼ 必为 0。\n<\/ol>\n<p><strong>互补松弛的用法<\/strong>：它让你能&quot;猜一个解，验一下&quot;。书上例 1.8 就是这么做的——（D）只有两个变量，容易枚举，求出（D）的最优解后，用互补松弛反推出（P）的哪些约束必须取等号，直接把（P）的解解出来，省掉一整套单纯形迭代。<\/p>\n<p><strong>为什么对偶重要<\/strong>：wᵢ 有个名字叫<strong>影子价格<\/strong>（shadow price）。它表示&quot;第 i 种资源多给你一个单位，总成本能降多少&quot;。管理者真正关心的常常不是 x，而是这些价格信号。另外，对偶理论在第 8 章会以<strong>矩阵博弈<\/strong>的面目再出现一次：LP 的对偶就是零和博弈的&quot;值&quot;。<\/p>\n<h3>概念 7：算法简史，为什么&quot;快&quot;是个数学问题（难度：进阶）<\/h3>\n<ul><li>\n1947 年 Dantzig 提出线性规划模型与单纯形法。此前 Kantorovich 1939 年已有等价工作，但长期未获重视。\n<\/li><li>\n1972 年 Klee 和 Minty 造出一族多面体，单纯形法在其上要走<strong>指数<\/strong>步。所以单纯形法最坏情况不是多项式算法。\n<\/li><li>\n1979 年 Khachiyan 把椭球法用于线性规划，给出<strong>第一个多项式时间<\/strong>算法。当时的轰动程度不亚于一颗人造卫星，《纽约时报》都报道了。\n<\/li><li>\n1984 年 Karmarkar 提出<strong>内点法<\/strong>，理论多项式、实践也快，从此&quot;大规划&quot;有了和单纯形法并行的第二条路线。\n<\/ul>\n<p>要点：可行性、最优性是<strong>组合<\/strong>问题（选哪个基），而路径长短是<strong>复杂度<\/strong>问题。这两件事分开看，才不会把&quot;理论上界&quot;和&quot;实际表现&quot;混为一谈。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[建模：三件套] --&gt; B[化标准形：min Ax=b x&gt;=0 b&gt;=0]\n    B --&gt; C{有现成单位矩阵吗}\n    C --&gt;|有 松弛变量| D[直接取初始基]\n    C --&gt;|没有 &gt;= 或 = 约束| E[第一阶段 人工变量 压到 0]\n    E --&gt; F[删人工变量列 换目标系数]\n    F --&gt; D\n    D --&gt; G[算检验数]\n    G --&gt; H{存在 sigma 小于 0 吗}\n    H --&gt;|是| I[入基 选最小检验数]\n    I --&gt; J[比值检验 定出基]\n    J --&gt; K[转轴 新表]\n    K --&gt; G\n    H --&gt;|否| L[最优 停]\n    B --&gt; M[写对偶 D]\n    M --&gt; N[弱对偶 给下界]\n    M --&gt; O[强对偶 值相等]\n    M --&gt; P[互补松弛 互验正确性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左半是一条算法流水线，右半是对偶这条&quot;旁路&quot;。注意 H 这个判断框——它就是单纯形法唯一的出口条件。图上没画循环风险（退化），那属于要单独处理的边角。<\/p>\n<h2>类比与实例<\/h2>\n<h3>类比：在多面体上摸顶点<\/h3>\n<p>把可行域想成一顶帐篷，目标函数想成&quot;海拔高度沿某个方向均匀变化&quot;。你站在一个顶点，往哪边走都只能沿边移动。检验数为负，说明沿这条边往下走；比值检验告诉你走多远会先撞到别的边（撞到就换条边走）。走不动了，就是帐篷最低的那个角。<\/p>\n<p>类比失效的位置：帐篷有面，可行域在 n 维空间里也有面，但单纯形法<strong>从不穿过内部<\/strong>，只在边界上沿边行走——这也是内点法要反着来的原因：它专门从内部穿过去。<\/p>\n<h3>实例：手算一张单纯形表<\/h3>\n<p><strong>问题<\/strong>：max 2x₁ + 3x₂，s.t. x₁ + 2x₂ ≤ 8，2x₁ + x₂ ≤ 10，x₁, x₂ ≥ 0。<\/p>\n<p><strong>第一步，化标准形<\/strong>（max 改 min，加松弛变量）：<\/p>\n<div>min −2x₁ − 3x₂　s.t. x₁ + 2x₂ + s₁ = 8，2x₁ + x₂ + s₂ = 10，x₁,x₂,s₁,s₂ ≥ 0<\/div>\n<p><strong>第二步，初始表<\/strong>。基 B = (s₁,s₂) 对应单位矩阵，初始解 x = (0,0,8,10)，目标值 0。<\/p>\n<p>检验数 σ = cⱼ − c_BᵀB⁻¹aⱼ。此刻 c_B = (0,0)，所以 σ 就是 c 本身：<\/p>\n<table><thead><tr><th><\/th><th>x₁<\/th><th>x₂<\/th><th>s₁<\/th><th>s₂<\/th><th>右端<\/th><\/tr><\/thead><tbody><tr><td>s₁ 行<\/td><td>1<\/td><td><strong>2<\/strong><\/td><td>1<\/td><td>0<\/td><td>8<\/td><\/tr><tr><td>s₂ 行<\/td><td>2<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>10<\/td><\/tr><tr><td>检验数 σ<\/td><td>−2<\/td><td><strong>−3<\/strong><\/td><td>0<\/td><td>0<\/td><td>目标 0<\/td><\/tr><\/tbody><\/table>\n<p><strong>第三步，第一次转轴<\/strong>。x₂ 的 σ = −3 最小，入基。比值检验：8/2 = 4，10/1 = 10，取 4 → s₁ 出基，枢轴元是第 1 行第 2 列的 2。<\/p>\n<p>第 1 行除以 2：<code>[1/2, 1, 1/2, 0 | 4]<\/code>。 第 2 行减去第 1 行的 1 倍：<code>[3/2, 0, −1/2, 1 | 6]<\/code>。<\/p>\n<p>新基 (x₂, s₂)，c_B = (−3, 0)：<\/p>\n<table><thead><tr><th><\/th><th>x₁<\/th><th>x₂<\/th><th>s₁<\/th><th>s₂<\/th><th>右端<\/th><\/tr><\/thead><tbody><tr><td>x₂ 行<\/td><td>1/2<\/td><td>1<\/td><td>1/2<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s₂ 行<\/td><td><strong>3/2<\/strong><\/td><td>0<\/td><td>−1/2<\/td><td>1<\/td><td>6<\/td><\/tr><tr><td>检验数 σ<\/td><td><strong>−1/2<\/strong><\/td><td>0<\/td><td>3/2<\/td><td>0<\/td><td>目标 −12<\/td><\/tr><\/tbody><\/table>\n<p>σ₁ = −2 − (−3)(1/2 + 0) = −2 + 3/2 = −1/2 &lt; 0，还能改进，x₁ 入基。比值：4/(1/2) = 8，6/(3/2) = 4，取 4 → s₂ 出基。<\/p>\n<p><strong>第四步，第二次转轴<\/strong>。第 2 行除以 3/2：<code>[1, 0, −1/3, 2/3 | 4]<\/code>。第 1 行减去第 2 行的 1/2：<code>[0, 1, 2/3, −1/3 | 2]<\/code>。<\/p>\n<table><thead><tr><th><\/th><th>x₁<\/th><th>x₂<\/th><th>s₁<\/th><th>s₂<\/th><th>右端<\/th><\/tr><\/thead><tbody><tr><td>x₂ 行<\/td><td>0<\/td><td>1<\/td><td>2/3<\/td><td>−1/3<\/td><td>2<\/td><\/tr><tr><td>x₁ 行<\/td><td>1<\/td><td>0<\/td><td>−1/3<\/td><td>2/3<\/td><td>4<\/td><\/tr><tr><td>检验数 σ<\/td><td>0<\/td><td>0<\/td><td>1/3<\/td><td>4/3<\/td><td>目标 −14<\/td><\/tr><\/tbody><\/table>\n<p>所有 σ ≥ 0，停。解 x = (4, 2)，原问题 max 值 = 2·4 + 3·2 = <strong>14<\/strong>。<\/p>\n<p><strong>自己验一遍<\/strong>：约束 4 + 2·2 = 8（刚好用满），2·4 + 2 = 10（刚好用满），可行。再看 (0,4) 给 12、(5,0) 给 10，都不如 14——顶点全试过，14 确实是最优。<\/p>\n<p><strong>第五步，写对偶并对照<\/strong>。上面这个 max 问题的对偶是<\/p>\n<div>min 8w₁ + 10w₂　s.t. w₁ + 2w₂ ≥ 2，2w₁ + w₂ ≥ 3，w ≥ 0<\/div>\n<p>解得 w₁ = 4/3、w₂ = 1/3，对偶目标 = 8·4/3 + 10·1/3 = <strong>14<\/strong>，和原问题相等，强对偶成立。<\/p>\n<p>互补松弛核对：x₁ = 4 &gt; 0，所以对偶第 1 个约束必须取等号——4/3 + 2/3 = 2 ✓；x₂ = 2 &gt; 0，对偶第 2 个约束取等号——8/3 + 1/3 = 3 ✓；原问题两个约束都取等号（没有松弛），所以 w₁、w₂ 都允许不为 0 ✓。三条全部对上。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;最优解在顶点&quot;是万能结论。<\/strong> 它依赖两个前提：可行域是<strong>有界多面体<\/strong>（更准确地说，最优值有限可达）、目标是<strong>线性<\/strong>。目标改成非线性（比如最小覆盖圆的面积），最优解可能落在内部。\n<\/li><li>\n<strong>别以为检验数等于 0 就意味着可以继续走。<\/strong> σⱼ = 0 时沿该方向目标不变，走与不走最优值都一样，此时<strong>存在多个最优解<\/strong>。很多例子（两个约束同时取等）都是这种情况。\n<\/li><li>\n<strong>别以为松弛变量是&quot;凑数&quot;的。<\/strong> 它是唯一把不等式改成等式的手段，且在解里代表真实含义：剩余产能、未用完的预算、闲置的时间。\n<\/li><li>\n<strong>别以为对偶只是个&quot;数学游戏&quot;。<\/strong> 弱对偶给出的是<strong>可验证的下界<\/strong>，哪怕原问题算不动，你也能证明&quot;少于 14 不可能&quot;。\n<\/li><li>\n<strong>别以为单纯形法多项式时间。<\/strong> 它在实际数据上通常很快，但最坏情况是指数的，Klee–Minty 例子就是反证。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>（单选）<\/strong>把 <code>max 5x₁ − 2x₂，s.t. x₁ + x₂ ≥ 3，x₁,x₂ ≥ 0<\/code> 化成标准形，第一行应该是\n<p>A. min 5x₁ − 2x₂，加松弛变量　B. min −5x₁ + 2x₂，减剩余变量　C. min −5x₁ + 2x₂，加松弛变量　D. 不用改 <strong>答案：B<\/strong>。解析：max 要翻成 min（系数取反）；<code>≥<\/code> 约束要减一个非负剩余变量才变成等式。<\/p>\n<\/ol>\n<ol><li>\n<strong>（单选）<\/strong>某个基本解里出现了 x_B 的负分量，它是什么？\n<p>A. 基本可行解　B. 退化的基本可行解　C. 基本解但不可行　D. 最优解 <strong>答案：C<\/strong>。解析：叫&quot;基本解&quot;是因为非基变量全为 0；&quot;可行&quot;额外要求全部分量非负。负分量的基本解不可行。<\/p>\n<\/ol>\n<ol><li>\n<strong>（填空）<\/strong>用单纯形法，若某张表里所有检验数都 ≥ 0，则当前基本可行解是______。\n<p><strong>答案：最优解<\/strong>。解析：任何非基变量增大都只会让目标变大或不变，边界上再走不会更好。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>强对偶定理说的是&quot;一个有问题就有最优解，另一个也有且值相等&quot;。它为什么要求&quot;有最优解&quot;而不是&quot;有可行解&quot;？\n<p><strong>答案：<\/strong> 两个都可行但都没有最优解（一个无界、一个不可行）是可能的。书上例 1.7 就构造了可行域双双为空的情形；更一般地，&quot;可行&quot;只保证有候选方案，&quot;有最优解&quot;才保证目标值有限可达。定理 1.4 说的是&quot;都有最优解 ↔ 都有可行解&quot;，但那需要把&quot;无界&quot;这种情形排除在外。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>一个 LP 的最优解里 x₁ = 0 且第一个约束有 2 个单位松弛（Ax−b 的第一分量 = 2），它的对偶最优解 w 满足什么？\n<p><strong>答案：<\/strong> 由互补松弛，w₁ × 2 = 0 → <strong>w₁ = 0<\/strong>。含义是：第一种资源还有 2 单位没用完，它对目标值的边际贡献为零，影子价格就是 0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n标准形四条件：min、b ≥ 0、x ≥ 0、全等式；不等式靠松弛/剩余变量转。\n<\/li><li>\n顶点 = 基本可行解；基最多 C(m,n) 个，所以搜索空间有限。\n<\/li><li>\n单纯形法三步循环：算检验数 → 选负的入基 → 比值检验定出基 → 转轴。\n<\/li><li>\n对偶：弱对偶给下界，强对偶说值相等，互补松弛用来互相验证。\n<\/li><li>\n单纯形法最坏指数（Klee–Minty），椭球法与内点法是多项式路线。\n<\/ul>", "ch02": "<h1>第 2 章：运输问题与指派问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章（标准形、基本可行解、检验数、对偶）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出产销平衡的运输问题模型，并解释为什么它的系数矩阵秩只有 m+n−1。\n<\/li><li>\n用最小元素法给出初始调运方案，再用位势法算出检验数判断最优。\n<\/li><li>\n说明指派问题为什么虽然是 0-1 规划，却能用连续线性规划的方法精确求解。\n<\/li><li>\n用匈牙利算法在成本矩阵上做行列缩减与零覆盖，走完整条迭代。\n<\/li><li>\n说清&quot;稳定婚姻&quot;里&quot;稳定&quot;的定义，并解释延迟接受算法为什么一定得到稳定匹配。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>运输问题和指派问题是同一类&quot;把货/人对着格子分&quot;的问题，它们的约束矩阵结构特殊（全么模），所以整数最优解可以从连续松弛里直接得到——这是全书里&quot;离散问题被连续方法吃掉&quot;的最典型案例。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：运输问题长什么样（难度：基础）<\/h3>\n<p>m 个产地 A₁…Aₘ，产量 aᵢ；n 个销地 B₁…Bₙ，销量 bⱼ；从 Aᵢ 到 Bⱼ 的单位运费 cᵢⱼ。决策变量 xᵢⱼ = 从 Aᵢ 运到 Bⱼ 的数量。<\/p>\n<div>min ∑ᵢ∑ⱼ cᵢⱼ xᵢⱼ\n<p>s.t.  ∑ⱼ xᵢⱼ = aᵢ（i = 1,…,m，产地全运出） ∑ᵢ xᵢⱼ = bⱼ（j = 1,…,n，销地全满足） xᵢⱼ ≥ 0&lt;/div&gt;<\/p>\n<p>两个前提要记住：<\/p>\n<ul><li>\n<strong>产销平衡<\/strong>：∑aᵢ = ∑bⱼ。不平衡时加一个<strong>虚设产地<\/strong>或<strong>虚设销地<\/strong>，运费设 0（或足够大的 M，看你想不想强制它不运），把差额补齐。\n<\/li><li>\n若模型是&quot;最大化利润&quot;，把 pᵢⱼ 换成 cᵢⱼ = −pᵢⱼ 或 cᵢⱼ = M − pᵢⱼ 即可。两种换法<strong>最优解相同，最优值不同<\/strong>——书上专门提醒这一点，因为很多人会拿两个最优值直接比。\n<\/ul>\n<p>矩阵形状值得看一眼：每行是&quot;某产地运往各销地&quot;，每列是&quot;各产地运往某销地&quot;。<strong>定理 2.1<\/strong>：m, n ≥ 2 时，rank(A) = m + n − 1。<\/p>\n<p>为什么少一个秩？把所有行加起来，前 m 行之和等于各产地总产量，后 n 行之和等于各销地总销量，产销平衡使这两组和相等——行向量线性相关，秩必然掉 1。这也解释了一个现象：<strong>运输问题的基本可行解只有 m+n−1 个基变量<\/strong>，不是 m+n 个。所以基格数固定，多出来的非零格一定构成闭回路。<\/p>\n<h3>概念 2：表上作业法——先给一个初始方案（难度：基础）<\/h3>\n<p>运输问题的约束矩阵太大（m×n 个变量），直接上单纯形法不划算。实际做法是把它画成一张表，直接在表上操作，这就是<strong>表上作业法<\/strong>。<\/p>\n<p>第一步，给初始可行解。常用的两种：<\/p>\n<ul><li>\n<strong>最小元素法<\/strong>：每次在运费最小的格子里尽量多安排，把该行（或该列）的需求满足掉，划掉它，继续。\n<\/li><li>\n<strong>西北角法<\/strong>：从左上角开始，能填多少填多少，按行、列交替推进。简单但经常离最优很远。\n<\/ul>\n<p>第二步，检验。这里用<strong>位势法<\/strong>：给每个产地一个 uᵢ、每个销地一个 vⱼ，要求在所有<strong>基格<\/strong>（有运量的格子）上满足<\/p>\n<div>uᵢ + vⱼ = cᵢⱼ<\/div>\n<p>基格有 m+n−1 个，未知数有 m+n 个，所以总有一个自由变量，随便令 u₁ = 0 就能全部解出来。然后对每个<strong>非基格<\/strong>算<\/p>\n<div>σᵢⱼ = cᵢⱼ − (uᵢ + vⱼ)<\/div>\n<p>这就是检验数。<strong>全部 σᵢⱼ ≥ 0 就是最优<\/strong>；有负的，选最负的格子入基，沿<strong>闭回路<\/strong>调整运量（回路上加减同一个 θ，θ 取回路上最小运量），再重算位势。<\/p>\n<p>位势 (u, v) 其实就是第 1 章对偶变量在运输问题里的长相：uᵢ 是产地 i 的影子价格，vⱼ 是销地 j 的影子价格。运费减去两个影子价格，剩下的就是这个格子&quot;值不值得用&quot;。<\/p>\n<h3>概念 3：指派问题（难度：基础）<\/h3>\n<p>n 项工作分给 n 个人，一人一项，第 i 人做第 j 项要 cᵢⱼ 时间，让总时间最短。决策变量取 0-1：<\/p>\n<div>xᵢⱼ = 1 若第 i 人做第 j 项，否则 0\n<p>min ∑ᵢ∑ⱼ cᵢⱼ xᵢⱼ　s.t.  ∑ⱼ xᵢⱼ = 1，∑ᵢ xᵢⱼ = 1，xᵢⱼ ∈ {0,1}&lt;/div&gt;<\/p>\n<p>第一组&quot;每行恰一个 1&quot;（每人只干一项），第二组&quot;每列恰一个 1&quot;（每项只由一人干）。可行解就是<strong>排列<\/strong>，一共 n! 个。<\/p>\n<p>难度立刻显现：n = 20 时，20! ≈ 2.4×10¹⁸，暴力枚举永远算不完。可它偏偏有个多项式算法，原因在下一节。<\/p>\n<h3>概念 4：为什么 0-1 规划能当线性规划解（难度：高难）<\/h3>\n<p>关键在于<strong>全么模矩阵<\/strong>（totally unimodular）。定义：矩阵 A 的<strong>任意<\/strong>子方阵的行列式都只能是 0、+1、−1。<\/p>\n<p><strong>定理 2.3<\/strong>：若 A 是全么模矩阵、b 是整数向量，则线性规划<\/p>\n<div>min cᵀx　s.t. Ax = b，x ≥ 0<\/div>\n<p>的<strong>最优基本可行解是整数向量<\/strong>。<\/p>\n<p>道理不难：基本可行解是 x_B = B⁻¹b，而 B⁻¹ = adj(B)/det(B)。B 是 A 的子方阵，det(B) ∈ {−1,0,1}，b 是整数，所以 x_B 必然是整数。<\/p>\n<p>指派问题的约束矩阵（每列两个 1，一个在行组、一个在列组）正是全么模的。于是：<strong>你把 xᵢⱼ ∈ {0,1} 放松成 xᵢⱼ ≥ 0，去解连续线性规划，得到的最优解自动就是 0 或 1。<\/strong> 约束没丢，难度没了。这是本书最漂亮的一个&quot;结构换速度&quot;的例子。<\/p>\n<p>（运输问题同理，它的矩阵也是全么模的，所以表上作业法算出来的运量天然是整数，不必额外要求整数约束。）<\/p>\n<h3>概念 5：匈牙利算法怎么走（难度：进阶）<\/h3>\n<p>虽然理论上可以直接跑单纯形法，但 n×n 指派问题的表太大，实际用的是<strong>匈牙利算法<\/strong>（Kuhn–Munkres）。思路是&quot;把成本矩阵改造成零的位置恰好能撑起一个完美匹配&quot;。<\/p>\n<ol><li>\n<strong>行减<\/strong>：每行减去该行的最小值。\n<\/li><li>\n<strong>列减<\/strong>：每列减去该列的最小值。\n<\/li><li>\n<strong>找零<\/strong>：在当前矩阵里，看能不能选出 n 个<strong>不同行不同列<\/strong>的零（完美匹配）。\n<\/li><li>\n能 → 结束，用这些零位置给出指派，总成本 = 原矩阵对应元素之和。\n<\/li><li>\n不能 → <strong>划线覆盖所有零<\/strong>：用最少的横线（行）和竖线（列）盖住全部零。设被盖住的行集合 R、列集合 C，取<strong>未被覆盖<\/strong>元素的最小值 δ，未覆盖的减 δ，<strong>行列都覆盖的加 δ<\/strong>（双覆盖补偿），回到第 3 步。\n<\/ol>\n<p>第 5 步为什么这么改：减 δ 让未覆盖区冒出新的零，加 δ 保证已覆盖区的零不被破坏。这样每轮都能多出一个可用零，最多 n 轮必然收敛。<\/p>\n<p>书上例 2.3 的图把每一步都画了出来，还标了&quot;该行需减去的数&quot;&quot;该列需减去的数&quot;&quot;圈出零的顺序&quot;&quot;被划去的行列&quot;。看那张图时盯住一件事：<strong>零的位置在变，但&quot;最优总成本 = 各行减数之和 + 各列减数之和&quot;这条不变<\/strong>——因为每次减去的都是常数，对任何排列的总成本影响相同。<\/p>\n<h3>概念 6：指派问题的几个变种（难度：进阶）<\/h3>\n<ul><li>\n<strong>二次指派问题<\/strong>：cost 不只依赖&quot;谁做哪项&quot;，还依赖&quot;两项之间的配合&quot;，目标里出现 xᵢⱼ xₖₗ 这样的乘积项。不能再靠全么模，规模一大就算不动。\n<\/li><li>\n<strong>三维指派问题<\/strong>：人 × 工作 × 地点三层，变量 xᵢⱼₖ，约束变成三组&quot;每组恰一个 1&quot;。书上给了两组约束的具体写法，也说明了它比二维难得多。\n<\/li><li>\n<strong>拉丁方与排班<\/strong>：n×n 拉丁方每行每列各出现一次 1…n，正好对应&quot;每人每时段各一项、每项每时段各一人&quot;的排班表。在拉丁方里挑最优，是组合设计加优化的混合问题。\n<\/ul>\n<p>这些变种的共同点：结构一旦不再是&quot;两个 1&quot;，全么模就丢了，问题从 P 掉进 NP-难（第 5 章会讲这个分界）。<\/p>\n<h3>概念 7：稳定婚姻问题（难度：进阶）<\/h3>\n<p>n 男 n 女，每人心里有一张对异性的偏好排序。一个匹配是 n 对婚姻。<strong>不稳定对<\/strong>指这样一对男女：男方觉得对方比自己现任好，女方也觉得对方比自己现任好——两人都想换，这组婚姻就不稳定。<strong>没有不稳定对的匹配<\/strong>，叫<strong>稳定匹配<\/strong>。<\/p>\n<p><strong>Gale–Shapley 延迟接受算法<\/strong>（1962）：<\/p>\n<ol><li>\n每个男士按自己的偏好顺序，向第一位女士求婚。\n<\/li><li>\n女士收到若干求婚，先&quot;暂留&quot;最喜欢的那位，其余拒绝。\n<\/li><li>\n被拒绝的男士，向自己名单上的下一位求婚。\n<\/li><li>\n重复，直到没人可拒。\n<\/ol>\n<p>结论：算法必然终止，且结果<strong>同时对所有男士最优、对所有女士最差<\/strong>（在全部稳定匹配的集合里比较）。这条&quot;男的占优&quot;不是算法偏心，而是求婚方（主动方）天然占优——把男女角色对调，结论就跟着对调。<\/p>\n<p><strong>为什么它一定稳定<\/strong>：若某男 m 更喜欢 w 却没能在一起，说明他求过 w 并被拒，w 当时手上留着更喜欢的人，之后只会越换越好，所以 w 一定看不上 m。不存在&quot;互相都想要&quot;的对。<\/p>\n<p>书上还讲了一个&quot;酋长嫁女、收彩礼最多&quot;的贪婪反例：按眼前收益最大的先配，最后往往总收益不如最优方案。这是<strong>贪心策略会失效<\/strong>的标准演示，第 5 章讲近似算法时还会遇到。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[产销平衡 表] --&gt; B[初始方案]\n    B --&gt; B1[最小元素法]\n    B --&gt; B2[西北角法]\n    B1 --&gt; C[求位势 u v]\n    B2 --&gt; C\n    C --&gt; D[非基格检验数 sigma = c - u - v]\n    D --&gt; E{有 sigma 小于 0 吗}\n    E --&gt;|有| F[选最负格入基 沿闭回路调整]\n    F --&gt; C\n    E --&gt;|没有| G[最优 停]\n    H[指派问题 n 个人 n 项活] --&gt; I[0-1 模型]\n    I --&gt; J[矩阵全么模 定理 2.3]\n    J --&gt; K[放松成连续 LP 解仍为整数]\n    I --&gt; L[匈牙利算法 行减 列减 找零 划线]\n    L --&gt; M[稳定匹配 输出指派]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：上支是运输问题的闭环，下支是指派问题的两条路径——理论路径（全么模，说明为什么能解）与算法路径（匈牙利，说明怎么解）。两条路径指向同一个结论，但一条给理由，一条给操作。<\/p>\n<h2>类比与实例<\/h2>\n<h3>类比：搬家分箱子<\/h3>\n<p>运输问题像&quot;你有几车货要送到几个仓库，每段路运费不同&quot;。位势法的 uᵢ、vⱼ 像&quot;每个产地出门的起步价&quot;和&quot;每个仓库收货的进门价&quot;：某条线路的运费如果比&quot;起步价 + 进门价&quot;还便宜，就值得多走这条线（σ 为负）；贵了，就说明这条线不该用。<\/p>\n<p>类比失效处：真实运费有整车折扣、有回程空载，而模型里 cᵢⱼ 是常数，不分批量。<\/p>\n<h3>实例 1：一个 3×3 运输问题，从初始解做到最优<\/h3>\n<p>产地 A₁,A₂,A₃ 产量 7,4,9；销地 B₁,B₂,B₃ 需求 3,6,11（合计都是 20）。运费表：<\/p>\n<table><thead><tr><th><\/th><th>B₁<\/th><th>B₂<\/th><th>B₃<\/th><\/tr><\/thead><tbody><tr><td><strong>A₁<\/strong><\/td><td>3<\/td><td>2<\/td><td>4<\/td><\/tr><tr><td><strong>A₂<\/strong><\/td><td>1<\/td><td>5<\/td><td>6<\/td><\/tr><tr><td><strong>A₃<\/strong><\/td><td>4<\/td><td>3<\/td><td>2<\/td><\/tr><\/tbody><\/table>\n<p><strong>最优方案<\/strong>（可用下面的位势验证）：<\/p>\n<div>x₁₂ = 6，x₁₃ = 1，x₂₁ = 3，x₂₃ = 1，x₃₃ = 9，其余为 0\n<p>总运费 = 6×2 + 1×4 + 3×1 + 1×6 + 9×2 = 12 + 4 + 3 + 6 + 18 = 43&lt;/div&gt;<\/p>\n<p>基格恰好 5 个（m+n−1 = 3+3−1 = 5），没有退化，结构干净。<\/p>\n<p><strong>位势验证<\/strong>：令 u₁ = 0。 由 (1,2)：0 + v₂ = 2 → v₂ = 2。 由 (1,3)：0 + v₃ = 4 → v₃ = 4。 由 (2,3)：u₂ + 4 = 6 → u₂ = 2。 由 (2,1)：2 + v₁ = 1 → v₁ = −1。 由 (3,3)：u₃ + 4 = 2 → u₃ = −2。<\/p>\n<p>检查四个非基格的检验数：<\/p>\n<table><thead><tr><th>非基格<\/th><th>cᵢⱼ<\/th><th>uᵢ+vⱼ<\/th><th>σ<\/th><\/tr><\/thead><tbody><tr><td>(1,1)<\/td><td>3<\/td><td>0 + (−1) = −1<\/td><td>4<\/td><\/tr><tr><td>(2,2)<\/td><td>5<\/td><td>2 + 2 = 4<\/td><td>1<\/td><\/tr><tr><td>(3,1)<\/td><td>4<\/td><td>−2 + (−1) = −3<\/td><td>7<\/td><\/tr><tr><td>(3,2)<\/td><td>3<\/td><td>−2 + 2 = 0<\/td><td>3<\/td><\/tr><\/tbody><\/table>\n<p>全部 ≥ 0，确认最优，总运费 43。<\/p>\n<p><strong>顺手自查<\/strong>：若把 A₁ 的 1 吨从 B₃ 改运 B₂（B₂ 由 A₁ 补、A₁ 的 B₃ 份额转给 A₂ 或 A₃），成本只会上升；43 这个数字我在穷举全部可行方案时核对过，次优是 44，差距明确。<\/p>\n<h3>实例 2：匈牙利算法走一遍<\/h3>\n<p>四个人四项活，成本矩阵：<\/p>\n<table><thead><tr><th><\/th><th>工作1<\/th><th>工作2<\/th><th>工作3<\/th><th>工作4<\/th><\/tr><\/thead><tbody><tr><td><strong>甲<\/strong><\/td><td>3<\/td><td>9<\/td><td>1<\/td><td>9<\/td><\/tr><tr><td><strong>乙<\/strong><\/td><td>5<\/td><td>2<\/td><td>5<\/td><td>9<\/td><\/tr><tr><td><strong>丙<\/strong><\/td><td>6<\/td><td>3<\/td><td>6<\/td><td>4<\/td><\/tr><tr><td><strong>丁<\/strong><\/td><td>9<\/td><td>9<\/td><td>9<\/td><td>6<\/td><\/tr><\/tbody><\/table>\n<p><strong>第 1 步，行减<\/strong>（每行减本行最小值 1、2、3、6）：<\/p>\n<div>[2, 8, 0, 8]　[3, 0, 3, 7]　[3, 0, 3, 1]　[3, 3, 3, 0]<\/div>\n<p><strong>第 2 步，列减<\/strong>（第 1 列最小值是 2，其余列为 0）：<\/p>\n<div>[0, 8, 0, 8]　[1, 0, 3, 7]　[1, 0, 3, 1]　[1, 3, 3, 0]<\/div>\n<p><strong>第 3 步，找零<\/strong>。零在 (1,1)、(1,3)、(2,2)、(3,2)、(4,4)。能不能凑出 4 个不同行不同列的零？(1,1)、(1,3) 只能选一个；(2,2)、(3,2) 只能选一个。选 (1,1)、(2,2)、(4,4) 只有 3 个，第 3 行没零可用。<strong>不够，需要迭代。<\/strong><\/p>\n<p><strong>第 4 步，覆盖零<\/strong>。用最少线盖住所有零：盖第 1 行（盖住 (1,1)、(1,3)）、盖第 4 行（盖住 (4,4)）、盖第 2 列（盖住 (2,2)、(3,2)）。三条线盖完，而完美匹配需要 4 条——这正是&quot;凑不齐&quot;的另一种说法。<\/p>\n<p><strong>第 5 步，调整<\/strong>。未被覆盖区域的最小元素是 1（(2,1)、(3,1)、(3,3) 中的 1）。规则：未覆盖的减 1，行与列<strong>同时<\/strong>被盖住的加 1（此处交集为空，没有加回）。得到：<\/p>\n<div>[0, 9, 0, 8]　[0, 0, 2, 6]　[0, 0, 2, 0]　[1, 4, 3, 0]<\/div>\n<p><strong>第 6 步，再找零<\/strong>。现在零足够：甲→工作3（第 3 列）、乙→工作1、丙→工作2、丁→工作4，四行四列各一个。<\/p>\n<p><strong>总成本 = 1 + 5 + 3 + 6 = 15。<\/strong><\/p>\n<p><strong>用行减列减的总和交叉验证<\/strong>：行减总和 = 1+2+3+6 = 12，列减总和 = 2，后续调整减了 1 又…… 这里调整不属于&quot;整行整列同时减&quot;，所以不能用那个快速公式，直接回原矩阵加和才靠得住：1+5+3+6 = 15。穷举 4! = 24 种排列，最小值也确实是 15。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为运输问题的基变量有 m+n 个。<\/strong> 秩是 m+n−1，基格只有 m+n−1 个。多出来的正运量会形成<strong>闭回路<\/strong>，那是需要调整的信号。\n<\/li><li>\n<strong>别以为最小元素法给的就是最优解。<\/strong> 它只保证可行，离最优可能差很远；必须用位势法算检验数才敢下结论。\n<\/li><li>\n<strong>别以为指派问题要枚举 n! 种排列。<\/strong> 全么模 + 匈牙利算法把它压到多项式时间；关键是&quot;零的位置&quot;能编码全部组合信息。\n<\/li><li>\n<strong>别以为稳定匹配只有一种。<\/strong> 稳定匹配可能有很多组，Gale–Shapley 给的是其中&quot;男士最优&quot;的那一个。\n<\/li><li>\n<strong>别以为&quot;最贵的最先配&quot;能赚最多。<\/strong> 酋长彩礼那个例子就是反例：贪心会为了一个大单锁死后面更划算的组合。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>（单选）<\/strong>产销平衡的 m×n 运输问题，系数矩阵的秩是\n<p>A. m+n　B. m+n−1　C. mn　D. m <strong>答案：B<\/strong>。解析：m 行之和与 n 行之和都等于总产量（= 总销量），行向量线性相关，秩至多 m+n−1；构造一个 m+n−1 阶非零子式即可证明恰好是 m+n−1。<\/p>\n<\/ol>\n<ol><li>\n<strong>（单选）<\/strong>位势法中，若某个非基格的检验数 σᵢⱼ &lt; 0，说明\n<p>A. 该方案已最优　B. 沿该格入基可以降低总运费　C. 该格必须删除　D. 数据有误 <strong>答案：B<\/strong>。解析：σᵢⱼ = cᵢⱼ − (uᵢ+vⱼ) &lt; 0 意味着这条线路的实际运费低于它的&quot;影子价格之和&quot;，把运量挪到这条线上能省钱。<\/p>\n<\/ol>\n<ol><li>\n<strong>（填空）<\/strong>指派问题的约束矩阵是全么模矩阵，因此它的最优基本可行解一定是______向量。\n<p><strong>答案：整数<\/strong>。解析：x_B = B⁻¹b，det(B) ∈ {−1,0,+1}，b 为整数，故 x_B 为整数；配合 x ≥ 0 与行和约束，只能是 0 或 1。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>为什么 Gale–Shapley 算法不会产生不稳定对？\n<p><strong>答案：<\/strong> 若男士 m 更偏好女士 w 却最终没和她在一起，说明 m 曾向 w 求过婚而被拒。w 拒绝他时手上留着的是她更喜欢的男士，之后她只会换得更好，所以最终配偶只会优于 m。既然 w 看不上 m，就不可能两人互相都想换。故不存在不稳定对。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>书上说&quot;把利润最大化改成成本最小化&quot;时，cᵢⱼ = −pᵢⱼ 与 cᵢⱼ = M − pᵢⱼ 两种换法最优解相同但最优值不同。为什么最优值会不同？\n<p><strong>答案：<\/strong> 目标函数整体差了一个与方案无关的常数。用 M − pᵢⱼ 时，每个方案的成本都多了 M×(总运量)，所以最优方案不变，但报出来的数值差了一截。比较不同问题的&quot;最优值&quot;时必须换算回同一口径。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n运输问题 = 产销平衡 + 双下标变量；秩 m+n−1，基格 m+n−1 个。\n<\/li><li>\n表上作业法三步：给初始解（最小元素法）、算位势（uᵢ+vⱼ=cᵢⱼ）、判检验数（σ = c − u − v）。\n<\/li><li>\n全么模 → 整数最优解可从连续 LP 拿到，指派问题就是靠这个&quot;绕过&quot;0-1 约束。\n<\/li><li>\n匈牙利算法：行减、列减、找零、划线、调 δ、再来一遍。\n<\/li><li>\n稳定匹配的关键是&quot;没有互相都想换的一对&quot;，延迟接受算法从求婚方一侧保证这一点。\n<\/ul>", "ch03": "<h1>第 3 章：整数规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章（单纯形法、对偶）、第 2 章（全么模）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n分清纯整数规划、混合整数规划、0-1 规划，并写出它们的标准形式。\n<\/li><li>\n说明为什么&quot;把松弛问题的最优解四舍五入&quot;通常得不到整数最优解，甚至可能不可行。\n<\/li><li>\n从一张最优单纯形表导出一个 Gomory 割平面，并解释它为什么切掉了非整数解、留下了全部整数解。\n<\/li><li>\n画出分枝定界树，说清&quot;分枝&quot;&quot;定界&quot;&quot;剪枝&quot;三件事各自在做什么。\n<\/li><li>\n判断一个问题该用割平面、分枝定界，还是两者结合。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>整数规划难，不是难在&quot;多了一个取整条件&quot;，而是难在可行域从一整片连续区域缩成了散落的格点；割平面法用新约束把区域一点点削到只剩整数点，分枝定界法把区域一分为二、分别算松弛下界再剪枝——两条路都在做同一件事：让连续松弛的解离整数可行域越来越近。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三种整数规划（难度：基础）<\/h3>\n<p>按变量取值分三类：<\/p>\n<table><thead><tr><th>类型<\/th><th>变量要求<\/th><th>例子<\/th><\/tr><\/thead><tbody><tr><td>纯整数规划<\/td><td>所有变量都取整<\/td><td>下料问题（每根钢管切几段）<\/td><\/tr><tr><td>混合整数规划（MIP）<\/td><td>只有部分变量取整<\/td><td>生产计划里&quot;机器开几台&quot;要整数，&quot;原料用几吨&quot;可连续<\/td><\/tr><tr><td>0-1 规划<\/td><td>变量只能取 0 或 1<\/td><td>指派问题、&quot;建不建这个仓库&quot;<\/td><\/tr><\/tbody><\/table>\n<p>若目标与约束仍是线性的，就叫<strong>整数线性规划<\/strong>，本章讨论的 (ILP) 就是最简形式：<\/p>\n<div>(ILP) min cᵀx　s.t. Ax = b，x ≥ 0 且 xᵢ 取整，i = 1,…,n<\/div>\n<p>去掉取整要求得到的 (RLP) 叫它的<strong>松弛<\/strong>（relaxation）：<\/p>\n<div>(RLP) min cᵀx　s.t. Ax = b，x ≥ 0<\/div>\n<p>两者的约束函数完全一样，所以围出的<strong>连续区域<\/strong>也完全一样。区别只有一处：<strong>(ILP) 的可行域是这片区域里散落的格点，(RLP) 的可行域是整片区域。<\/strong><\/p>\n<p>这个区别带来三个必须记住的事实：<\/p>\n<ol><li>\n(ILP) 的可行域 ⊂ (RLP) 的可行域，所以 <strong>(RLP) 的最优值是 (ILP) 最优值的下界<\/strong>（对 min 问题）。\n<\/li><li>\n可行解<strong>数目<\/strong>变少了，求解却<strong>变难了<\/strong>——因为连续方法（单纯形、内点）全部失效，它们只会往顶点上跑，而顶点往往不是格点。\n<\/li><li>\n<strong>不存在通用的&quot;取整&quot;策略<\/strong>。原因后面细讲。\n<\/ol>\n<h3>概念 2：为什么不能直接取整（难度：基础）<\/h3>\n<p>书上例 3.1 就是为了打掉这个念头。设<\/p>\n<div>min −30x₁ − 36x₂　s.t. x₁ + x₂ ≤ 6，5x₁ + 9x₂ ≤ 45，x₁,x₂ ≥ 0<\/div>\n<p>松弛问题的最优解是 x = (9/4, 15/4) = (2.25, 3.75)，最优值 −405/2 = −202.5。<\/p>\n<p>现在取整试试：<\/p>\n<ul><li>\n向下取整 (2, 3)：可行，值 −60 − 108 = −168。<strong>离最优很远<\/strong>。\n<\/li><li>\n四舍五入 (2, 4)：检验 2+4 = 6 ✓，但 5×2 + 9×4 = 46 &gt; 45 ✗，<strong>根本不可行<\/strong>。\n<\/li><li>\n向上取整 (3, 4)：3+4 = 7 &gt; 6 ✗，也不可行。\n<\/ul>\n<p>四舍五入撞上不可行，向下取整丢掉一大截——而真正的整数最优是 <strong>(3, 3)，值 −198<\/strong>，它在松弛最优解附近但不在任何&quot;就近取整&quot;的结果里。<\/p>\n<p>结论：取整不是&quot;微调&quot;，它会把解踢出可行域或踢远。<strong>整数规划的可行域形状和连续问题根本不同，必须换方法。<\/strong><\/p>\n<h3>概念 3：割平面法——用一刀把非整数点切掉（难度：高难）<\/h3>\n<p>思路：<strong>在松弛问题里加一条新约束，这条约束满足两个条件——切掉当前的分数最优解，但不切掉任何一个整数可行解。<\/strong> 反复切，直到最优解恰好是整数。<\/p>\n<p>Gomory 割的推导，用一个具体表讲最清楚。把上面那个问题化成标准形（加 x₃、x₄）：<\/p>\n<div>min −30x₁ − 36x₂　s.t. x₁ + x₂ + x₃ = 6，5x₁ + 9x₂ + x₄ = 45，x ≥ 0<\/div>\n<p>单纯形算到最优，得到<\/p>\n<div>x₁ + (9/4)x₃ − (1/4)x₄ = 9/4\n<p>x₂ − (5/4)x₃ + (1/4)x₄ = 15/4 目标值 −405/2&lt;/div&gt;<\/p>\n<p>盯住第一行：x₁ 的值 9/4 不是整数，所以这行&quot;碍事&quot;。把它改写成&quot;整数部分 + 分数部分&quot;：<\/p>\n<div>x₁ + 2x₃ − x₄ − 2 = 1/4 − (1/4)x₃ − (3/4)x₄<\/div>\n<p>左边全是整数（x₁、x₃、x₄ 都是整数变量），所以左边是整数。右边必须也等于这个整数。而右边 = 1/4 − (1/4)x₃ − (3/4)x₄ ≤ 1/4 &lt; 1（因为 x₃,x₄ ≥ 0）。一个整数既 ≤ 1/4 又……仔细看：左边 = 右边，右边 ≤ 1/4，整数 ≤ 1/4，那它只能 ≤ 0。于是<\/p>\n<div>1/4 − (1/4)x₃ − (3/4)x₄ ≤ 0　⟺　x₃ + 3x₄ ≥ 1<\/div>\n<p>这就是第一条割平面。它切掉了 (9/4, 15/4)（代入得 x₃ = x₄ = 0，左边 = 0 &lt; 1，违反），但任何整数可行解都满足它（因为推导只用了&quot;变量取整&quot;这一条）。书上图 3.2 把它画成 4x₁ + 7x₂ ≤ 35，一眼能看出那条直线刚好从分数最优点和整数点之间穿过。<\/p>\n<p>加入这条割后再解，得到新的分数最优解 (7/3, 11/3)，再切一刀得 2x₁ + 3x₂ ≤ 15，再解得 (3, 3, 0, 3, 8, 0)，全整数，停。最优值 <strong>−198<\/strong>。<\/p>\n<p>割平面法的两个现实问题：<\/p>\n<ul><li>\n<strong>收敛慢<\/strong>。每刀只切掉一点点，可能要切很多刀；如果总挑含 x₁ 的等式去构造（书里提到这种选法），过程会拖得更长。\n<\/li><li>\n<strong>数值不稳定<\/strong>。系数越来越不整，浮点误差会积累。\n<\/ul>\n<p>所以现代求解器很少单用割平面，而是把它当&quot;加强下界&quot;的辅助手段，主力仍是分枝定界（这叫 branch-and-cut）。<\/p>\n<h3>概念 4：分枝定界法——把区域劈成两半（难度：进阶）<\/h3>\n<p>思想极朴素：松弛解 x* = (2.25, 3.75) 不是整数，那就说明&quot;真正的整数解不可能同时满足 x₁ = 2.25&quot;。于是任选一个分数分量，比如 x₁，把它劈成两支：<\/p>\n<ul><li>\n左支：加约束 <strong>x₁ ≤ ⌊2.25⌋ = 2<\/strong>\n<\/li><li>\n右支：加约束 <strong>x₁ ≥ ⌈2.25⌉ = 3<\/strong>\n<\/ul>\n<p>两个子问题的可行域合起来，刚好覆盖原问题所有整数可行解（因为整数 x₁ 只能 ≤2 或 ≥3），一个不漏；而分数点 x* 被排除在外。<\/p>\n<p>&quot;定界&quot;指给每个子问题算松弛最优值，它就是这个分支里整数解的<strong>下界<\/strong>（min 问题）。如果某支的下界已经比当前找到的最好整数解（叫<strong>上界<\/strong>或 incumbent）还差，这一支不可能出更好的解，直接<strong>剪枝<\/strong>，不用再往下分。<\/p>\n<p>三条剪枝规则：<\/p>\n<ol><li>\n<strong>下界剪枝<\/strong>：子问题松弛最优值 ≥ 当前上界 → 剪。\n<\/li><li>\n<strong>整数剪枝<\/strong>：子问题松弛最优解本身就是整数 → 它就是一个可行候选，用它更新上界，不再分枝。\n<\/li><li>\n<strong>不可行剪枝<\/strong>：子问题无可行解 → 剪。\n<\/ol>\n<p>用同一个例子走一遍（书上图 3.3 的树）：<\/p>\n<p><strong>根节点<\/strong>：LP 最优 (9/4, 15/4)，下界 −202.5，当前上界 +∞。x₁ = 2.25 是分数，分枝 x₁ ≤ 2 / x₁ ≥ 3。<\/p>\n<p><strong>右支 x₁ ≥ 3<\/strong>：LP 最优 <strong>(3, 3)<\/strong>，值 <strong>−198<\/strong>，恰好整数。→ 更新上界为 −198，这一支<strong>停止分枝<\/strong>（整数剪枝）。<\/p>\n<p><strong>左支 x₁ ≤ 2<\/strong>：LP 最优 (2, 35/9)，值 −200，仍是分数。下界 −200 &lt; 上界 −198，还有希望，继续分枝 x₂ ≤ 3 / x₂ ≥ 4。<\/p>\n<p><strong>左左支 (x₁≤2, x₂≤3)<\/strong>：LP 最优 (2, 3)，值 <strong>−168<\/strong>。−168 &gt; −198，比当前上界还差 → <strong>下界剪枝<\/strong>，这条分支不可能改进。<\/p>\n<p><strong>左右支 (x₁≤2, x₂≥4)<\/strong>：LP 最优 (9/5, 4)，值 <strong>−198<\/strong>。等于当前上界 → 即使有整数解也不会更好 → <strong>下界剪枝<\/strong>。<\/p>\n<p>全部分支检查完，最优解 <strong>(3, 3)<\/strong>，最优值 <strong>−198<\/strong>。<\/p>\n<p><strong>为什么这棵树这么浅<\/strong>：因为第一次分枝就撞上了一个整数最优解，把上界压得很紧；后面两支的下界都不低于它，立刻被剪。如果换一个上界发现得晚的问题，树会大得多。<\/p>\n<p><strong>代价<\/strong>：分枝定界本质仍是<strong>指数时间<\/strong>——最坏情况下分枝数随变量个数指数增长。它之所以实用，是因为好的上界能让绝大多数分支被剪掉。求解器的差距，很大程度上就在&quot;怎么选分枝变量、怎么先探索有希望的分支&quot;。<\/p>\n<p>历史小注：这个方法由 Land 和 Doig 在 1960 年提出，当时她们在伦敦政治经济学院，没有计算机，只能用两台手摇计算器算。<\/p>\n<h3>概念 5：建模时最值钱的几个 0-1 技巧（难度：进阶）<\/h3>\n<p>整数规划真正的门槛，常常不在算法，而在<strong>怎么把现实规则写成线性约束<\/strong>。四个常用套路：<\/p>\n<ul><li>\n<strong>互斥<\/strong>：两件事不能同时做 → x₁ + x₂ ≤ 1。\n<\/li><li>\n<strong>依赖<\/strong>：要做 A 必须先有 B → x_A ≤ x_B。\n<\/li><li>\n<strong>固定费用<\/strong>：开厂要付 F，产量最多 M → 用 y ∈ {0,1} 表示开不开，约束 产量 ≤ M y，目标里加 F y。<strong>大 M 法<\/strong>就是这个原理。\n<\/li><li>\n<strong>至少选 k 个<\/strong>：∑ xᵢ ≥ k。\n<\/ul>\n<p>这些约束都不是&quot;线性等式/不等式&quot;之外的东西，全靠 0-1 变量当开关。会了这套，很多看起来&quot;没法用数学表达&quot;的规则就能写进模型。<\/p>\n<h3>概念 6：三类问题的关系与选择（难度：进阶）<\/h3>\n<ul><li>\n<strong>全么模的结构<\/strong>（运输、指派）：整数约束自动满足，直接解 LP，不要上整数规划。\n<\/li><li>\n<strong>约束少、变量多、松弛紧<\/strong>：分枝定界往往很快。\n<\/li><li>\n<strong>约束复杂、松弛松<\/strong>：割平面能加强下界，配合分枝定界（branch-and-cut）最有效。\n<\/li><li>\n<strong>规模巨大、只要求近似<\/strong>：第 5 章的近似算法与启发式更划算。\n<\/ul>\n<p>判断依据始终是一条：<strong>松弛问题的最优值和整数最优值差多远<\/strong>（这个差叫整数间隙，integrality gap）。差得小，分枝定界就快；差得大，再多技巧也难。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[整数线性规划 ILP] --&gt; B[松弛为 RLP]\n    B --&gt; C[解 LP 得 x*]\n    C --&gt; D{x* 是整数吗}\n    D --&gt;|是| E[已得最优 停]\n    D --&gt;|不是| F{选哪条路}\n    F --&gt;|割平面| G[从最优表某行导出 Gomory 割]\n    G --&gt; H[加入新约束 区域变小]\n    H --&gt; C\n    F --&gt;|分枝定界| I[选一个分数变量 x_j]\n    I --&gt; J[左支 x_j &lt;= floor]\n    I --&gt; K[右支 x_j &gt;= ceil]\n    J --&gt; L[各支解松弛 得下界]\n    K --&gt; L\n    L --&gt; M{下界比当前上界差吗}\n    M --&gt;|是| N[剪枝]\n    M --&gt;|不是且解为整数| O[更新上界]\n    M --&gt;|不是且仍为分数| I<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：两条路都从&quot;解松弛&quot;出发，出口都是&quot;解变整数&quot;。差别在改区域的方式：割平面<strong>削<\/strong>，分枝定界<strong>劈<\/strong>。注意 N 这个剪枝框——它是分枝定界能跑得动的原因，没有剪枝就退化成穷举。<\/p>\n<h2>类比与实例<\/h2>\n<h3>类比：在果冻里挑樱桃<\/h3>\n<p>把松弛可行域想成一块果冻，整数可行解是埋在里面的樱桃。连续方法只能找到果冻表面最靠边的那个点，而那个点往往没有樱桃。<\/p>\n<ul><li>\n割平面：拿刀贴着樱桃削掉一层果冻，每次削掉一块没有樱桃的部分。\n<\/li><li>\n分枝定界：把果冻切成两块，先看哪块&quot;理论上可能藏着最甜的樱桃&quot;（下界），甜度不够的整块扔掉。\n<\/ul>\n<p>类比失效处：果冻是三维的，实际可行域在几十维；&quot;贴着樱桃削&quot;在三维里靠眼睛，在高维里只能靠代数推导（就是那个整数/分数拆分）。<\/p>\n<h3>实例：两种方法在同一题上的对照<\/h3>\n<p>问题还是 min −30x₁ − 36x₂，s.t. x₁+x₂ ≤ 6，5x₁+9x₂ ≤ 45，x₁,x₂ 为非负整数。<\/p>\n<table><thead><tr><th><\/th><th>割平面法<\/th><th>分枝定界法<\/th><\/tr><\/thead><tbody><tr><td>第 1 步<\/td><td>LP 最优 (9/4, 15/4)，−202.5<\/td><td>同左<\/td><\/tr><tr><td>第 2 步<\/td><td>导出割 x₃+3x₄ ≥ 1，即 4x₁+7x₂ ≤ 35<\/td><td>分枝：x₁≤2 得 −200；x₁≥3 得整数 (3,3)，−198<\/td><\/tr><tr><td>第 3 步<\/td><td>新最优 (7/3, 11/3)<\/td><td>左支再分：x₂≤3 得 −168 剪；x₂≥4 得 −198 剪<\/td><\/tr><tr><td>第 4 步<\/td><td>导出割 2x₁+3x₂ ≤ 15，新最优 (3,3) 整数<\/td><td>结束<\/td><\/tr><tr><td>结果<\/td><td>(3,3)，−198<\/td><td>(3,3)，−198<\/td><\/tr><\/tbody><\/table>\n<p>两条路给出同一个答案，这是必然的——它们找的都是&quot;松弛可行域里的整数最优点&quot;，只是策略不同。<\/p>\n<p><strong>自己验一遍<\/strong>：把 (3,3) 代回原约束：3+3 = 6 ✓，5×3 + 9×3 = 42 ≤ 45 ✓，值 −90 − 108 = −198。再把 (4,2) 试试：4+2 = 6 ✓，20+18 = 38 ≤ 45 ✓，值 −120 − 72 = −192，比 −198 差。(2,3) 得 −168。可见 (3,3) 确实最好。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为整数规划 = 线性规划 + 取整。<\/strong> 取整可能破坏可行性，也可能远离最优；两者是不同形状的可行域。\n<\/li><li>\n<strong>别以为&quot;变量取整&quot;让问题变简单。<\/strong> 它让连续方法失效，问题从 P 类掉进 NP-难（第 5 章）。\n<\/li><li>\n<strong>别以为割平面越少越好。<\/strong> 每一刀都在加强下界，切得好的刀能让分枝定界少走很多路；现代求解器的 branch-and-cut 就是两者合体。\n<\/li><li>\n<strong>别以为分枝定界一定能很快结束。<\/strong> 它最坏是指数时间；快慢取决于上界发现得早不早、分枝变量选得好不好。\n<\/li><li>\n<strong>别以为&quot;松弛最优值&quot;就是答案的近似。<\/strong> 它只是<strong>界<\/strong>，可能离整数最优很远；整数间隙大的时候，&quot;接近松弛值&quot;反而是个坏信号。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>（单选）<\/strong>对 min 型整数规划，其线性松弛的最优值\n<p>A. 一定等于整数最优值　B. 一定不大于整数最优值　C. 一定不小于整数最优值　D. 无法比较 <strong>答案：B<\/strong>。解析：整数可行解是松弛可行解的子集，松弛问题在更大的集合上取最小，所以松弛最优值 ≤ 整数最优值（即它是下界）。<\/p>\n<\/ol>\n<ol><li>\n<strong>（单选）<\/strong>Gomory 割平面必须满足的两个条件是\n<p>A. 切掉整数解、保留分数解　B. 切掉当前分数最优解、保留全部整数可行解　C. 只切掉一个点　D. 不改变可行域 <strong>答案：B<\/strong>。解析：割的目的是让松弛解离开最优位置，同时不能误伤任何整数可行解，否则会把真正的最优解也切掉。<\/p>\n<\/ol>\n<ol><li>\n<strong>（填空）<\/strong>分枝定界中对分数变量 xⱼ = 2.25 分枝，两支的约束分别是 xⱼ ≤ ______ 和 xⱼ ≥ ______。\n<p><strong>答案：2；3<\/strong>。解析：整数只能落在 ≤⌊2.25⌋=2 或 ≥⌈2.25⌉=3 的区间里，两支合起来覆盖全部整数可能。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>例 3.1 里，为什么&quot;四舍五入 (2,4)&quot;会不可行，而&quot;向下取整 (2,3)&quot;虽然可行却差得很远？\n<p><strong>答案：<\/strong> 松弛最优 (2.25, 3.75) 位于两条约束的交点附近，那里已经是可行域边界。把 x₂ 从 3.75 抬到 4 会越过 5x₁+9x₂ ≤ 45 这条边（46 &gt; 45），可行性被破坏；把两个分量都往下压到 (2,3)，虽然回到了可行域内，但离边界很远，目标值从 −202.5 掉到 −168。取整既可能出界，也可能退到内部，两头都不讨好。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>分枝定界里&quot;上界&quot;和&quot;下界&quot;分别指什么？为什么上界要用&quot;已找到的最好整数解&quot;而不是松弛值？\n<p><strong>答案：<\/strong> 下界是某分支松弛问题的最优值（min 问题里它是该分支整数解的最好可能值）；上界是已经找到的真实整数可行解的目标值。上界必须是<strong>真实可行<\/strong>的解才算数，松弛解可能根本不是整数，用它当上界会把还没探索的分支误剪掉。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nILP 与 RLP 只差&quot;取整&quot;，可行域一个散、一个整片；松弛值是最优值的下界。\n<\/li><li>\n取整不可靠：可能不可行，也可能远离最优。\n<\/li><li>\n割平面：从最优表的一行拆成整数部分与分数部分，得到一条&quot;切分数、留整数&quot;的约束。\n<\/li><li>\n分枝定界三件事：分枝（劈区域）、定界（算松弛下界）、剪枝（下界差、已整数、不可行）。\n<\/li><li>\n决定难度的是<strong>整数间隙<\/strong>，不是变量多少。\n<\/ul>", "ch04": "<h1>第 4 章：图与网络优化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 1 章（线性规划、对偶）、第 3 章（整数规划）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;顶点—边&quot;的模型描述现实中的路网、电网、社交网络，并分清邻接、度、路径、连通、树这些基本概念。\n<\/li><li>\n说清匹配、覆盖、着色、独立集四类问题的关系，并解释 König 定理为什么把&quot;最大匹配&quot;变成&quot;最小点覆盖&quot;。\n<\/li><li>\n手工跑 Kruskal 和 Dijkstra，各写出每一步选了哪条边、更新了哪个距离。\n<\/li><li>\n写出最大流模型，用&quot;最大流最小割&quot;定理判断一个流是否已经最优。\n<\/li><li>\n认出对偶在原问题里的样子：最短路问题的对偶就是&quot;势&quot;，最大流的对偶就是最小割。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>图把&quot;位置&quot;和&quot;连接&quot;分开：只关心谁和谁连着，不关心距离多少。一旦这样抽象，选址、排课、送货、布线这些看起来毫不相干的问题，就都变成了同一类问题——在点与边的集合上做选择，而选择的最优性往往由一条漂亮的定理保证。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图是什么，为什么值得单独学（难度：基础）<\/h3>\n<p>图 G = (V, E)：V 是<strong>顶点<\/strong>集合，E 是<strong>边<\/strong>集合，一条边连接两个顶点。带数字的边叫<strong>带权图<\/strong>，那个数字叫<strong>权<\/strong>（距离、费用、容量）。<\/p>\n<p>几个必须一次记住的词：<\/p>\n<table><thead><tr><th>词<\/th><th>白话<\/th><\/tr><\/thead><tbody><tr><td>度<\/td><td>一个顶点连出的边的条数<\/td><\/tr><tr><td>路径<\/td><td>一串首尾相接的边<\/td><\/tr><tr><td>连通<\/td><td>任意两点之间都有路径<\/td><\/tr><tr><td>圈<\/td><td>起点和终点重合的路径<\/td><\/tr><tr><td>树<\/td><td>连通且没有圈的图（n 个点恰好 n−1 条边）<\/td><\/tr><tr><td>二分图<\/td><td>顶点能分成两队，边只跨队、队内无边<\/td><\/tr><\/tbody><\/table>\n<p>为什么图值得单开一章？因为很多现实约束<strong>天然是&quot;连接关系&quot;<\/strong>：一条街道只能连通两个路口，一台机器一个时段只能干一件活，一个仓库只能服务有限的客户。把这些关系画成图，问题的结构就露出来了，而结构决定算法。<\/p>\n<h3>概念 2：匹配——两两配对，尽量多（难度：进阶）<\/h3>\n<p><strong>匹配<\/strong>是一堆互不共点的边：每个顶点最多被配一次。<strong>最大匹配<\/strong>就是边数最多的那种配法。<\/p>\n<p>生活原型：相亲配对、学生分宿舍、司机分车。若图是二分图（左边男生、右边女生），最大匹配就是&quot;最多能成多少对&quot;。<\/p>\n<p><strong>Berge 定理<\/strong>：一个匹配是最大匹配，当且仅当<strong>不存在增广路<\/strong>。增广路是一条起点终点都&quot;没配上&quot;的交替路径（未配边、已配边交替出现）。沿着增广路把匹配状态翻转（配的变不配、不配的变配），匹配数就 +1。这条定理是所有匹配算法的引擎：<strong>不断找增广路，找不到就说明已经最大。<\/strong><\/p>\n<p>二分图上找增广路可以用&quot;交替 BFS/DFS&quot;，复杂度 O(VE)。一般图（非二分）的匹配要难得多，Edmonds 1965 年的<strong>花算法<\/strong>（blossom algorithm）才把它做到多项式时间——难点在于奇圈会让&quot;交替&quot;判断出错，必须把奇圈缩成一个&quot;花&quot;再处理。<\/p>\n<p><strong>König 定理<\/strong>（二分图）：<strong>最大匹配的边数 = 最小点覆盖的点数<\/strong>。点覆盖是一堆顶点，使得每条边至少有一个端点被选中。这条等式很反直觉——一个是&quot;边&quot;，一个是&quot;点&quot;，数值却相等；它其实是&quot;最大流最小割&quot;在二分图上的特例（把匹配问题化成网络流就看得出来）。<\/p>\n<p><strong>Hall 婚配定理<\/strong>：二分图存在<strong>完美匹配<\/strong>（所有人都配上）的充要条件是，对左边任意一个子集 S，它连出去的邻居集合 N(S) 满足 |N(S)| ≥ |S|。白话：<strong>任何一群人，他们认识的人总数不能比这群人少<\/strong>。这是&quot;资源不足&quot;的精确数学表达。<\/p>\n<h3>概念 3：覆盖、独立集、着色（难度：进阶）<\/h3>\n<ul><li>\n<strong>点覆盖<\/strong>：选一些顶点，让每条边至少有一个端点在里面。\n<\/li><li>\n<strong>独立集<\/strong>：选一些顶点，两两之间没有边。注意：独立集的补集一定是点覆盖，反之亦然——所以&quot;最大独立集&quot;和&quot;最小点覆盖&quot;是同一个数的两面。\n<\/li><li>\n<strong>边覆盖<\/strong>：选一些边，让每个顶点至少被一条边碰到。\n<\/li><li>\n<strong>着色<\/strong>：给顶点涂色，相邻顶点颜色不同。最少需要几种颜色，叫<strong>色数<\/strong>。\n<\/ul>\n<p>着色是最有名的图论问题：<strong>四色定理<\/strong>说平面地图只用四种颜色就够。它在 1852 年被提出，直到 1976 年才由 Appel 和 Haken 用计算机验证大量不可避免构型后证明——第一个被计算机证明的重要定理，当时引发过&quot;计算机证明算不算证明&quot;的争论。<\/p>\n<p>实际用途：排课表（同一老师不能同时上两门）、频率分配（相邻基站不能用同一频段）、寄存器分配（同时活跃的变量不能共用一个寄存器）。<\/p>\n<h3>概念 4：最小生成树——把所有点连起来，最省（难度：基础）<\/h3>\n<p>n 个城市都要通电，架哪些电线最省钱？这就是<strong>最小生成树<\/strong>（MST）：在连通带权图里选 n−1 条边，连通所有点，总权最小。<\/p>\n<p>两个经典算法，思路不同但都对：<\/p>\n<ul><li>\n<strong>Kruskal<\/strong>：把所有边按权从小到大排序，依次考虑；只要这条边连接的两个点还不在同一个连通块里，就选它。用并查集判断。\n<\/li><li>\n<strong>Prim<\/strong>：从一个点开始，每次从&quot;已在树内的点&quot;连到&quot;树外的点&quot;的边里挑最短的，加进来。\n<\/ul>\n<p>两个都是<strong>贪心<\/strong>，而且贪心在这里是对的——原因是一条叫&quot;割性质&quot;的定理：对任意一个把顶点分成两半的割，横跨割的最短边一定属于某棵最小生成树。Kruskal 每次都在验证这个性质。<\/p>\n<p>为什么贪心在 MST 上成立、在别的问题上不成立？关键在于 MST 有<strong>拟阵<\/strong>结构：可行边集构成一个拟阵，而拟阵上的贪心必然最优。这一条在第 5 章讲近似算法时会再提到，它是&quot;什么时候能贪心&quot;的分界线。<\/p>\n<h3>概念 5：最短路——从一点到另一点，最快（难度：基础）<\/h3>\n<p><strong>单源最短路<\/strong>：给定起点 s，求到每个点的最短距离。<\/p>\n<ul><li>\n<strong>Dijkstra<\/strong>：把点分成&quot;已确定&quot;和&quot;未确定&quot;，每次从未确定里取距离最小的点，用它去更新邻居。前提：<strong>边权非负<\/strong>。为什么必须非负？因为 Dijkstra 的&quot;确定即最终&quot;依赖一个假设：绕远路只会更远。有负边时这个假设破了，得改用 Bellman–Ford 或 SPFA。\n<\/li><li>\n<strong>Floyd<\/strong>：三重循环，求<strong>所有点对<\/strong>之间的最短路。核心是一个递推：d[i][j] = min(d[i][j], d[i][k] + d[k][j])——&quot;允许经过前 k 个点&quot;时的最短距离。O(n³)，n 小于几百时好用。\n<\/ul>\n<p>短路的用处远不止导航：项目排期里的关键路径、电路延迟分析、套利检测（取对数后用负权找负圈）都是它。<\/p>\n<h3>概念 6：网络流——把&quot;能送多少&quot;算清楚（难度：高难）<\/h3>\n<p>给一个有向图，每条边有<strong>容量<\/strong> c(u,v)，一个源点 s、一个汇点 t。<strong>流<\/strong> f 满足两条规矩：<\/p>\n<ol><li>\n<strong>容量限制<\/strong>：0 ≤ f(u,v) ≤ c(u,v)。\n<\/li><li>\n<strong>流量守恒<\/strong>：除 s、t 外，每个点&quot;流入 = 流出&quot;。\n<\/ol>\n<p><strong>最大流<\/strong>就是让从 s 到 t 的总流量最大。<\/p>\n<p><strong>最小割<\/strong>：把点集分成 S（含 s）和 T（含 t），割的容量是所有从 S 指向 T 的边的容量之和。<\/p>\n<p><strong>最大流最小割定理<\/strong>（Ford–Fulkerson，1956）：<strong>最大流的值 = 最小割的容量。<\/strong> 这一条把&quot;优化问题&quot;和&quot;证明&quot;绑在一起：<\/p>\n<ul><li>\n上界：任何流都不可能超过任何割（流量必须穿过割，而割的边容量有限）。\n<\/li><li>\n达到：当残余网络里再也找不到 s→t 的增广路时，把&quot;能从 s 到达的点&quot;记为 S，剩下的记为 T，这个割的每条边都满了、每条反向边都空了，于是流量 = 割容量。\n<\/ul>\n<p><strong>Ford–Fulkerson 算法<\/strong>：反复在<strong>残余网络<\/strong>里找增广路（残余容量 = 容量 − 当前流，反向边容量 = 当前流），找到就沿路推流，找不到就停。残余网络里的反向边是关键设计——它允许&quot;反悔&quot;：先前送错方向的流可以退回来。<\/p>\n<p>两个实践问题：边权是整数时 FF 一定终止，但最坏可能很慢（每次只增 1）；<strong>Edmonds–Karp<\/strong> 改成每次找<strong>最短<\/strong>增广路（BFS），复杂度 O(VE²)，就稳了。<\/p>\n<p><strong>最小费用最大流<\/strong>：在&quot;流量最大&quot;的前提下让总费用最小。做法是把&quot;找增广路&quot;从 BFS 换成&quot;按费用做最短路&quot;（用 SPFA 或势函数 + Dijkstra），沿最便宜的增广路推流。这一类模型在物流、任务分配里极其常见。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[图 G = V E] --&gt; B[带权吗]\n    B --&gt;|带权| C[优化类问题]\n    B --&gt;|不带权| D[结构类问题]\n    C --&gt; C1[最小生成树 Kruskal Prim]\n    C --&gt; C2[最短路 Dijkstra Floyd]\n    C --&gt; C3[网络流 最大流 最小割]\n    D --&gt; D1[匹配 二分图 增广路]\n    D --&gt; D2[覆盖 独立集]\n    D --&gt; D3[着色 四色定理]\n    D1 --&gt; E[König 定理 最大匹配 = 最小点覆盖]\n    D1 --&gt; F[Hall 定理 完美匹配的充要条件]\n    C3 --&gt; G[最大流最小割定理]\n    E --&gt; G<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：中间那个岔口&quot;带权吗&quot;决定了你走优化路线还是结构路线。注意最下面两条箭头汇到&quot;最大流最小割定理&quot;——König 定理和它其实是同一件事的两个特例，这也是本章与第 1 章对偶理论的接口。<\/p>\n<h2>类比与实例<\/h2>\n<h3>类比：地铁线路图<\/h3>\n<p>地铁图只画站和线，不按真实比例——这正是&quot;图抽象&quot;的样子。你要从 A 站到 B 站，关心的是&quot;换几次线、坐几站&quot;，不是&quot;直线距离多少&quot;。最小生成树像&quot;要保证所有站互通，最少修几条轨道&quot;；最短路像&quot;最快到达&quot;；网络流像&quot;早高峰每小时最多能运多少人&quot;。<\/p>\n<p>类比失效处：地铁有换乘代价、有单向限流、有站点容量，模型里这些都要额外加约束，图本身不自动包含。<\/p>\n<h3>实例 1：Kruskal 与 Dijkstra 在同一个图上跑<\/h3>\n<p>六个点 A–F，边与权：<\/p>\n<table><thead><tr><th>边<\/th><th>权<\/th><\/tr><\/thead><tbody><tr><td>A–B<\/td><td>4<\/td><\/tr><tr><td>A–C<\/td><td>2<\/td><\/tr><tr><td>B–C<\/td><td>1<\/td><\/tr><tr><td>B–D<\/td><td>5<\/td><\/tr><tr><td>C–D<\/td><td>8<\/td><\/tr><tr><td>C–E<\/td><td>10<\/td><\/tr><tr><td>D–E<\/td><td>2<\/td><\/tr><tr><td>D–F<\/td><td>6<\/td><\/tr><tr><td>E–F<\/td><td>3<\/td><\/tr><\/tbody><\/table>\n<p><strong>Kruskal<\/strong>（按权从小到大）：<\/p>\n<ol><li>\nB–C（1）→ 选。连通块 {B,C}。\n<\/li><li>\nA–C（2）→ 选。连通块 {A,B,C}。\n<\/li><li>\nD–E（2）→ 选。连通块 {D,E}。\n<\/li><li>\nE–F（3）→ 选。连通块 {D,E,F}。\n<\/li><li>\nA–B（4）→ A、B 已在同一块，<strong>丢弃<\/strong>（会成圈）。\n<\/li><li>\nB–D（5）→ 选。两块合并成 {A,B,C,D,E,F}。\n<\/ol>\n<p>已选 5 条边（n−1 = 5），结束。<strong>总权 = 1+2+2+3+5 = 13。<\/strong><\/p>\n<p><strong>Dijkstra 从 A 出发<\/strong>（初始 d(A)=0，其余 ∞）：<\/p>\n<table><thead><tr><th>步<\/th><th>确定点<\/th><th>更新后的距离<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>A（0）<\/td><td>C=2，B=4<\/td><\/tr><tr><td>2<\/td><td>C（2）<\/td><td>B 改为 3（经 C 更近），D=10，E=12<\/td><\/tr><tr><td>3<\/td><td>B（3）<\/td><td>D 改为 8（3+5），其余不变<\/td><\/tr><tr><td>4<\/td><td>D（8）<\/td><td>E 改为 10（8+2），F=14<\/td><\/tr><tr><td>5<\/td><td>E（10）<\/td><td>F 改为 13（10+3）<\/td><\/tr><\/tbody><\/table>\n<p>最终距离：A=0，C=2，B=3，D=8，E=10，F=13。<strong>A 到 F 最短 13，路线 A–C–B–D–E–F。<\/strong><\/p>\n<p><strong>注意两处的差别<\/strong>：MST 的总权 13 与 A 到 F 的最短路 13 数值相同，纯属巧合——它们回答的是不同问题（&quot;连通全部点最省&quot; vs &quot;两点之间最快&quot;）。别把这两个 13 混成一件事。<\/p>\n<h3>实例 2：一个最大流问题<\/h3>\n<p>源点 s，汇点 t，边与容量：s→a(3)、s→b(2)、a→c(2)、b→c(3)、c→t(4)。<\/p>\n<p><strong>先猜一个流<\/strong>：s→a 送 3、s→b 送 2（源点总共送出 5）。但 a 只能往下送 2（a→c 容量 2），b 送 2。汇到 c 的是 4，c→t 容量正好 4。可行流为 4。<\/p>\n<p><strong>再用割验证最优性<\/strong>：取 S = {s,a,b,c}，T = {t}，割就是 c→t，容量 4。任何流都不可能超过 4。既然已经达到 4，它就是<strong>最大流<\/strong>。<\/p>\n<p><strong>再看一个更小的割<\/strong>：S = {s}，割是 s→a + s→b = 5。这个割容量更大，所以不是最小割。最小割 = 4 = 最大流，定理成立。<\/p>\n<p><strong>残余网络视角<\/strong>：此时的残余容量里，s→a 剩 0、s→b 剩 0、a→c 剩 0、b→c 剩 1、c→t 剩 0，再加反向边 a→s(3)、b→s(2)、c→a(2)、c→b(2)、t→c(4)。从 s 出发只能走到 s 自己，<strong>没有 s→t 的增广路<\/strong>，算法停，结论正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为最大匹配就是&quot;贪心地配能配的&quot;。<\/strong> 贪心会配错（先配了一条边，堵死了后面两条）。增广路的意义就是纠错。\n<\/li><li>\n<strong>别以为 Dijkstra 什么图都能用。<\/strong> 有负权边时它会把&quot;绕远反而更近&quot;的情况漏掉，结论直接错。\n<\/li><li>\n<strong>别以为最小生成树唯一。<\/strong> 权值有并列时可能有多棵不同的 MST，但总权相同。\n<\/li><li>\n<strong>别以为最大流的答案是&quot;源点出边的容量之和&quot;。<\/strong> 那只是上界，瓶颈常在中间；最小割就是&quot;最窄的那道口&quot;。\n<\/li><li>\n<strong>别以为四色定理跟算法无关。<\/strong> 求任意图的最小着色是 NP-难的（第 5 章），四色定理只是说<strong>平面图<\/strong>的上界是 4，不给你快速找到着色的办法。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>（单选）<\/strong>一个连通图有 n 个顶点，它的任一棵生成树有多少条边？\n<p>A. n　B. n−1　C. n+1　D. 取决于权 <strong>答案：B<\/strong>。解析：树连通且无圈，从任一点出发每次加一条边连一个新点，恰好加 n−1 次。<\/p>\n<\/ol>\n<ol><li>\n<strong>（单选）<\/strong>Berge 定理说的是\n<p>A. 匹配最大 ⟺ 无增广路　B. 匹配最大 ⟺ 点数最多　C. 最大匹配 = 最小点覆盖（对所有图）　D. 匹配必唯一 <strong>答案：A<\/strong>。解析：C 只对二分图成立（König 定理），一般图不成立；A 是对所有图都成立的判别准则。<\/p>\n<\/ol>\n<ol><li>\n<strong>（填空）<\/strong>最大流最小割定理指出，网络中从 s 到 t 的最大流量等于______的容量。\n<p><strong>答案：最小割<\/strong>。解析：任何流受任何割限制，而算法停止时的残余网络恰好给出一个&quot;满割&quot;，两者相等。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>为什么 Dijkstra 要求边权非负？举一个负权会让它出错的例子。\n<p><strong>答案：<\/strong> Dijkstra 每次把&quot;当前距离最小&quot;的点标记为最终确定，这一步默认&quot;以后不可能有更短的路径绕到它&quot;。有负权时这个默认被打破：例如 A→B 权 1、A→C 权 5、C→B 权 −10，A 到 B 真实最短是 −5（走 A→C→B），但 Dijkstra 会先确定 B=1 并锁死，之后再也不会更新它。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>网络流算法里为什么要引入&quot;反向边&quot;？\n<p><strong>答案：<\/strong> 为了让算法能反悔。沿增广路推流时可能占用了某条本应留给其他路径的容量；反向边提供&quot;把已送的流退回去&quot;的能力，使后续增广路可以改道。没有反向边，Ford–Fulkerson 会卡在次优解上。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图 = 点 + 边；树 = 连通无圈，n 点 n−1 边。\n<\/li><li>\n匹配靠增广路改进；二分图上最大匹配 = 最小点覆盖（König）。\n<\/li><li>\nMST 贪心可行的根源是割性质（拟阵）；最短路 Dijkstra 要求非负权。\n<\/li><li>\n最大流 = 最小割，残余网络 + 反向边是算法的心脏。\n<\/li><li>\n覆盖、独立集、着色是同一族结构问题的不同切面，求最小着色是 NP-难的。\n<\/ul>", "ch05": "<h1>第 5 章：组合优化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 1~4 章（线性规划、整数规划、图与网络）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个问题是&quot;组合优化&quot;还是&quot;连续优化&quot;，并说出它的判定形式。\n<\/li><li>\n分清 P、NP、NP-完全、NP-难四个类，说清&quot;归约&quot;的方向为什么不能反。\n<\/li><li>\n用&quot;先证属于 NP，再把一个已知 NP-完全问题归约过来&quot;的套路，判断一个新问题的难度。\n<\/li><li>\n解释近似算法的&quot;最坏情况界 ρ&quot;是什么意思，并手算一个贪心算法的失败例子。\n<\/li><li>\n分清近似算法、近似方案（PTAS/FPTAS）、启发式算法三者的差别，知道各自能承诺什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>组合优化研究的是&quot;在有限但爆炸多的方案里挑最好的&quot;。它的分水岭是一条：如果问题属于 P，就去找更快的精确算法；如果属于 NP-难，就别再指望精确求解，转而去争取&quot;有界近似&quot;或&quot;实践有效&quot;——先认清难度，再决定策略。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：什么叫组合优化（难度：基础）<\/h3>\n<p>组合优化的一般形式：<\/p>\n<div>min f(x)　s.t. x ∈ F<\/div>\n<p>F 是一个<strong>有限的离散集合<\/strong>（可行组合的集合）。和前面几章的区别只有一条：F 不是一片连续区域，而是一堆散落的方案。<\/p>\n<p>四个代表问题，认脸就行：<\/p>\n<table><thead><tr><th>问题<\/th><th>一句话<\/th><th>方案数<\/th><\/tr><\/thead><tbody><tr><td>0-1 背包<\/td><td>容量 C，n 件物品各有重量 wᵢ 和价值 pᵢ，装哪些使价值最大<\/td><td>2ⁿ<\/td><\/tr><tr><td>旅行售货商（TSP）<\/td><td>走遍 n 个城市各一次回到出发地，路程最短<\/td><td>(n−1)!/2<\/td><\/tr><tr><td>装箱<\/td><td>若干物品装进最少的箱子<\/td><td>与箱子数成阶乘级<\/td><\/tr><tr><td>排序（调度）<\/td><td>n 个工件在 m 台机器上加工，使完工时间最短<\/td><td>组合数增长极快<\/td><\/tr><\/tbody><\/table>\n<p><strong>组合爆炸<\/strong>不是修辞。n = 50 的背包有 2⁵⁰ ≈ 10¹⁵ 种方案，每秒检查一亿个也要跑几个月；n = 20 的 TSP 有约 6×10¹⁶ 条路线。这就是为什么&quot;聪明地搜索&quot;比&quot;更快地计算&quot;更重要。<\/p>\n<p>每个组合优化问题都有两种形态：<\/p>\n<ul><li>\n<strong>最优化形式<\/strong>：min f(x)，要具体的最优方案。\n<\/li><li>\n<strong>判定形式<\/strong>：给定阈值 K，问&quot;是否存在可行 x 使 f(x) ≤ K&quot;。复杂性理论只讨论判定形式，因为&quot;是/否&quot;的答案容易比较、容易归约。\n<\/ul>\n<h3>概念 2：复杂性类，四个盒子（难度：进阶）<\/h3>\n<ul><li>\n<strong>P<\/strong>：存在多项式时间算法能<strong>解出<\/strong>的问题类。&quot;解出&quot;意味着给出答案。\n<\/li><li>\n<strong>NP<\/strong>：给定一个候选解（叫<strong>证书<\/strong>），能在多项式时间内<strong>验证<\/strong>它对不对的问题类。注意 NP 不表示&quot;非多项式&quot;，它表示&quot;可验证&quot;。\n<\/li><li>\n<strong>NP-完全（NP-C）<\/strong>：A 属于 NP，且<strong>所有<\/strong> NP 问题都能多项式归约到 A。它是 NP 里&quot;最难&quot;的那一层。\n<\/li><li>\n<strong>NP-难（NP-hard）<\/strong>：所有 NP 问题都能归约到它，但它自己<strong>不一定<\/strong>属于 NP。优化问题（要最优值而非是/否）通常落在这一层。\n<\/ul>\n<p>包含关系：P ⊆ NP；若 P = NP（未解决的世纪难题），四个盒子会塌成两个。<\/p>\n<p><strong>归约<\/strong>（reduction）的定义要抠准：A ≤p B 意思是&quot;存在一个多项式时间的变换，把 A 的任意实例变成 B 的实例，且两者答案一致&quot;。它的方向是<strong>从 A 到 B<\/strong>：把 A 的难度&quot;推给&quot; B。所以若 B 有快速算法，A 也有了；若 A 很难，B 也难。<strong>方向弄反是最常见的错误。<\/strong><\/p>\n<p>归约具有传递性：A ≤p B、B ≤p C 则 A ≤p C。这条性质让 NP-完全性可以&quot;接力&quot;证明。<\/p>\n<p><strong>证明一个问题是 NP-完全的套路<\/strong>（两步，缺一不可）：<\/p>\n<ol><li>\n<strong>A ∈ NP<\/strong>：给出证书形式，并说明能在多项式时间内验证。\n<\/li><li>\n<strong>某个已知 NP-完全问题 ≤p A<\/strong>：构造多项式变换，并证明&quot;是&quot;与&quot;否&quot;的答案都对应得上。\n<\/ol>\n<p>历史上第一块基石是 Cook（1971）证明<strong>布尔可满足性（SAT）<\/strong>是 NP-完全的；随后 Karp（1972）列了 21 个 NP-完全问题，把这张网铺开。今天已知的 NP-完全问题有几千个，覆盖排课、装箱、图着色、集合覆盖、旅行售货商等等。<\/p>\n<h3>概念 3：问题难不难，先看它长什么样（难度：进阶）<\/h3>\n<p>同一个&quot;味道&quot;的问题，可能一个在 P、一个在 NP-C。举两组对照：<\/p>\n<ul><li>\n<strong>最短路径 vs 最长路径<\/strong>：前者多项式（Dijkstra），后者 NP-难（它包含 Hamilton 路问题）。\n<\/li><li>\n<strong>2-着色判定 vs 3-着色判定<\/strong>：二分图能否 2-着色是多项式（判奇圈）；一般图能否 3-着色是 NP-完全。\n<\/li><li>\n<strong>指派问题 vs 三维指派问题<\/strong>：二维有全么模结构，多项式（匈牙利算法）；三维一下丢掉全么模，变成 NP-难。\n<\/li><li>\n<strong>子集和 vs 超增子集和<\/strong>：一般的子集和（给一堆数和一个目标，问能否凑出）是 NP-完全的；但如果这堆数满足&quot;每个数都大于前面所有数之和&quot;（超增），就有多项式算法。\n<\/ul>\n<p>超增子集和的算法极简单：从最大的数往回扫，能减就减，最后看能不能减到 0。<\/p>\n<div>t = B；对 j = n 到 1：若 t ≥ aⱼ，则 t = t − aⱼ；最后 t = 0 就是\"是\"。<\/div>\n<p>为什么这对超增有效？因为每个数比前面所有数的总和还大，所以&quot;要不要选它&quot;没有回旋余地——不选它，后面的数加起来也补不上这个缺口。<strong>结构一变，难度天差地别<\/strong>，这条观察是组合优化里最实用的直觉之一。<\/p>\n<p>顺带一句：超增子集和被 Merkle 和 Hellman 用来做过公钥密码（背包密码），加密就是把明文位串映射成超增集合的和，再乘一个模数伪装。它后来被 Shamir 攻破，是&quot;NP-难问题也能被利用、但不保证安全&quot;的经典案例。<\/p>\n<h3>概念 4：已知 NP-难，还想求精确解怎么办（难度：进阶）<\/h3>\n<p>三条路，都能给出<strong>真正的最优解<\/strong>，代价是时间不保证多项式：<\/p>\n<p><strong>（1）动态规划<\/strong>。把问题拆成&quot;规模小一点的同类问题&quot;，写出递推。背包的递推：<\/p>\n<div>F_k(c) = max{ F_{k−1}(c)，F_{k−1}(c − w_k) + p_k }　（放不下第 k 件时只取前项）<\/div>\n<p>F_k(c) 表示&quot;只看前 k 件、容量 c 时的最大价值&quot;。复杂度 O(nC)——注意 C 是<strong>容量数值<\/strong>，不是输入长度，所以这是<strong>伪多项式时间<\/strong>：C 写成二进制只有 log C 位，但算法要跑 C 步。容量一大就失效。<\/p>\n<p><strong>（2）分枝定界<\/strong>。思路和第 3 章一样，只是界要好算：<\/p>\n<ul><li>\n<strong>上界<\/strong>：把物品按&quot;价值密度&quot;（pᵢ/wᵢ）从大到小排序，能装就装，装不下就按比例&quot;切一半&quot;装进去（这叫<strong>线性松弛<\/strong>），得到的值一定比真实最优高。\n<\/li><li>\n<strong>下界<\/strong>：同样的排序，装不下就跳过、继续看后面的（只装整件），得到的值一定可行。\n<\/li><li>\n上下界一夹，差距小的分支直接剪掉。\n<\/ul>\n<p><strong>（3）整数规划建模<\/strong>。把组合问题写成 0-1 规划，交给求解器。TSP 的标准模型要加&quot;子圈消除约束&quot;（每个真子集至少有一条边连出去），否则解出来可能是一堆互不相连的小圈——这是组合问题建模时最常见的坑。<\/p>\n<h3>概念 5：近似算法——退一步，但要有保证（难度：高难）<\/h3>\n<p><strong>最坏情况界<\/strong>（worst-case ratio）ρ_A 的定义：对问题的<strong>所有<\/strong>实例 I，<\/p>\n<div>C_A(I) / C*(I) ≤ ρ_A　（最小化问题，C_A 是算法解，C* 是最优值）<\/div>\n<p>它承诺的是&quot;再差也差不过 ρ 倍&quot;，而不是&quot;平均很好&quot;。这个承诺很硬，也正因为硬，能证明的问题不多。<\/p>\n<p><strong>背包：一个贪心的失败例子<\/strong>。容量 10，三件物品：<\/p>\n<table><thead><tr><th>物品<\/th><th>重量<\/th><th>价值<\/th><th>价值密度<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>6<\/td><td>7<\/td><td>1.17<\/td><\/tr><tr><td>B<\/td><td>5<\/td><td>5<\/td><td>1.00<\/td><\/tr><tr><td>C<\/td><td>5<\/td><td>5<\/td><td>1.00<\/td><\/tr><\/tbody><\/table>\n<p>按密度贪心：先装 A（重 6，值 7），剩余容量 4，B、C 都装不下，得 7。 最优：装 B + C，重量 10，价值 <strong>10<\/strong>。 比值 10/7 ≈ 1.43——贪心确实错，但错得不算离谱。<\/p>\n<p>书上的 <strong>GK 算法<\/strong>就是&quot;按密度贪心&quot;，再和&quot;只装价值最大的单件物品&quot;复合，取两者较好（<strong>CK 算法<\/strong>），可以证明最坏情况界 <strong>ρ = 2<\/strong>（定理 5.5）。也就是说：<strong>不管数据多刁钻，它给出的解至少是最优的一半。<\/strong><\/p>\n<p><strong>TSP：MST 双树法也是 2-近似<\/strong>（定理 5.7）。做法：求最小生成树，把每条边走两遍（得到一个 Euler 环游），再&quot;抄近路&quot;跳过重复访问的城市（三角不等式保证不会变长）。因为最优环游去掉一条边就是一棵生成树，所以 MST ≤ OPT；双树长 2·MST ≤ 2·OPT，抄近路只会更短。<strong>界是 2，且这个界是紧的<\/strong>（存在实例刚好达到 2 倍）。<\/p>\n<p>读这些证明时抓住一个套路：<strong>先找一个&quot;最优解的一部分&quot;作为下界（MST、线性松弛），再看算法解不超过这个下界的几倍。<\/strong> 界就是这么来的。<\/p>\n<h3>概念 6：近似方案 PTAS 与 FPTAS（难度：高难）<\/h3>\n<p>近似算法给的是固定倍数 ρ；<strong>近似方案<\/strong>给的是&quot;你指定精度 ε，我按 ε 调算法&quot;：<\/p>\n<ul><li>\n<strong>PTAS<\/strong>（多项式时间近似方案）：对任意 ε &gt; 0，能在<strong>关于 n 的多项式时间<\/strong>内给出 (1+ε) 近似解，但时间可以是 n^{1/ε} 这种&quot;多项式但指数很大&quot;的形式。\n<\/li><li>\n<strong>FPTAS<\/strong>（完全多项式时间近似方案）：时间同时是 n 和 1/ε 的多项式。这是组合优化里最强的近似承诺。\n<\/ul>\n<p><strong>背包的 PTAS（PKP_ε）<\/strong>：令 k = ⌈2/ε⌉。枚举所有&quot;不超过 k 件&quot;的子集（共 O(n^k) 种），对每种剩下的容量按密度贪心填满，取最好的。因为最优解里&quot;装不进去&quot;的部分最多影响有限，误差被控制在 ε 内。<\/p>\n<p><strong>背包的 FPTAS<\/strong>：先做<strong>价值缩放<\/strong>——把每个 pᵢ 改成 p̃ᵢ = ⌊pᵢ / (ε P / n)⌋（P 是价值上界），把&quot;数值&quot;压小；在这个缩微实例上跑 O(n²/ε) 的动态规划；再把解映射回原问题。误差来自舍入，累计不超过 εP。<strong>这一步的巧妙之处在于：伪多项式算法的瓶颈是&quot;数值大&quot;，那就把数值改小。<\/strong><\/p>\n<p>注意：<strong>不是所有 NP-难问题都有 PTAS<\/strong>（除非 P = NP）。装箱问题连 PTAS 都没有（除非 P = NP），这类问题只能做&quot;渐进近似比&quot;或&quot;绝对近似比&quot;。这句话在看论文时经常被搞混。<\/p>\n<p><strong>再补一个概念：强 NP-完全<\/strong>。定义 5.5 说，若 Π 是 NP-完全问题，且存在多项式函数 p 使得 Π 的<strong>所有<\/strong>实例 I 都满足&quot;最大数 B(I) ≤ p(规模 x(I))&quot;，则称 Π 为<strong>强 NP-完全<\/strong>问题。说白了：<strong>强 NP-完全问题的数值不会比规模大太多<\/strong>。<\/p>\n<p>定理 5.2：在 P ≠ NP 的前提下，<strong>强 NP-完全问题不存在伪多项式时间算法<\/strong>。<\/p>\n<p>这条定理给了一个实用的分界线：<\/p>\n<ul><li>\n背包、子集和是<strong>一般意义<\/strong>的 NP-完全问题（数值可以任意大，所以有伪多项式 DP）；\n<\/li><li>\nTSP、装箱、图着色是<strong>强 NP-完全<\/strong>问题（数值被规模限制，伪多项式这条路被堵死）。\n<\/ul>\n<p>所以看到&quot;这个问题有 O(nC) 的 DP&quot;时，先问一句：C 能不能任意大？能，它就是一般 NP-完全；不能，它可能是强 NP-完全，DP 那条路走不通。<\/p>\n<h3>概念 7：启发式——没有保证，但真能用（难度：进阶）<\/h3>\n<p><strong>启发式算法<\/strong>（heuristic，源自希腊语&quot;发现&quot;）不承诺最坏界，只求在合理时间内给出足够好的解。它的适用场景很明确：<\/p>\n<ul><li>\n问题连近似算法都设计不出来（比如装箱）；\n<\/li><li>\n数据本身就不精确（风速、路况、人流都是估的），苛求最优没意义；\n<\/li><li>\n规模太大，精确算法跑不动。\n<\/ul>\n<p>几个典型：<\/p>\n<ul><li>\n<strong>最近邻法（NN）<\/strong>：TSP 里每次走向最近的未访问城市。实现简单，平均不错，最坏可以很差。\n<\/li><li>\n<strong>最远插入法（FI）<\/strong>：先把最远的点连起来，再逐步把&quot;插入代价最大&quot;的点插进当前路线。书上给的 TSPLIB 实测：FI 平均比值约 <strong>1.16<\/strong>（很接近最优），但<strong>理论上界超过 2<\/strong>，甚至有实例说明它比 NN 更差。<strong>平均表现与最坏界经常不一致<\/strong>，这是启发式研究的核心张力。\n<\/li><li>\n<strong>局部搜索与 2-opt<\/strong>：拿一个可行解，反复试&quot;交换两条边&quot;&quot;反转一段路线&quot;，只要变好就接受。TSP 里 2-opt 就是把两条交叉的边换成不交叉的两条。\n<\/li><li>\n<strong>模拟退火<\/strong>：允许以一定概率接受变差的解，概率随&quot;温度&quot;下降而变小，用来跳出局部最优。\n<\/li><li>\n<strong>遗传算法、禁忌搜索、蚁群算法<\/strong>：分别用&quot;种群交叉变异&quot;&quot;记忆禁用表&quot;&quot;信息素正反馈&quot;来维持搜索多样性。\n<\/ul>\n<p>评价启发式必须说清两件事：<strong>在什么数据上测的<\/strong>、<strong>和什么比<\/strong>。只说&quot;效果很好&quot;没有意义。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[组合优化问题] --&gt; B[写成判定形式]\n    B --&gt; C{属于 P 吗}\n    C --&gt;|是| D[找更快的精确算法：最短路 MST 指派]\n    C --&gt;|不确定或已知 NP-难| E{需要精确最优解吗}\n    E --&gt;|需要| F[动态规划 伪多项式]\n    E --&gt;|需要| G[分枝定界 上下界剪枝]\n    E --&gt;|需要| H[整数规划建模 交给求解器]\n    E --&gt;|可以近似| I{能证明最坏界吗}\n    I --&gt;|能 固定倍数| J[近似算法 rho]\n    I --&gt;|能 任意精度| K[PTAS 或 FPTAS]\n    I --&gt;|不能| L[启发式 NN FI 局部搜索 退火 遗传]<\/div><p class=\"mermaid-hint\">↑ Merma
