id 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这张图是一条决策链，每一步都在&quot;降要求&quot;。注意最右边的分支——启发式不是&quot;没办法的选择&quot;，而是在&quot;数据本身不精确&quot;时更合理的选择。<\/p>\n<h2>类比与实例<\/h2>\n<h3>类比：在一座巨大的仓库里找最便宜的货<\/h3>\n<ul><li>\n<strong>P 类问题<\/strong>：仓库有索引，顺着目录走就能找到。\n<\/li><li>\n<strong>NP 类问题<\/strong>：没有索引，但只要有人给你一个货号，你能很快核对它是不是最便宜的。\n<\/li><li>\n<strong>NP-完全问题<\/strong>：所有没索引的仓库，本质上都是同一座仓库换了个门牌。\n<\/li><li>\n<strong>近似算法<\/strong>：不找最便宜的，但保证找到的不比最便宜的贵一倍以上。\n<\/li><li>\n<strong>启发式<\/strong>：凭经验先摸几排货架，好不好看运气，但时间可控。\n<\/ul>\n<p>类比失效处：仓库有物理空间，&quot;摸几排&quot;能靠直觉；组合问题的搜索空间没有直觉可用，全靠设计。<\/p>\n<h3>实例 1：背包的贪心为什么错，差多少<\/h3>\n<p>前面那个例子（容量 10、A 重 6 值 7、B 与 C 各重 5 值 5）：贪心 7，最优 10。再把这个例子推广：如果有一件&quot;密度略高但很占地方&quot;的物品，加上一堆&quot;密度略低但刚好填满&quot;的物品，贪心就会锁死在一个次优解里。<\/p>\n<p><strong>关键观察<\/strong>：贪心错的原因是&quot;密度&quot;这个指标只考虑单位重量的价值，<strong>不考虑剩余空间能不能被填满<\/strong>。任何贪心的失效，几乎都能归结为&quot;局部指标没编码全局约束&quot;。<\/p>\n<h3>实例 2：一个 TSP 的 2-近似为什么成立<\/h3>\n<p>设最优环游长度 OPT。把环游上任意一条边删掉，得到一棵生成树，所以 <strong>MST ≤ OPT<\/strong>。<\/p>\n<p>MST 每条边走两遍，得到一个经过所有点、回到起点的闭合游走，长度 <strong>2·MST ≤ 2·OPT<\/strong>。<\/p>\n<p>把这个闭合游走&quot;抄近路&quot;：每当要重复访问一个已经到过的城市，就直接跳到下一个没去过的城市。由三角不等式（两点间直达不比绕路长），长度只会变短。于是<\/p>\n<div>算法解 ≤ 2·MST ≤ 2·OPT<\/div>\n<p>界是 2。<strong>为什么不能再小<\/strong>：书上的图 5.22 构造了一类实例，MST 很长而最优环游很短，比值逼近 2。所以 2 是这类算法的天花板，不是证明偷懒。<\/p>\n<h3>实例 3：超增子集和怎么解出一段明文<\/h3>\n<p>书上例 5.3：超增集合 S = {2, 5, 9, 21, 45, 203, 215, 450, 946}，取模数 p = 2003、乘数 u = 1289，把明文 101100111 加密成公开集合<\/p>\n<div>C = {575, 436, 1586, 1030, 1921, 569, 721, 1183, 1570}<\/div>\n<p>乙拿到 p、u、C 后，先算出原超增集合下对应的和 Y = 1643，再用 RS 算法从和反推明文。<\/p>\n<p><strong>从 1643 倒推，逐个数判断减不减<\/strong>：<\/p>\n<table><thead><tr><th>当前 t<\/th><th>aⱼ<\/th><th>减？<\/th><th>之后<\/th><\/tr><\/thead><tbody><tr><td>1643<\/td><td>946<\/td><td>减<\/td><td>697<\/td><\/tr><tr><td>697<\/td><td>450<\/td><td>减<\/td><td>247<\/td><\/tr><tr><td>247<\/td><td>215<\/td><td>减<\/td><td>32<\/td><\/tr><tr><td>32<\/td><td>203<\/td><td>不减<\/td><td>32<\/td><\/tr><tr><td>32<\/td><td>45<\/td><td>不减<\/td><td>32<\/td><\/tr><tr><td>32<\/td><td>21<\/td><td>减<\/td><td>11<\/td><\/tr><tr><td>11<\/td><td>9<\/td><td>减<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>5<\/td><td>不减<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>2<\/td><td>减<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<p>最后 t = 0，解的位串是 <strong>1 0 1 1 0 0 1 1 1 = 101100111<\/strong>，和明文一致。<\/p>\n<p><strong>核对一遍<\/strong>：被选中的元素是 2、9、21、215、450、946，加起来 2+9+21+215+450+946 = 1643 ✓；位串对应位置是第 1、3、4、7、8、9 位为 1，正好是 101100111 ✓。<\/p>\n<p><strong>这个例子说明三点<\/strong>：<\/p>\n<ol><li>\n同样的&quot;凑数&quot;问题，换成超增结构后，倒推是<strong>唯一路径<\/strong>，不用搜索。\n<\/li><li>\n加密后的集合 C 表面上完全看不出结构，只有知道 p、u 的人能还原成 S。这就是背包密码的思路——<strong>用&quot;结构&quot;当密钥，用&quot;无结构&quot;当密文<\/strong>。\n<\/li><li>\n它后来被 Shamir 用&quot;解的格子结构 + 整数规划&quot;攻破了。设计密码时，&quot;求解难&quot;不等于&quot;安全&quot;，这是密码学里反复出现的教训。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 NP 是&quot;非多项式&quot;。<\/strong> NP 是&quot;可验证&quot;，P ⊆ NP。真正未知的是 P 是否等于 NP。\n<\/li><li>\n<strong>别以为&quot;归约&quot;可以反着用。<\/strong> A ≤p B 证明的是&quot;B 至少和 A 一样难&quot;，不能推出&quot;B 能解则 A 也能解&quot;的反向结论。\n<\/li><li>\n<strong>别以为动态规划是多项式算法。<\/strong> 背包 DP 的 O(nC) 里 C 是数值，容量写成十进制 1000000 时它就跑不动，这叫伪多项式。\n<\/li><li>\n<strong>别以为近似算法的 ρ 是&quot;平均误差&quot;。<\/strong> 它是对所有实例的最坏承诺；平均表现可能远好于 ρ。\n<\/li><li>\n<strong>别以为&quot;启发式&quot;就是&quot;随便凑&quot;。<\/strong> 好的启发式有明确的邻域结构、接受准则和参数设定，评价它必须给出测试集与对照基线。\n<\/li><li>\n<strong>别以为 NP-难就不能精确求解。<\/strong> 小规模实例、特殊结构（全么模、超增、树形）常常可以精确求解，难度是&quot;一般情况&quot;的性质。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>（单选）<\/strong>下列关于 P 与 NP 的说法，正确的是\n<p>A. NP 问题一定不能在多项式时间内求解　B. P ⊆ NP　C. NP-完全问题一定属于 P　D. NP-难问题一定属于 NP <strong>答案：B<\/strong>。解析：能在多项式时间解出的问题，当然也能在多项式时间验证一个给定解，所以 P ⊆ NP。<\/p>\n<\/ol>\n<ol><li>\n<strong>（单选）<\/strong>要证明问题 A 是 NP-完全的，必须做的是\n<p>A. 证明 A ∈ P　B. 证明 A ∈ NP，并把一个已知 NP-完全问题归约到 A　C. 把 A 归约到一个已知 NP-完全问题　D. 证明 A 无多项式算法 <strong>答案：B<\/strong>。解析：方向必须是从已知难问题<strong>归约到<\/strong> A（说明 A 至少一样难），反向归约只能说明 A 不比它难，证明不了完全性。<\/p>\n<\/ol>\n<ol><li>\n<strong>（填空）<\/strong>背包问题的动态规划复杂度 O(nC)，其中 C 是容量的______，因此它被称为______多项式时间算法。\n<p><strong>答案：数值（大小）；伪<\/strong>。解析：输入长度是 log C 位，算法却要跑 C 步，对输入长度是指数的。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>容量 10、物品 A(6,7)、B(5,5)、C(5,5)，按价值密度贪心得到的解和最优解各是多少？比值多少？\n<p><strong>答案：<\/strong>贪心先取 A（密度 7/6 ≈ 1.17），剩余 4 装不下 B、C，得 7；最优取 B+C，重量 10，价值 10。比值 10/7 ≈ 1.43 &lt; 2，符合 GK 算法的 2 倍界。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>为什么说&quot;装箱问题连 PTAS 都没有&quot;这句话很重要？\n<p><strong>答案：<\/strong>它说明 NP-难问题之间还有难度层次：有的问题（如背包）可以做到任意精度的多项式近似（FPTAS），有的问题（如装箱）在 P ≠ NP 的前提下连 PTAS 都不存在。设计算法前先确认&quot;这个问题能承诺到什么程度&quot;，否则会白费力气。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n组合优化 = 有限离散可行集上的最优化；判定形式用于讨论复杂性。\n<\/li><li>\nP ⊆ NP；NP-完全是&quot;NP 中最难&quot;；归约方向从&quot;已知难&quot;指向&quot;待证难&quot;。\n<\/li><li>\n结构决定难度：全么模、超增、树形都能把 NP-难问题拉回多项式。\n<\/li><li>\n精确求解三条路：DP（伪多项式）、分枝定界（靠界剪枝）、整数规划建模。\n<\/li><li>\n近似三级：固定倍数 ρ → PTAS → FPTAS；启发式没有保证，但平均常常很好。\n<\/ul>", "ch06": "<h1>第 6 章：排序问题与装箱问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 5 章（复杂性、近似比）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 α|β|γ 三参数记法把一句调度需求写成问题代号，也能反过来读懂别人的代号。\n<\/li><li>\n说出 1||∑Cⱼ 用 SPT、1||Lₘₐₓ 用 EDD 为什么最优，各给出理由。\n<\/li><li>\n手工跑 LPT 与 Johnson 规则，算出 makespan。\n<\/li><li>\n用二参数记法写出装箱问题，并解释 NF、FF、BF、FFD 的区别。\n<\/li><li>\n分清&quot;排序问题的近似比&quot;和&quot;装箱问题的渐进近似比&quot;，知道为什么要分这两种。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>排序问题研究&quot;先干哪件、派给谁&quot;，装箱问题研究&quot;哪些塞一箱、用几箱&quot;；前者关心时间轴上的先后，后者关心空间上的装满。两者都是 NP-难，但都有性质漂亮的特例和可以证明界的近似算法——摸清特例的边界，比记住算法名字重要得多。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三参数记法（难度：基础）<\/h3>\n<p>排序问题的标准记法写成 <strong>α | β | γ<\/strong> 三段：<\/p>\n<ul><li>\n<strong>α 机器环境<\/strong>：几台机器、什么关系。\n<\/li><li>\n<strong>β 工件特征<\/strong>：有没有释放时间、交工期、先后约束。\n<\/li><li>\n<strong>γ 目标函数<\/strong>：优化什么。\n<\/ul>\n<p><strong>α 的常用取值<\/strong>：<\/p>\n<table><thead><tr><th>记号<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>单台机器<\/td><\/tr><tr><td>P<\/td><td>同型并行机（速度相同）<\/td><\/tr><tr><td>Q<\/td><td>同类并行机（速度不同）<\/td><\/tr><tr><td>R<\/td><td>无关并行机（速度依赖工件）<\/td><\/tr><tr><td>F<\/td><td>流水车间（每件都要按同样顺序过各机器）<\/td><\/tr><tr><td>J<\/td><td>作业车间（各件有各自的加工路线）<\/td><\/tr><tr><td>O<\/td><td>开放车间（每件在每台机器上的次序任意）<\/td><\/tr><\/tbody><\/table>\n<p><strong>β 的常用取值<\/strong>：rⱼ（释放时间）、dⱼ（交工期）、pⱼ（加工时间）、prec（先后约束）、pⱼ = 1（所有工件加工时间相同）。<\/p>\n<p><strong>γ 的常用取值<\/strong>：<\/p>\n<table><thead><tr><th>记号<\/th><th>目标<\/th><\/tr><\/thead><tbody><tr><td>Cₘₐₓ<\/td><td>最大完工时间（makespan），让最后一件尽早完工<\/td><\/tr><tr><td>∑Cⱼ<\/td><td>总完工时间，让所有件平均早点完成<\/td><\/tr><tr><td>Lₘₐₓ<\/td><td>最大延迟，max(Cⱼ − dⱼ)，最坏的那个不能拖太久<\/td><\/tr><tr><td>∑Tⱼ<\/td><td>总延误，∑max(0, Cⱼ − dⱼ)<\/td><\/tr><tr><td>∑Uⱼ<\/td><td>误工工件数，拖期的件算 1 个<\/td><\/tr><\/tbody><\/table>\n<p>组合起来就是问题代号。书上举的例子：<code>1|rⱼ = d, dⱼ|∑Tⱼ<\/code> 表示单机、所有工件同时释放、交工期都是 d、目标是极小化总延误；<code>P2|prec|Cₘₐₓ<\/code> 表示两台同型机、有先后约束、最小化 makespan。<\/p>\n<p><strong>学会读记法的好处<\/strong>：看到代号就知道问题有多难。<code>1||∑Cⱼ<\/code> 有 O(n log n) 的最优算法，<code>1||∑Tⱼ<\/code> 就是 NP-难的——只差一个字母，难度差一个数量级。<\/p>\n<h3>概念 2：几个能精确求解的经典问题（难度：进阶）<\/h3>\n<p><strong>（1）1||∑Cⱼ：SPT 最优。<\/strong> 单机、无约束、最小化总完工时间。结论：<strong>按加工时间从短到长排序<\/strong>（Shortest Processing Time）。<\/p>\n<p>证明思路（交换论证）：若有两件相邻的 j（长）、k（短）且 j 在前，把它们换过来，j 与 k 各自的完工时间变化相互抵消，而<strong>所有排在它们后面的工件都提前了<\/strong>（提前 pⱼ − pₖ &gt; 0）。所以&quot;短在前&quot;不会更差。反复交换，必得 SPT 顺序。<\/p>\n<p>这个套路（&quot;交换两个相邻元素，证明不变量变好&quot;）在排序问题里反复出现，叫<strong>交换论证<\/strong>（exchange argument）。它比&quot;贪心显然对&quot;严谨得多。<\/p>\n<p><strong>（2）1||Lₘₐₓ：EDD 最优<\/strong>（定理 6.1）。最小化最大延迟。结论：<strong>按交工期从早到晚排<\/strong>（Earliest Due Date）。<\/p>\n<p>证明也是交换论证。设某个最优排序里有两个相邻工件，前一个交工期 dⱼ &gt; 后一个 dₖ。交换它们后，两个工件里<strong>较晚的完工时间不会超过原来较晚的那个<\/strong>，于是最大延迟不变差。反复交换就得到 EDD 顺序。<\/p>\n<p><strong>（3）1||∑Uⱼ：Moore–Hodgson 算法。<\/strong> 最小化误工件数。做法：按 EDD 排一遍，从头开始累加加工时间；一旦累加超过当前交工期，就把<strong>已排的工件里加工时间最长的那件踢掉<\/strong>（记为误工），继续。踢掉最长的，是为了给后面腾出最多时间——这是&quot;用一个误工名额换最大空间&quot;的贪心。<\/p>\n<p><strong>（4）P||Cₘₐₓ：LPT 的 4/3 − 1/(3m) 界。<\/strong> m 台同型机、最小化 makespan，是 NP-难的。<strong>LPT<\/strong>（Longest Processing Time first）：把工件按时间从长到短排，每次派给当前负载最小的机器。Graham 1969 年证明它的最坏情况界是<\/p>\n<div>C_LPT / C* ≤ 4/3 − 1/(3m)<\/div>\n<p>意思是 m 越大界越接近 4/3（m = 2 时界是 7/6 ≈ 1.167）。这个界是紧的。<\/p>\n<p>对照：<strong>LS<\/strong>（List Scheduling，随便按某个顺序派给最闲的机器）的界是 <strong>2 − 1/m<\/strong>。所以&quot;按长的先派&quot;这个简单的改动，把界从 2 压到 1.33。<\/p>\n<p><strong>（5）F2||Cₘₐₓ：Johnson 规则。<\/strong> 两台机器、流水作业（每件都先上 M1 再上 M2）。最优规则：<\/p>\n<ol><li>\n找出所有工件里加工时间最短的那个。\n<\/li><li>\n若它在 <strong>M1<\/strong> 上，就排在<strong>最前面<\/strong>；若它在 <strong>M2<\/strong> 上，就排在<strong>最后面<\/strong>。\n<\/li><li>\n删掉它，重复。\n<\/ol>\n<p><strong>（6）O2||Cₘₐₓ：Gonzalez 算法。<\/strong> 两台机器、开放车间。结论很反直觉：<strong>让每台机器一直忙、不停工，就能达到最优<\/strong>——makespan 等于两台机器中负载较大的那个，即 max(总负载₁, 总负载₂)，下界直接可达。<\/p>\n<h3>概念 3：装箱问题（难度：进阶）<\/h3>\n<p><strong>装箱问题<\/strong>（bin packing）：n 件物品，每件大小 aᵢ，箱子容量 B，用最少的箱子装完。记作 <code>1D-BP<\/code>，判定形式是&quot;能否用 K 个箱子装下&quot;。<\/p>\n<p>它是<strong>强 NP-完全<\/strong>的（第 5 章的强 NP-完全：数值不随规模爆炸），所以<strong>不存在伪多项式算法<\/strong>，也没有 PTAS——只有<strong>渐进近似比<\/strong>（asymptotic approximation ratio）：当最优箱数趋于无穷时，算法用的箱数与最优之比趋于某个常数。<\/p>\n<p>四个经典算法，区别只在&quot;放哪个箱子&quot;：<\/p>\n<table><thead><tr><th>算法<\/th><th>规则<\/th><th>界<\/th><\/tr><\/thead><tbody><tr><td><strong>NF<\/strong>（Next Fit）<\/td><td>只看最后打开的那个箱子，放不下就开新箱<\/td><td>≤ 2·OPT<\/td><\/tr><tr><td><strong>FF<\/strong>（First Fit）<\/td><td>从头扫，放进第一个装得下的箱子<\/td><td>≤ 1.7·OPT<\/td><\/tr><tr><td><strong>BF<\/strong>（Best Fit）<\/td><td>放进&quot;放完之后剩余空间最小&quot;的那个箱子<\/td><td>界优于 FF 的常数<\/td><\/tr><tr><td><strong>FFD<\/strong>（First Fit Decreasing）<\/td><td>先按大小从大到小排，再用 FF<\/td><td>≤ 11/9·OPT + 6/9<\/td><\/tr><\/tbody><\/table>\n<p>FFD 那个 11/9 是装箱问题里最有名的常数，由 Johnson 等人证明，且是紧的。<\/p>\n<p><strong>为什么 NF 差<\/strong>：它一旦离开一个箱子就不再回来，那个箱子里剩下的空隙永久浪费。举个极端的例子：容量 10，物品 5, 6, 5, 6。<\/p>\n<ul><li>\nNF：箱1 放 5（6 放不下）→ 箱2 放 6、5 放不下 → 箱3 放 5 → 箱4 放 6。用了 <strong>4 个<\/strong>。\n<\/li><li>\n最优：装箱思路是 (5,5) 一箱、(6) 一箱、(6) 一箱，共 <strong>3 个<\/strong>。\n<\/ul>\n<p>4/3 = 1.33，离 2 的界还有距离，但已经说明&quot;不回头&quot;的代价。<\/p>\n<p><strong>渐进 PTAS<\/strong>：de la Vega 和 Lueker 给出了箱数趋于无穷时近似比趋于 1+ε 的算法，但常数项不好——它不能保证&quot;任意规模都接近最优&quot;，只能保证&quot;大实例接近最优&quot;。这就是&quot;渐进&quot;二字的含义。<\/p>\n<h3>概念 4：物流里的组合优化（难度：进阶）<\/h3>\n<p>书上 6.4 节把镜头拉回现实，讲物流中的几类问题：<\/p>\n<ul><li>\n<strong>车辆路径问题（VRP）<\/strong>：一堆客户各有需求量，若干辆车各有容量，怎么规划路线使总里程最短。它是 TSP 的推广（加了容量约束），也是 NP-难，实践中靠&quot;节约算法 + 局部搜索&quot;。\n<\/li><li>\n<strong>装载与配载<\/strong>：三维装箱（3D-BP），要考虑承重、易碎、装卸顺序，实际约束比一维装箱复杂得多。\n<\/li><li>\n<strong>仓储拣选<\/strong>：拣货员在仓库里走一趟要拿多个订单的货，路线规划本质是&quot;带时间窗的 TSP&quot;。\n<\/ul>\n<p>共同点：<strong>模型要简化，但简化不能删掉关键约束<\/strong>。把容量约束删掉，VRP 就退化成 TSP，算法快了，解却不能上路。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[排序问题] --&gt; B[写代号 三段式]\n    B --&gt; C{机器环境}\n    C --&gt;|单机 1| D[1 的 sum Cj 用 SPT]\n    C --&gt;|单机 1| E[1 的 Lmax 用 EDD]\n    C --&gt;|单机 1| F[1 的 sum Uj 用 Moore Hodgson]\n    C --&gt;|同型并行 P| G[LPT 界 4/3 - 1/3m]\n    C --&gt;|两台流水 F2| H[Johnson 规则]\n    C --&gt;|两台开放 O2| I[Gonzalez 不停机]\n    A --&gt; J[装箱问题 1D-BP 强 NP-完全]\n    J --&gt; K[NF 界 2]\n    J --&gt; L[FF 界 1.7]\n    J --&gt; M[FFD 界 11/9]\n    J --&gt; N[渐进 PTAS 只对大实例有效]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左支按机器环境分岔，每个叶子是一个&quot;可精确求解&quot;或&quot;有确定界&quot;的结论；右支是装箱问题的算法谱系，注意 N 那一格——它提醒你&quot;渐进&quot;不等于&quot;任意规模都保证&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<h3>类比：早餐摊的三口锅<\/h3>\n<p>你有三口锅（同型并行机），要煮若干份不同的东西，每份耗时不同。<strong>LPT<\/strong> 就是先把最耗时的下锅，然后哪口锅先空就往哪口锅里放。<strong>LS<\/strong> 是拿到什么就扔进最先空出来的锅。直觉上&quot;长的先下&quot;更稳，因为长任务一旦排在最后，会让某口锅空等很久——这正是 4/3 界的来源。<\/p>\n<p>类比失效处：现实锅里可以中途加料、可以并行同一道工序，模型里工件是不可中断的整体。<\/p>\n<h3>实例 1：LPT 在 2 台机器上跑一遍<\/h3>\n<p>工件加工时间：7, 6, 4, 4, 2。两台机器 M1、M2。<\/p>\n<table><thead><tr><th>步<\/th><th>工件<\/th><th>M1 负载<\/th><th>M2 负载<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>7<\/td><td>7<\/td><td>0<\/td><td>派给空闲的 M1<\/td><\/tr><tr><td>2<\/td><td>6<\/td><td>7<\/td><td>6<\/td><td>派给 M2<\/td><\/tr><tr><td>3<\/td><td>4<\/td><td>7<\/td><td>10<\/td><td>M2 更闲（6 &lt; 7）<\/td><\/tr><tr><td>4<\/td><td>4<\/td><td>11<\/td><td>10<\/td><td>M1 更闲（7 &lt; 10）<\/td><\/tr><tr><td>5<\/td><td>2<\/td><td>11<\/td><td>12<\/td><td>M2 更闲（10 &lt; 11）<\/td><\/tr><\/tbody><\/table>\n<p>makespan = 12。<\/p>\n<p><strong>核对最优性<\/strong>：总加工时间 7+6+4+4+2 = 23，两台机器理想下界是 11.5，所以至少 12。找到一个 12 的方案就说明最优：M1 放 7+4 = 11，M2 放 6+4+2 = 12 ✓。所以这个例子里 LPT 恰好最优。<\/p>\n<p><strong>换成 LS 会怎样<\/strong>：若按&quot;2,4,4,6,7&quot;这个顺序派，M1 会拿到 2+4+7 = 13，M2 拿 4+6 = 10，makespan 13 &gt; 12。顺序选错，结果就差。<\/p>\n<h3>实例 2：Johnson 规则排两道工序<\/h3>\n<p>四件工件在两台机器上的加工时间：<\/p>\n<table><thead><tr><th>工件<\/th><th>M1<\/th><th>M2<\/th><\/tr><\/thead><tbody><tr><td>J1<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>J2<\/td><td>1<\/td><td>4<\/td><\/tr><tr><td>J3<\/td><td>4<\/td><td>1<\/td><\/tr><tr><td>J4<\/td><td>2<\/td><td>3<\/td><\/tr><\/tbody><\/table>\n<p><strong>按 Johnson 规则<\/strong>：<\/p>\n<ul><li>\n全局最短是 1，出现在 J3 的 M2 上 → <strong>J3 排最后<\/strong>。\n<\/li><li>\n剩下 J1、J2、J4，最短是 1，在 J2 的 M1 上 → <strong>J2 排最前<\/strong>。\n<\/li><li>\n剩下 J1（M2 上 2 最短）、J4（M1 上 2）。最短是 2，出现在 J1 的 M2 上 → J1 排后面；于是顺序为 <strong>J2, J4, J1, J3<\/strong>。\n<\/ul>\n<p><strong>算 makespan<\/strong>：<\/p>\n<table><thead><tr><th><\/th><th>M1 时间轴<\/th><th>M2 时间轴<\/th><\/tr><\/thead><tbody><tr><td>J2<\/td><td>0–1<\/td><td>1–5<\/td><\/tr><tr><td>J4<\/td><td>1–3<\/td><td>5–8<\/td><\/tr><tr><td>J1<\/td><td>3–6<\/td><td>8–10<\/td><\/tr><tr><td>J3<\/td><td>6–10<\/td><td>10–11<\/td><\/tr><\/tbody><\/table>\n<p>makespan = <strong>11<\/strong>。<\/p>\n<p><strong>穷举 24 种顺序核对<\/strong>：最优值确实是 11（J2, J1, J4, J3 也能达到 11）。Johnson 规则给出的不是唯一最优，但一定最优。<\/p>\n<p><strong>为什么规则有效<\/strong>：如果最短时间在 M1 上，把它放最前，M1 一开工就有活干，M2 只能等它——所以它越早越好；如果在 M2 上，它放最后，正好让 M2 在末尾不空等。这条规则本质是把&quot;会让机器等活的工件&quot;推到两端。<\/p>\n<h3>实例 3：NF 为什么会浪费箱子<\/h3>\n<p>前面那个 5, 6, 5, 6（容量 10）的例子：NF 用了 4 箱，最优 3 箱。差别就在&quot;箱 1 装了 5，剩下 5 的空隙，但 NF 再也不回头用它&quot;。<\/p>\n<p><strong>换成 FF<\/strong>：物品 5 进箱 1（剩 5）；6 进不了箱 1，开箱 2；5 检查箱 1（剩 5，正好放下）→ 箱 1 满；6 检查箱 1、箱 2 都放不下，开箱 3。共 3 箱，等于最优。<strong>同一个输入，只因为&quot;回头看一眼&quot;，就省了一个箱子。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 SPT 对一切目标都好。<\/strong> 它对 ∑Cⱼ 最优，但对 Lₘₐₓ 可能很差——短工件先做会把长工件拖到很晚，最大延迟爆掉。\n<\/li><li>\n<strong>别以为 EDD 能最小化 ∑Tⱼ。<\/strong> 1||∑Tⱼ 是 NP-难的，EDD 不是最优，只是常用启发式。\n<\/li><li>\n<strong>别以为并行机上&quot;平均分配&quot;就好。<\/strong> 平均分配只看负载数量，不看工件长度；LPT 之所以好，是因为它优先处理&quot;无法被后补&quot;的长工件。\n<\/li><li>\n<strong>别以为装箱有 PTAS 就能随便设精度。<\/strong> 装箱只有<strong>渐进<\/strong> PTAS，小规模实例的保证很弱。\n<\/li><li>\n<strong>别以为 FFD 的 11/9 是&quot;平均表现&quot;。<\/strong> 那是最坏情况界；实际数据上 FFD 常常就在最优附近。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>（单选）<\/strong><code>1||∑Cⱼ<\/code> 的最优算法是\n<p>A. EDD　B. SPT　C. LPT　D. Johnson 规则 <strong>答案：B<\/strong>。解析：按加工时间从短到长（SPT），可用交换论证证明任意违反该顺序的相邻对交换后总完工时间不变差。<\/p>\n<\/ol>\n<ol><li>\n<strong>（单选）<\/strong><code>P||Cₘₐₓ<\/code> 的 LPT 算法最坏情况界是\n<p>A. 2　B. 3/2　C. 4/3 − 1/(3m)　D. 11/9 <strong>答案：C<\/strong>。解析：Graham 的经典结论；LS 的界才是 2 − 1/m，FFD 的 11/9 属于装箱问题。<\/p>\n<\/ol>\n<ol><li>\n<strong>（填空）<\/strong>Johnson 规则中，若最短加工时间出现在第二台机器上，该工件应排在______。\n<p><strong>答案：最后<\/strong>。解析：在 M2 上时间最短的工件放最后，可以让 M2 在末尾不空等；反之在 M1 上最短的放最前。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>为什么 NF 算法的界是 2，而 FF 能到 1.7？\n<p><strong>答案：<\/strong> NF 只维护&quot;当前打开的箱子&quot;，一旦开新箱就不再回头，因此任意两个相邻箱子的物品总量之和必然超过容量（否则后一个箱子里的第一件就能放进前一个），由此推出箱数不超过 2·OPT。FF 会回头检查所有已开箱子，空隙利用更充分，所以常数更小（1.7）。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>为什么装箱问题没有 PTAS，只有渐进 PTAS？\n<p><strong>答案：<\/strong> 装箱是强 NP-完全的。若存在 PTAS，就能在多项式时间内判定&quot;用 K 个箱子能否装下&quot;这类问题到任意精度，与强 NP-完全性矛盾（在 P ≠ NP 前提下）。渐进 PTAS 只保证&quot;当最优箱数足够大时&quot;近似比趋于 1+ε，小实例不受保证，因此绕开了这个矛盾。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nα|β|γ：机器环境、工件特征、目标函数，三段拼出一个问题代号。\n<\/li><li>\n单机三宝：∑Cⱼ 用 SPT，Lₘₐₓ 用 EDD，∑Uⱼ 用 Moore–Hodgson。\n<\/li><li>\n并行机 LPT 界 4/3 − 1/(3m)；LS 界 2 − 1/m。\n<\/li><li>\n两机流水 Johnson 规则；两机开放车间 Gonzalez（不停机即最优）。\n<\/li><li>\n装箱四算法 NF/FF/BF/FFD，界 2 / 1.7 / 更好 / 11/9；只有渐进 PTAS。\n<\/ul>", "ch07": "<h1>第 7 章：在线问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 5 章（竞争比的思想基础）、第 6 章（排序问题）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清&quot;在线&quot;和&quot;离线&quot;的区别，并解释为什么在线问题不能用&quot;最优值&quot;做评价标准。\n<\/li><li>\n写出竞争比的定义，并说明它为什么是一个&quot;上确界&quot;而不是&quot;平均值&quot;。\n<\/li><li>\n推导滑雪租赁问题的 2 − 1/N 竞争比，说出随机化策略能好到多少。\n<\/li><li>\n解释在线排序里 Graham 的 LS 为什么在 m ≤ 3 时是最优的，m = 4 又为什么卡在 √3。\n<\/li><li>\n说出 Paging 与 k-server 的关系，以及 LRU 为什么是&quot;最好的在线算法&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>在线问题的决策者看不到未来，只能在信息不全时立刻行动；评价标准因此从&quot;离最优多近&quot;换成&quot;最坏情况下比离线最优差几倍&quot;，这个比值叫竞争比，它衡量的是策略的稳健性，而不是聪明程度。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：什么叫&quot;在线&quot;（难度：基础）<\/h3>\n<p>离线问题（前面各章）：所有数据一次性给你，慢慢算，算完再给答案。<\/p>\n<p>在线问题：数据是<strong>一个一个到达<\/strong>的，每来一个你就得立刻决定，做完的决定不能反悔，而且你不知道下一个来什么、后面还有多少。<\/p>\n<p>三个日常场景：<\/p>\n<ul><li>\n<strong>滑雪租赁<\/strong>：你不知道自己会滑多少次，每次都在&quot;租（1 元/次）&quot;和&quot;买（N 元，永久）&quot;之间选。\n<\/li><li>\n<strong>找钥匙<\/strong>：钥匙丢在一条直路的东西某个方向、某个距离，你不知道它在哪，只能来回找。\n<\/li><li>\n<strong>缓存置换（Paging）<\/strong>：内存缓存只能放 k 页，来了新页面必须踢掉一个，你不知道接下来要访问哪些页。\n<\/ul>\n<p>在线问题的解叫<strong>在线算法<\/strong>，评价它的标杆是<strong>离线最优<\/strong>（假设你能预知全部输入时得到的最优解）。<\/p>\n<p>严格地说，在线算法 A 对某个输入序列 σ 的花费 C_A(σ)，与离线最优 C*(σ) 之比，取所有序列的上确界，就是<strong>竞争比<\/strong>：<\/p>\n<div>ρ_A = sup over σ of C_A(σ) / C*(σ)<\/div>\n<p>它回答的是&quot;最坏能差多少&quot;，跟平均表现无关。<\/p>\n<h3>概念 2：滑雪租赁——一个能算到底的例子（难度：基础）<\/h3>\n<p>租金每次 1 元，购买价 N 元（N ≥ 1），你一共会滑 t 次（t 未知）。<\/p>\n<p><strong>离线最优<\/strong>：如果知道 t，答案显而易见——t ≤ N 就全程租（花 t），t &gt; N 就第一天就买（花 N）。所以 C* = min(t, N)。<\/p>\n<p><strong>一个自然的在线策略 A(k)<\/strong>：先租 k−1 次，第 k 次如果还要滑，就买。<\/p>\n<p>取 k = N：t &lt; N 时全程租，花 t，与最优相同（比值 1）；t ≥ N 时花 (N−1) + N = 2N−1，而最优是 N，比值 (2N−1)/N = <strong>2 − 1/N<\/strong>。<\/p>\n<p>所以这个策略的竞争比是 2 − 1/N。当 N 很大时逼近 2——<strong>不管你多聪明，最坏情况下要付两倍的代价<\/strong>。<\/p>\n<p><strong>要不要用随机化？<\/strong> 有。按某个分布随机选择购买时机，可以把期望竞争比降到 <strong>e/(e−1) ≈ 1.58<\/strong>。随机化在这里有效，是因为对手（输入序列）不知道你的随机数，无法针对你构造最坏输入。<\/p>\n<p><strong>这个例子为什么经典<\/strong>：它把&quot;在线决策&quot;的全部要素压缩到两个参数（租价、买价），却完整展示了&quot;竞争比&quot;的含义、下界的紧性、随机化的作用。看懂它，后面所有在线问题都是同一套语言。<\/p>\n<h3>概念 3：找钥匙——为什么是 9 倍（难度：进阶）<\/h3>\n<p>你站在一个交叉口，钥匙在东西某个方向、距离 d 处。你不知道方向也不知道距离，只能来回搜索。这个问题的离线最优成本就是 d（已知位置时直接走过去）。<\/p>\n<p>书上比较了四个方案。方案 1 是 1,1,2,2,3,3,… 这样慢慢扩大，方案 2 是 2,2,4,4,6,6,… 扩大得快一点。<strong>方案 4<\/strong> 用的是等比翻倍：1, 1, 2, 4, 8, …（每一步把上一段再走一遍，然后向前翻倍）。<\/p>\n<p>方案 4 的竞争比是 <strong>9<\/strong>，而且书上进一步用反证法证明：<strong>任何方案的竞争比都不可能小于 9<\/strong>。所以 9 就是这个问题的最优竞争比，方案 4 已经做到最好。<\/p>\n<p><strong>为什么翻倍有效<\/strong>：如果钥匙在距离 d 处，你最后一次搜索的范围大概是 2^k，而你之前来回走的总里程是几何级数，总和不超过最后一段的常数倍。等比扩大的&quot;浪费&quot;被控制在一个常数里；等差扩大（方案 1、2）则会让&quot;来回次数&quot;和&quot;距离&quot;同时增长，比值趋于无穷。<\/p>\n<p><strong>关键教训<\/strong>：在线策略的参数要用<strong>几何级数<\/strong>而不是等差，否则浪费会累积。这条经验在 TCP 拥塞控制的超时重传、在进度式搜索（如机器人寻路）里都能看到。<\/p>\n<h3>概念 4：在线排序与半在线（难度：高难）<\/h3>\n<p><strong>在线 P||Cₘₐₓ<\/strong>：工件一个接一个到达，必须立刻派给某台机器，不许重排。Graham 的 <strong>LS<\/strong>（List Scheduling，每次派给当前负载最小的机器）竞争比是<\/p>\n<div>2 − 1/m<\/div>\n<p>而且这个界是<strong>紧的<\/strong>，更关键的是：<strong>m = 2 和 m = 3 时，LS 就是最好的在线算法<\/strong>（没有算法能做得更好）。所以 Graham 四十多年前给出的算法，到今天在小机器数下仍是最优的。<\/p>\n<p><strong>m = 4 发生了变化<\/strong>：Rudin 和 Chandrasekaran 在 2001 年证明 P4||Cₘₐₓ 的下界至少是 <strong>√3 ≈ 1.732<\/strong>，而当时最好的算法竞争比与之只差约 0.001。也就是说，<strong>机器数从 3 增加到 4，问题的难度的性质变了<\/strong>，为什么变，至今没有很好的解释。<\/p>\n<p><strong>半在线<\/strong>（semi-online）：给定一部分未来信息，比如&quot;所有工件的总加工时间已知&quot;或&quot;最优值已知&quot;。这类信息在现实中常常能拿到（订单总量、预算总额），利用它可以把竞争比压下来。书上的 <strong>THR<\/strong> 算法和 <strong>TC<\/strong> 算法（复合阈值）就是这一类。这也是谈之奕等人的研究方向（见参考文献里的多篇 Semi-online 论文）。<\/p>\n<p><strong>为什么半在线值得研究<\/strong>：它介于&quot;完全无知&quot;和&quot;完全预知&quot;之间，恰好是大多数现实场景的位置。只知道总量、不知道明细，就属于半在线。<\/p>\n<h3>概念 5：Paging——缓存该踢谁（难度：高难）<\/h3>\n<p>缓存容量 k 页，请求序列一页页到来。命中不花钱，未命中要把某页踢出去再读入，花 1 次。<\/p>\n<p><strong>离线最优<\/strong>是 <strong>LFD<\/strong>（Longest Forward Distance，也叫 Belady 算法）：踢掉&quot;未来最晚才被用到&quot;的那页。它需要预知未来，因此不可能在线实现。<\/p>\n<p><strong>在线算法<\/strong>：<\/p>\n<ul><li>\n<strong>LRU<\/strong>（最近最少使用）：踢掉最久没被访问的页。\n<\/li><li>\n<strong>FIFO<\/strong>（先进先出）：踢掉最早进来的页。\n<\/li><li>\n<strong>LIFO、LFU<\/strong>：踢最新进来的 / 踢使用次数最少的。\n<\/ul>\n<p>结论（书上给的）：<strong>LRU 和 FIFO 的竞争比都是 k<\/strong>（k 是缓存容量），而且这是<strong>最好可能的<\/strong>——不存在竞争比小于 k 的确定性在线算法。<strong>LIFO 和 LFU 的竞争比不是有限常数<\/strong>，可以任意差。<\/p>\n<p><strong>LRU 为什么是 k<\/strong>：考虑一个精心构造的请求序列，让 LRU 每次都不命中，而离线最优只miss 很少。核心思路是&quot;循环访问 k+1 个页面&quot;——LRU 每次必踢掉即将要用的那个，每次都 miss；离线算法因为知道顺序，可以只 miss 一次。<\/p>\n<h3>概念 6：k-server 与 CNN（难度：高难）<\/h3>\n<p><strong>k-server 问题<\/strong>：k 台服务器在一个度量空间里，请求点一个个到来，必须派一台服务器移动过去，代价是移动距离。目标是最小化总移动距离。Paging 是它的特例：<strong>把&quot;缓存里的 k 页&quot;看成&quot;k 台服务器所在的位置&quot;，把&quot;请求一页&quot;看成&quot;请求那个位置&quot;<\/strong>——不命中就等于把一台服务器移过去。<\/p>\n<p>经典算法：<\/p>\n<ul><li>\n<strong>贪心（Greedy）<\/strong>：派最近的服务器过去。\n<\/li><li>\n<strong>工作函数算法（WFA）<\/strong>：维护&quot;到目前为止的最优离线成本&quot;，每次选择使&quot;当前成本 + 未来最优&quot;最小的动作。它的竞争比是 <strong>2k − 1<\/strong>。\n<\/li><li>\n<strong>下界是 k<\/strong>：不存在竞争比小于 k 的算法（对一般度量空间）。所以 WFA 离最优只差一倍。\n<\/ul>\n<p><strong>CNN 问题<\/strong>：书上用它收尾，很有意思。一家电视台（CNN）派一个摄制组去拍新闻，摄制组只能沿<strong>水平或垂直的直线<\/strong>移动（因为要沿街道走、要架设机位）。需求点出现时，摄制组只要<strong>与它在同一行或同一列<\/strong>就算&quot;到达&quot;（不必重合）。<\/p>\n<p><strong>它与 k-server 的关系<\/strong>：把摄制组&quot;虚拟地一分为二&quot;，一个专门负责水平移动、一个专门负责垂直移动，就变成了两台服务器的问题——但这两台服务器必须协同（同一次只能动一台）。这个转化说明：<strong>看似奇怪的现实约束，往往可以翻译成已知模型的一个变种<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[输入是否可预知] --&gt;|可预知| B[离线问题：求最优]\n    A --&gt;|不可预知| C[在线问题]\n    C --&gt; D[评价标准：竞争比 rho = sup C_A / C_opt]\n    C --&gt; E[滑雪租赁 2 - 1/N]\n    C --&gt; F[随机化 e / e - 1 约 1.58]\n    C --&gt; G[找钥匙 最优竞争比 9]\n    C --&gt; H[在线排序 LS 界 2 - 1/m]\n    H --&gt; I[m&lt;=3 时 LS 最优]\n    H --&gt; J[m=4 下界 sqrt 3]\n    C --&gt; K[半在线 已知总量或最优值 THR TC]\n    C --&gt; L[Paging LRU FIFO 竞争比 k 最优]\n    L --&gt; M[k-server WFA 2k-1 下界 k]\n    M --&gt; N[CNN 摄制组 水平垂直移动]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：主干只有一层判断——输入能不能预知。往下每个叶子是一个具体问题的&quot;最好成绩&quot;：滑雪 2、找钥匙 9、排序 2−1/m、缓存 k、k-server 2k−1。这些数字就是在线算法的&quot;物理常数&quot;，记下来比记算法步骤有用。<\/p>\n<h2>类比与实例<\/h2>\n<h3>类比：没有地图的送外卖<\/h3>\n<p>离线像&quot;提前拿到全部订单，规划一条最优路线&quot;；在线像&quot;每来一单就得立刻出发，不知道下一单在哪&quot;。竞争比衡量的是&quot;最倒霉的一天，你跑的路是理想情况的几倍&quot;。<\/p>\n<p>类比失效处：现实骑手可以拒单、可以预估热点区域；模型里输入完全对抗，这个&quot;最坏情况&quot;其实很少出现，所以竞争比差不代表实际差。<\/p>\n<h3>实例 1：滑雪租赁算一遍<\/h3>\n<p>设 N = 10（买装备 10 元，租一次 1 元）。<\/p>\n<ul><li>\n你只滑 3 次：最优花 3（全租）。策略&quot;租 9 次再买&quot;也只花 3，比值 1。\n<\/li><li>\n你滑 12 次：最优花 10（第一天就买）。你的策略在第 10 次买，总花费 9 + 10 = 19，比值 1.9。\n<\/li><li>\n你滑 100 次：最优 10，你花 19，比值仍是 1.9。\n<\/ul>\n<p>最坏比值出现在&quot;刚好滑 N 次及以上&quot;的情形，等于 2 − 1/10 = 1.9。<strong>滑得越多，比值越稳定在 1.9<\/strong>——这就是&quot;上确界&quot;的含义：某个点取到，之后不再变差。<\/p>\n<h3>实例 2：找钥匙的等比搜索为什么是 9<\/h3>\n<p>设钥匙在西向 d = 2 米处（最优路径就是走 2 米）。<\/p>\n<p>按方案 4（1, 1, 2, 4, 8, …）搜索：向东 1 米、回来、向西 1 米、回来、向东 2 米、回来、向西 4 米——在走到西向 2 米处发现钥匙。<\/p>\n<p>总里程：1 + 1 + 1 + 2 + 2 + 4 + 2 = 13 米（每次都从交叉口出发、回到交叉口）。比值 13/2 = 6.5。<\/p>\n<p>若 d 恰好比某个搜索段稍长（比如 d = 8+ε），你要走完 1,1,2,4,8 再回头，总里程约 2(1+1+2+4+8) + 8 ≈ 40，比值约 5。最坏比值被证明恰好是 9，出现在&quot;刚好错过一段&quot;的位置。<\/p>\n<p><strong>注意这里的计算方式<\/strong>：每次都从交叉口出发，所以来回的路程要重复计算。如果允许&quot;不回头、直接继续走&quot;，方案会不同——<strong>模型里&quot;能不能回头&quot;这个细节，会改变最优策略<\/strong>。<\/p>\n<h3>实例 3：LRU 在循环访问下必败<\/h3>\n<p>缓存容量 k = 3，页面 A、B、C 已满。请求序列：D, A, B, C, D, A, B, C, …<\/p>\n<ul><li>\n<strong>LRU<\/strong>：请求 D 不命中，踢掉最久未用的（假设是 A）→ 装入 D。请求 A 又不命中，踢 B → 装 A。……每次请求都不命中，<strong>miss 率 100%<\/strong>。\n<\/li><li>\n<strong>离线最优（LFD）<\/strong>：知道接下来要用 A、B、C、D 循环，可以踢掉&quot;下一次最晚用到&quot;的那页，实际上每次也只 miss 一次，之后全命中。\n<\/ul>\n<p>这个构造说明：<strong>LRU 的 k 倍界是紧的<\/strong>，&quot;最近最久未用&quot;这条直觉在循环模式下完全失效。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为在线算法的竞争比是&quot;平均表现&quot;。<\/strong> 它是全序列的上确界，可以出现在非常极端的输入上。\n<\/li><li>\n<strong>别以为&quot;离线最优&quot;是可达的。<\/strong> 它只是一个比较标杆，需要预知未来，在线算法永远拿不到。\n<\/li><li>\n<strong>别以为随机化能保证最坏情况更好。<\/strong> 随机化改善的是<strong>期望<\/strong>竞争比；对手若知道你的分布，仍可构造坏序列。\n<\/li><li>\n<strong>别以为 m 越大在线排序越容易。<\/strong> 反而是 m = 4 开始出现&quot;下界与最好算法只差 0.001&quot;的僵局，问题的结构性变化至今没解释清。\n<\/li><li>\n<strong>别以为 LFU 一定比 LRU 好。<\/strong> LFU 的竞争比没有有限上界，遇到&quot;一次性热点&quot;会把缓存塞满垃圾。\n<\/li><li>\n<strong>别以为 Paging 和 k-server 是两个问题。<\/strong> 前者是后者的特例，这条对应关系是整章最省力的记忆锚点。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>（单选）<\/strong>竞争比 ρ_A 的定义是\n<p>A. 平均花费与最优花费之比　B. 所有输入序列上 C_A/C* 的上确界　C. 最坏输入下的绝对花费　D. 算法运行时间的比值 <strong>答案：B<\/strong>。解析：竞争比衡量&quot;最坏情况下的相对差距&quot;，取的是上确界（sup），不是平均。<\/p>\n<\/ol>\n<ol><li>\n<strong>（单选）<\/strong>滑雪租赁问题（租 1 元/次，买 N 元）的确定性最优竞争比是\n<p>A. 2　B. 2 − 1/N　C. e/(e−1)　D. ln N <strong>答案：B<\/strong>。解析：租 N−1 次后购买，最坏花费 2N−1，与最优 N 的比值是 2−1/N；e/(e−1) 是随机化策略的期望竞争比。<\/p>\n<\/ol>\n<ol><li>\n<strong>（填空）<\/strong>在线排序 P||Cₘₐₓ 中，LS 算法的竞争比是______，且当 m = 2、3 时它是最优在线算法。\n<p><strong>答案：2 − 1/m<\/strong>。解析：Graham 的经典结论，界是紧的；m = 4 时下界变为 √3（Rudin–Chandrasekaran）。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>为什么 LRU 的竞争比是 k，而不可能更好？\n<p><strong>答案：<\/strong> 存在一类&quot;循环访问 k+1 个页面&quot;的请求序列，使 LRU 每次都 miss（它总踢掉即将被用的那页），而离线算法只 miss 少数几次，比值达到 k。同时可以证明任何确定性在线算法的竞争比都不小于 k，所以 k 是这一类问题的最优值。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>Paging 问题怎么变成 k-server 问题？\n<p><strong>答案：<\/strong> 把缓存中的 k 个页面看成 k 台服务器在&quot;数据&quot;这个度量空间中的位置；请求一页 = 请求该位置。命中表示已有服务器在那儿，不命中就要把一台服务器移过去，移动代价为 1。于是&quot;踢一页、读一页&quot;等价于&quot;移动一台服务器&quot;，Paging 就是 k-server 的特例。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n在线 = 不知未来、立即决策、不可反悔；评价用竞争比（上确界）。\n<\/li><li>\n滑雪租赁 2−1/N；随机化 e/(e−1)；找钥匙 9；这两个是最经典的常数。\n<\/li><li>\n在线排序 LS 界 2−1/m，m ≤ 3 最优，m = 4 卡在 √3。\n<\/li><li>\nPaging：LRU/FIFO 竞争比 k 且最优；LIFO/LFU 无有限界。\n<\/li><li>\nk-server：WFA 竞争比 2k−1，下界 k；Paging 是它的特例，CNN 是它的变种。\n<\/ul>", "ch08": "<h1>第 8 章：博弈论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章（对偶、线性规划）、第 5 章（复杂性思想）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出一个零和博弈的收益矩阵，并判断它有没有鞍点（纯策略解）。\n<\/li><li>\n用 max-min 与 min-max 的相等关系解释&quot;博弈的值&quot;，并说清它和线性规划对偶的关系。\n<\/li><li>\n用最优反应法求出一个 2×2 博弈的 Nash 均衡（纯策略与混合策略各一例）。\n<\/li><li>\n写出 Cournot 模型的反应函数并解出均衡产量；说清 Bertrand 为什么会导致&quot;价格战到底&quot;。\n<\/li><li>\n用&quot;最大化 (x−x₀)(y−y₀)&quot;写出 Nash 谈判解，并解释这个乘积的含义。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p><strong>博弈论研究的是&quot;你的收益取决于别人怎么选&quot;的决策；它的核心结论只有一条——当每个人只能控制自己的策略时，唯一稳定的状态是&quot;谁单方面改变都吃亏&quot;，这个状态叫 Nash 均衡，而它未必是社会整体最优的。<\/strong><\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：博弈论在研究什么（难度：基础）<\/h3>\n<p>博弈论（game theory）研究<strong>存在利益冲突的多个主体，在相互依存的环境中如何决策<\/strong>。<\/p>\n<p>关键词是&quot;相互依存&quot;：你的收益不只由你的行动决定，还由别人的行动决定。这和前面几章的单人优化有本质区别——<strong>优化问题里只有一个决策者，博弈问题里有多个，而且他们的目标可能相反<\/strong>。<\/p>\n<p>历史脉络（记住三个人名就够）：<\/p>\n<ul><li>\n<strong>von Neumann 与 Morgenstern<\/strong>，1944 年《博弈论与经济行为》，把博弈变成一门数学学科。\n<\/li><li>\n<strong>Nash<\/strong>，1950—1951 年提出非合作博弈的均衡概念，现在一切多人决策分析都绕不开它。\n<\/li><li>\n1994 年诺贝尔经济学奖授予 Nash、Harsanyi、Selten，博弈论正式进入主流经济学。\n<\/ul>\n<p>分类方式：<\/p>\n<table><thead><tr><th>分法<\/th><th>两类<\/th><\/tr><\/thead><tbody><tr><td>有没有强制约束力的协议<\/td><td>合作博弈 / 非合作博弈<\/td><\/tr><tr><td>收益总和是否固定<\/td><td>零和博弈 / 非零和博弈<\/td><\/tr><tr><td>信息是否完全<\/td><td>完全信息 / 不完全信息<\/td><\/tr><\/tbody><\/table>\n<p>本书主要讲<strong>非合作、零和与简单的非零和<\/strong>，这也是与运筹学关系最紧的部分。<\/p>\n<h3>概念 2：矩阵博弈——零和，你多我就少（难度：进阶）<\/h3>\n<p>两人零和博弈：甲选一行、乙选一列，收益矩阵 A = (aᵢⱼ)，aᵢⱼ 表示&quot;甲得多少&quot;。因为零和，乙的收益就是 −aᵢⱼ。<\/p>\n<p><strong>甲的想法<\/strong>：如果选第 i 行，最坏情况是乙挑了让 aᵢⱼ 最小的那一列。所以甲能保证的收益是<\/p>\n<div>max over i of min over j of aᵢⱼ　（max-min，下界）<\/div>\n<p><strong>乙的想法<\/strong>：如果选第 j 列，最坏情况是甲挑了让 aᵢⱼ 最大的那一行。所以乙能保证甲不超过<\/p>\n<div>min over j of max over i of aᵢⱼ　（min-max，上界）<\/div>\n<p>一般有 <strong>max-min ≤ min-max<\/strong>（甲能保证的，不会超过乙能限制的）。当两者<strong>相等<\/strong>时，这个公共值 v 叫<strong>博弈的值<\/strong>，对应的策略叫<strong>鞍点<\/strong>（saddle point），双方都有了纯策略的最优选择。<\/p>\n<p><strong>鞍点的判别<\/strong>（实用判据）：某个元素 aᵢⱼ 是它<strong>所在行的最小值<\/strong>，同时又是它<strong>所在列的最大值<\/strong>，它就是鞍点。<\/p>\n<p><strong>没有鞍点怎么办<\/strong>：用<strong>混合策略<\/strong>——甲按概率分布 x 选行，乙按 y 选列。von Neumann 的<strong>极小极大定理<\/strong>说：<strong>零和博弈的值一定存在<\/strong>，混合策略下 max-min 与 min-max 必相等。<\/p>\n<p>这个定理的证明用的正是第 1 章的工具：把&quot;甲的最优混合策略&quot;写成一个线性规划，把&quot;乙的最优混合策略&quot;写成它的对偶，强对偶定理直接给出两者相等。<strong>这是全书最漂亮的一处呼应：对偶理论不只属于线性规划，它就是零和博弈的数学形式。<\/strong><\/p>\n<h3>概念 3：Nash 均衡——谁都不想单方面改（难度：进阶）<\/h3>\n<p><strong>囚徒困境<\/strong>（Tucker 1950 年讲述）：两人被抓，分开审讯。各自可以&quot;坦白&quot;或&quot;沉默&quot;。<\/p>\n<table><thead><tr><th>甲 \\ 乙<\/th><th>坦白<\/th><th>沉默<\/th><\/tr><\/thead><tbody><tr><td><strong>坦白<\/strong><\/td><td>各判 8 年<\/td><td>甲免罪，乙判 10 年<\/td><\/tr><tr><td><strong>沉默<\/strong><\/td><td>甲判 10 年，乙免罪<\/td><td>各判 1 年<\/td><\/tr><\/tbody><\/table>\n<p>把&quot;判罚的相反数&quot;当收益。甲发现：不管乙怎么选，&quot;坦白&quot;总比&quot;沉默&quot;好（乙坦白时 8 年 &lt; 10 年；乙沉默时 0 年 &lt; 1 年）。乙也一样。于是两人都坦白，各判 8 年——<strong>而如果都沉默，只判 1 年<\/strong>。<\/p>\n<p>这就是困境：<strong>每个人的理性选择，合起来是最差的结果<\/strong>。<\/p>\n<p><strong>Nash 均衡的严格定义<\/strong>：设有 n 个参与者，第 i 个的策略集是 Aᵢ，收益函数 uᵢ。一个局势 a = (a₁,…,aₙ) 是 Nash 均衡，当且仅当<strong>没有任何一个参与者能通过单方面改变自己的策略而提高收益<\/strong>：<\/p>\n<div>对每个 i 和每个 aᵢ′ ∈ Aᵢ，都有 uᵢ(a) ≥ uᵢ(a₁,…,aᵢ′,…,aₙ)<\/div>\n<p>注意三件事：<\/p>\n<ol><li>\n<strong>只要求&quot;单方面&quot;改不动<\/strong>，不要求整体最优。囚徒困境里两人都坦白是 Nash 均衡，但收益远低于都沉默。\n<\/li><li>\n<strong>纯策略均衡可能不存在<\/strong>。石头剪刀布就没有：无论你出什么，对手换个出法就能赢你。\n<\/li><li>\n<strong>混合策略均衡一定存在<\/strong>（Nash 1951 的定理），证明用的是不动点定理。这是博弈论最重要的存在性结论。\n<\/ol>\n<p><strong>最优反应<\/strong>是求均衡的实用方法：对每个参与者，算出&quot;在别人选某个策略时，我最好选什么&quot;，画出反应函数，交点就是均衡。<\/p>\n<p><strong>无政府代价（Price of Anarchy, PoA）<\/strong>：衡量&quot;均衡有多糟&quot;，定义为<\/p>\n<div>PoA = 最坏均衡的社会总收益 / 最优社会总收益<\/div>\n<p>囚徒困境里 PoA 大于 1（均衡比最优差）；书上还举了&quot;集团谈判各自只顾小团体、被对手各个击破&quot;的例子，PoA 可以趋于无穷——<strong>这说明&quot;每个人都理性&quot;不等于&quot;集体理性&quot;<\/strong>。<\/p>\n<h3>概念 4：三个经典经济模型（难度：进阶）<\/h3>\n<p><strong>（1）Cournot 模型（产量竞争）。<\/strong> 两家企业生产同一种产品，总产量 Q = q₁ + q₂，市场价格 p = M − Q（M 是最高可接受价格），单位成本 c。<\/p>\n<p>企业 1 的利润：π₁ = (p − c)q₁ = (M − q₁ − q₂ − c)q₁。对它关于 q₁ 求导并令其为 0：<\/p>\n<div>q₁ = (M − c − q₂) / 2　（企业 1 的反应函数）<\/div>\n<p>对称地 q₂ = (M − c − q₁)/2。两式联立：<\/p>\n<div>q₁ = q₂ = (M − c) / 3，　p = (M + 2c) / 3<\/div>\n<p><strong>为什么是这个数<\/strong>：每家企业都假设对方产量不变，自己多产一点就多赚一点；但两家都这么想，总产量上去了，价格就下来了。均衡产量比&quot;完全竞争&quot;低、比&quot;垄断&quot;（两家合谋产 M−c 的一半）高。<\/p>\n<p><strong>（2）Bertrand 模型（价格竞争）。<\/strong> 同样的产品，两家比价格，消费者只买便宜的那家。<\/p>\n<p>结论很极端：<strong>均衡是 p₁ = p₂ = c<\/strong>，也就是价格压到成本，利润为零。<\/p>\n<p>理由：只要对手定价 p &gt; c，我定价 p − ε 就能抢走全部市场且仍有利润；双方都这么想，价格一路压到成本。<strong>两家企业就能实现完全竞争的结果<\/strong>，这被称为&quot;Bertrand 悖论&quot;——现实里当然不会这样，因为存在产能限制、品牌差异、搜索成本。<\/p>\n<p><strong>（3）Hotelling 模型（位置竞争）。<\/strong> 一条线段代表一条街，消费者均匀分布，两家店选位置。消费者去最近的店。<\/p>\n<p>结论：<strong>两家都会挤在中点<\/strong>（最小差异化）。因为只要对手不在中点，你往对手那边挪一点就能抢到更多客源；双方都挪，最后重合。<\/p>\n<p><strong>三家企业时结论变了<\/strong>：三家都挤在中点<strong>不是<\/strong>均衡——任意一家稍微偏一点，就能独占半边客源；而三家分散开也不是均衡。<strong>三家时不存在纯策略 Nash 均衡<\/strong>。这是&quot;参与者数量改变问题结构&quot;的又一个例子（和第 7 章 m = 4 的在线排序异曲同工）。<\/p>\n<h3>概念 5：讨价还价（难度：高难）<\/h3>\n<p>两人分一块蛋糕，怎么分才算&quot;公平且理性&quot;？<\/p>\n<p><strong>Nash 谈判解<\/strong>（1950）：设可行收益集合为 S（凸集），谈崩时的收益（ disagreement point）为 (x₀, y₀)。Nash 解是下面这个优化的唯一最优解：<\/p>\n<div>max over (x,y) ∈ S of (x − x₀)(y − y₀)　s.t. x ≥ x₀，y ≥ y₀<\/div>\n<p><strong>这个乘积的含义<\/strong>：它衡量&quot;双方的<strong>增量<\/strong>之积&quot;。在总收益固定的情况下（x + y = 常数），这个乘积在<strong>平分增量<\/strong>时最大。所以 Nash 解在对称情形下就是&quot;把多出来的部分对半分&quot;。<\/p>\n<p><strong>例<\/strong>：S = {(x,y) | x + y ≤ 1，x,y ≥ 0}，谈崩点 (0,0)。最大化 xy 且 x+y ≤ 1，由均值不等式 xy ≤ ((x+y)/2)² ≤ 1/4，当 x = y = 0.5 时取到。所以各分一半。<\/p>\n<p><strong>公理化刻画<\/strong>：Nash 解是唯一满足四条公理的解——帕累托最优（不能还有提升空间）、对称性（双方条件相同则平分）、线性不变性（把收益按比例缩放不改变解）、无关替代独立性（删掉不会被选的选项不影响结果）。<\/p>\n<p><strong>轮流出价（Rubinstein 1982）<\/strong>：现实里谈判是多轮的。若双方轮流报价、每轮有时间成本（贴现因子 δ），子博弈精炼均衡给出的分配是<\/p>\n<div>先出价者得 1/(1+δ)，后出价者得 δ/(1+δ)<\/div>\n<p><strong>先出价者有优势<\/strong>，而且 δ 越接近 1（时间成本越小），分配越接近平分。这条结论解释了一个现象：<strong>谈判里&quot;谁先开口&quot;确实有实质优势<\/strong>，不是心理作用。<\/p>\n<h3>概念 6：把博弈论放回运筹学（难度：进阶）<\/h3>\n<p>为什么一本运筹学教材要讲博弈论？三个接口：<\/p>\n<ol><li>\n<strong>零和博弈 = 线性规划的对偶<\/strong>。第 1 章的对偶理论在这里获得了一个&quot;人&quot;的解释：对偶变量是&quot;对手的策略价值&quot;。\n<\/li><li>\n<strong>均衡是另一种&quot;最优性&quot;<\/strong>。优化问&quot;我该怎么选最好&quot;，博弈问&quot;大家都这么选时，谁会先改&quot;。两种问题在建模上的差别，就是&quot;有没有第二个决策者&quot;。\n<\/li><li>\n<strong>PoA 是系统设计的指标<\/strong>。设计规则（拍卖、拥堵收费、排班制度）时，真正要保证的不是&quot;最优解可达&quot;，而是&quot;均衡不要太糟&quot;。这是运筹学从&quot;算最优&quot;走向&quot;设计机制&quot;的关键一步。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[博弈：多个决策者 收益互相依赖] --&gt; B{收益总和固定吗}\n    B --&gt;|零和| C[矩阵博弈]\n    C --&gt; C1[求 max-min 与 min-max]\n    C1 --&gt; C2{两者相等吗}\n    C2 --&gt;|相等| C3[鞍点 纯策略解 值 v]\n    C2 --&gt;|不等| C4[混合策略 极小极大定理]\n    C4 --&gt; C5[线性规划 + 对偶]\n    B --&gt;|非零和| D[一般博弈]\n    D --&gt; D1[囚徒困境]\n    D --&gt; D2[Cournot 产量]\n    D --&gt; D3[Bertrand 价格]\n    D --&gt; D4[Hotelling 位置]\n    D --&gt; E[Nash 均衡：无人能单方面改善]\n    E --&gt; F[存在性：混合策略必存在]\n    E --&gt; G[PoA：均衡比最优差多少]\n    D --&gt; H[讨价还价 Nash 解 最大化增量乘积]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：中间那个&quot;收益总和固定吗&quot;是分水岭。零和那一支最终落到&quot;线性规划 + 对偶&quot;，这正是它与第 1 章的接口；非零和那一支落到 Nash 均衡，而 Nash 均衡的核心是&quot;单方面改不动&quot;这个判据。<\/p>\n<h2>类比与实例<\/h2>\n<h3>类比：抢最后一个座位的地铁<\/h3>\n<p>一节车厢只剩一个座位，两个人同时冲向它。谁先到谁坐——这是零和：一个人的收益正好是另一个人的损失。如果两人都谦让，可能都站着（非零和的坏均衡）。博弈论要问的不是&quot;谁是好人&quot;，而是&quot;在什么规则下，理性人会怎么动&quot;。<\/p>\n<p>类比失效处：地铁里人还有&quot;体面&quot;&quot;不撞人&quot;等隐性成本；模型里只有收益数字。<\/p>\n<h3>实例 1：一个 2×2 零和博弈求值<\/h3>\n<p>收益矩阵（甲选行、乙选列）：<\/p>\n<table><thead><tr><th>甲 \\ 乙<\/th><th>乙1<\/th><th>乙2<\/th><\/tr><\/thead><tbody><tr><td><strong>甲1<\/strong><\/td><td>3<\/td><td>−1<\/td><\/tr><tr><td><strong>甲2<\/strong><\/td><td>−2<\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p><strong>先找鞍点<\/strong>：甲1 行的最小值是 −1，甲2 行的最小值是 −2 → 行的最大 = −1。乙1 列的最大值是 3，乙2 列的最大值是 1 → 列的最小 = 1。max-min = −1 ≠ min-max = 1，<strong>没有鞍点<\/strong>，要算混合策略。<\/p>\n<p><strong>设甲以概率 p 选甲1<\/strong>，则甲1 的期望收益（对乙1、乙2）：<\/p>\n<ul><li>\n对乙1：3p + (−2)(1−p) = 5p − 2\n<\/li><li>\n对乙2：−1·p + 1·(1−p) = 1 − 2p\n<\/ul>\n<p>甲要让自己&quot;最坏情况&quot;尽量好，令两式相等：<\/p>\n<div>5p − 2 = 1 − 2p　→　7p = 3　→　p = 3/7<\/div>\n<p>此时期望值 = 1 − 2(3/7) = 1/7。所以<strong>博弈的值 v = 1/7<\/strong>，甲的策略是 (3/7, 4/7)。<\/p>\n<p><strong>乙的策略对称算<\/strong>：设乙以 q 选乙1，令甲选两行的期望相等：<\/p>\n<ul><li>\n甲1：3q + (−1)(1−q) = 4q − 1\n<\/li><li>\n甲2：−2q + 1(1−q) = 1 − 3q\n<p>4q − 1 = 1 − 3q → 7q = 2 → q = 2/7。乙策略 (2/7, 5/7)。<\/p>\n<\/ul>\n<p><strong>核对<\/strong>：把甲策略代入乙的两个列：5(3/7) − 2 = 1/7 ✓；1 − 2(3/7) = 1/7 ✓。双方都拿到 1/7，说明这就是值。<\/p>\n<p><strong>这个 1/7 是怎么来的<\/strong>：它等于 2×2 矩阵的&quot;行列式除以元素和&quot;——(3×1 − (−1)(−2)) / (3 + 1 + 2 + 1) = (3 − 2)/7 = 1/7。这个公式对 2×2 零和博弈通用，可以拿来验算。<\/p>\n<h3>实例 2：Cournot 均衡的数字版<\/h3>\n<p>M = 10，c = 1（即 p = 10 − q₁ − q₂，成本 1/件）。<\/p>\n<ul><li>\n反应函数：q₁ = (10 − 1 − q₂)/2 = (9 − q₂)/2。\n<\/li><li>\n对称均衡：q = (9 − q)/2 → 2q = 9 − q → 3q = 9 → <strong>q = 3<\/strong>。\n<\/li><li>\n两家各产 3，总产量 6，价格 p = 10 − 6 = 4。\n<\/li><li>\n每家利润 = (4 − 1)×3 = 9。\n<\/ul>\n<p><strong>对照垄断<\/strong>：若两家合谋当一家，总产量 Q 满足 max (10 − Q − 1)Q → Q = 4.5，价格 5.5，总利润 20.25（每家 10.125）。<strong>合谋比竞争赚得多<\/strong>，但合谋不稳定——任一家偷偷多产一点就能多赚，这正是 Cournot 均衡的&quot;囚徒困境&quot;版本。<\/p>\n<p><strong>对照完全竞争<\/strong>：价格压到成本 c = 1，总产量 9。所以三种情形的产量排序是：竞争（9）&gt; Cournot（6）&gt; 垄断（4.5）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 Nash 均衡就是&quot;最优解&quot;。<\/strong> 它是&quot;没人想单方面改&quot;的稳定点，可能所有参与者都不满意（囚徒困境）。\n<\/li><li>\n<strong>别以为均衡一定存在纯策略。<\/strong> 石头剪刀布、Hotelling 三家店都没有纯策略均衡；混合策略均衡的存在性另有定理保证。\n<\/li><li>\n<strong>别以为 max-min = min-max 总成立。<\/strong> 一般只有一边大一边小；两者相等的特殊情形才叫有鞍点。\n<\/li><li>\n<strong>别以为 Bertrand 均衡&quot;不现实&quot;所以不重要。<\/strong> 它恰恰说明了&quot;产品同质 + 无产能限制&quot;这个假设有多强；现实里加一条产能约束，结论立刻变（这叫 Edgeworth 修正）。\n<\/li><li>\n<strong>别以为 Nash 谈判解是&quot;平分&quot;。<\/strong> 它最大化的是增量乘积；只有在对称且总收益固定时才刚好等于平分。\n<\/li><li>\n<strong>别以为 PoA 只是理论玩具。<\/strong> 设计拥堵收费、拍卖规则、平台抽成时，PoA 是唯一的可计算指标。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<strong>（单选）<\/strong>零和博弈存在鞍点的充要条件是\n<p>A. 收益矩阵对称　B. max-min = min-max　C. 所有元素非负　D. 参与者人数为 2 <strong>答案：B<\/strong>。解析：鞍点意味着甲能保证的下界恰好等于乙能限制的上界，两者相等时公共值就是博弈的值。<\/p>\n<\/ol>\n<ol><li>\n<strong>（单选）<\/strong>囚徒困境中&quot;双方都坦白&quot;是\n<p>A. 社会最优　B. Nash 均衡但非社会最优　C. 不是均衡　D. 帕累托最优 <strong>答案：B<\/strong>。解析：任一方单方面改成沉默都会让自己判得更重，所以是均衡；但双方沉默的总判罚更轻，所以不是社会最优。<\/p>\n<\/ol>\n<ol><li>\n<strong>（填空）<\/strong>Cournot 模型中两家企业成本相同、需求 p = M − q₁ − q₂，均衡产量为 q₁ = q₂ = ______。\n<p><strong>答案：(M − c)/3<\/strong>。解析：由反应函数 q = (M − c − q)/2 解得 3q = M − c。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>为什么说&quot;零和博弈的值&quot;和&quot;线性规划的对偶&quot;是同一件事？\n<p><strong>答案：<\/strong> 把甲的混合策略写成变量、约束&quot;对每一列期望收益不低于 v&quot;、目标最大化 v，得到一个线性规划；把乙的混合策略写成&quot;对每一行期望损失不超过 w&quot;、目标最小化 w，得到它的对偶。强对偶定理保证两者最优值相等，这个公共值就是博弈的值。所以极小极大定理就是 LP 对偶定理的一个解释。<\/p>\n<\/ol>\n<ol><li>\n<strong>（简答）<\/strong>Hotelling 模型里为什么三家店不存在纯策略均衡，而两家存在？\n<p><strong>答案：<\/strong> 两家时，任何偏离中点的位置都会被对手&quot;贴过来&quot;抢走客源，所以都挤在中点是稳定点。三家时，若都聚在中点，每家只分到 1/3；任意一家稍微偏向一侧就能独占那一侧超过半数的客源，因此中点不是均衡。而分散摆放时，总有一家可以移动位置获得更多客源。所以三家在任何位置组合下都有人想动，不存在纯策略均衡。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n零和：max-min ≤ min-max，相等则鞍点；不等则用混合策略，值由 LP 对偶给出。\n<\/li><li>\nNash 均衡的判据只有一句：没人能单方面改变策略而获益。\n<\/li><li>\n纯策略均衡未必存在，混合策略均衡一定存在（Nash 定理）。\n<\/li><li>\nCournot 产量 (M−c)/3；Bertrand 价格压到成本；Hotelling 两家挤中点、三家无纯策略均衡。\n<\/li><li>\n谈判解最大化增量乘积；轮流出价里先开口者占优。\n<\/li><li>\nPoA 衡量&quot;理性个体的均衡&quot;离&quot;社会最优&quot;有多远。\n<\/ul>", "c01": "<h1>单纯形法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>单纯形法是解线性规划的系统方法：从一个顶点出发，沿着&quot;让目标变好&quot;的边走到相邻顶点，走到不能再好为止。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是线性规划的通用解法，也是理解&quot;为什么最优解在顶点&quot;&quot;对偶是什么&quot;&quot;割平面怎么加&quot;的基础。后面第 3 章的割平面、第 8 章的博弈求值，都要回到单纯形表的语言。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[化成标准形] --&gt; B[找初始基本可行解]\n    B --&gt; C[算检验数 sigma]\n    C --&gt; D{有 sigma 大于 0 吗}\n    D --&gt;|有| E[选入基变量 最小比值定出基]\n    E --&gt; F[主元消去 换表]\n    F --&gt; C\n    D --&gt;|没有| G[当前解最优]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看这张图只要抓住一个循环：<strong>算检验数 → 挑一个变好的方向 → 沿边走到下一个顶点 → 重新算<\/strong>。循环终止的条件是&quot;所有检验数都不大于 0&quot;。<\/p>\n<h2>详解<\/h2>\n<p>线性规划的标准形要求：最大化、约束全是等式、变量全非负、右端项非负。任何原问题都能通过&quot;加松弛变量、乘 −1、拆自由变量&quot;转成标准形。<\/p>\n<p>在等式约束 AX = b 下，取一组基 B（可逆子矩阵），令非基变量全为 0，得到 <strong>基本解<\/strong> x_B = B⁻¹b。若 x_B ≥ 0，它就是<strong>基本可行解（BFS）<\/strong>，几何上对应可行域的一个<strong>顶点<\/strong>。<\/p>\n<p>关键定理：<strong>若最优解存在，必在某个顶点取到<\/strong>。所以只要在顶点之间走，就不会漏掉最优。<\/p>\n<p><strong>检验数<\/strong> σ_j = c_j − c_B^T B⁻¹ A_j，含义是&quot;把非基变量 x_j 增加 1 个单位，目标能改善多少&quot;。σ_j &gt; 0 说明还有改进空间。<\/p>\n<p><strong>最小比值规则<\/strong>：选 θ = min{ b_i / a_ij : a_ij &gt; 0 }，保证新解仍然可行（不越出可行域）。这一步是单纯形法里最容易算错的地方——分母只取正元素。<\/p>\n<p><strong>退化与循环<\/strong>：若最小比值出现并列，可能得到退化基本解（某个基变量取 0），理论上可能循环（Beale 1955 构造过例子）。Bland 1977 的规则（选最小的下标入基）可以保证不循环。<\/p>\n<p><strong>两阶段法<\/strong>：原问题没有明显初始可行基时，先引入人工变量、最小化人工变量之和，第一阶段把人工变量赶出去，第二阶段再优化原目标。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;最优解在顶点&quot;无条件成立。<\/strong> 前提是可行域非空、有界（或有最优值）；无界方向存在时可能无最优解。\n<\/li><li>\n<strong>别以为检验数大的变量一定该入基。<\/strong> 那只是一种选法（最大改进法）；入基规则只影响速度，不影响正确性。\n<\/li><li>\n<strong>别以为退化就是错。<\/strong> 退化只是基变量取 0，仍是合法解，只是可能原地打转。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>单纯形法、两阶段法<\/td><td>最优解在顶点；检验数判最优<\/td><\/tr><tr><td>第 1 章<\/td><td>对偶与影子价格<\/td><td>对偶最优解 = 最后一张表的检验数<\/td><\/tr><tr><td>第 3 章<\/td><td>割平面法<\/td><td>在 LP 松弛的最优表上加一行割<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线性规划标准形、矩阵求逆\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">对偶与影子价格<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">割平面与分枝定界<\/a>\n<\/ul>", "c02": "<h1>对偶与影子价格<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章、第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每个线性规划都有一个&quot;影子问题&quot;（对偶），它的最优值等于原问题的最优值；对偶变量的值告诉你&quot;每多一单位资源，目标能多赚多少&quot;，这就是影子价格。<\/p>\n<h2>为什么重要<\/h2>\n<p>对偶是全书出现频率最高的工具：第 1 章用它解释影子价格，第 2 章用它做位势法检验，第 8 章用它证明零和博弈的值存在。<strong>不会对偶，这本书只能读懂一半。<\/strong><\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    P[原问题 P：max c x, Ax &lt;= b, x &gt;= 0] --&gt; D[对偶 D：min b y, A^T y &gt;= c, y &gt;= 0]\n    P --&gt; T1[弱对偶：任意可行 x,y 都有 c x &lt;= b y]\n    T1 --&gt; T2[强对偶：最优值相等]\n    T2 --&gt; T3[互补松弛：x_j 与松弛量不同时为正]\n    D --&gt; T4[y_i = 影子价格 = 第 i 种资源的边际价值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图重点：<strong>两个问题共用一套数据（A、b、c），只是角色互换<\/strong>——原来的约束变成对偶的变量，原来的变量变成对偶的约束。<\/p>\n<h2>详解<\/h2>\n<p><strong>构造对偶的三条规则<\/strong>（对 max 型）：约束方向反转（≤ 变 ≥）、右端项 b 变成目标系数、目标系数 c 变成右端项、变量非负不变。<\/p>\n<p><strong>四条定理<\/strong>：<\/p>\n<ol><li>\n<strong>弱对偶<\/strong>：任一原可行解 x 与任一对偶可行解 y 满足 c x ≤ b y。含义：对偶值永远是原问题的上界。\n<\/li><li>\n<strong>强对偶<\/strong>：若两者都有可行解，则最优值相等。\n<\/li><li>\n<strong>互补松弛<\/strong>：最优解里，若 x_j &gt; 0 则对应的对偶约束是紧的（等号成立）；若某个原约束有松弛（没用完），则对应的对偶变量为 0。\n<\/li><li>\n<strong>对偶的最优解可从最终单纯形表读出<\/strong>：松弛变量列的检验数就是 y 的分量。\n<\/ol>\n<p><strong>影子价格的经济含义<\/strong>：y_i 是&quot;第 i 种资源增加 1 单位时，最优目标值的增量&quot;。它不是资源的市场价格，而是<strong>在这个模型里的边际价值<\/strong>。资源有剩余（约束松）时影子价格为 0——多给你也用不上。<\/p>\n<p><strong>互补松弛怎么用<\/strong>：拿到一张最优表，可以反推哪些约束是紧的、哪些变量为正，用来做解的合理性检查。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为影子价格等于资源市价。<\/strong> 它只反映模型内部的边际贡献，模型一改它就变。\n<\/li><li>\n<strong>别以为对偶最优解唯一。<\/strong> 原问题退化时对偶可能有多重最优解，影子价格不唯一。\n<\/li><li>\n<strong>别以为强对偶总是成立。<\/strong> 需要两边都可行；一边无界另一边就不可行。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>对偶理论四定理<\/td><td>强对偶、互补松弛<\/td><\/tr><tr><td>第 2 章<\/td><td>运输问题的位势法<\/td><td>位势 u、v 就是对偶变量，σ 就是检验数<\/td><\/tr><tr><td>第 8 章<\/td><td>零和矩阵博弈<\/td><td>博弈的值 = 一对互为对偶的 LP 的公共最优值<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">单纯形法<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">最大流最小割<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Nash 均衡<\/a>\n<\/ul>", "c03": "<h1>全么模与整数性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章、第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若矩阵 A 的每个方子阵行列式都是 0 或 ±1，就叫<strong>全么模<\/strong>；这样的约束矩阵能保证&quot;顶点自动是整数点&quot;，于是线性规划的解可以直接当整数解用。<\/p>\n<h2>为什么重要<\/h2>\n<p>整数规划一般很难，但有一类问题例外：约束矩阵全么模时，<strong>LP 松弛的最优解天然是整数<\/strong>，不用分枝也不用割平面。运输问题、指派问题都属于这一类，这是它们能用多项式算法求解的根本原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[约束矩阵 A] --&gt; B{所有方子阵 det 在 -1,0,1 内吗}\n    B --&gt;|是 全么模| C[顶点坐标为整数]\n    C --&gt; D[LP 最优解即 ILP 最优解]\n    B --&gt;|否| E[顶点可能带分数]\n    E --&gt; F[必须用割平面 分枝定界等]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图重点：判断点在&quot;行列式&quot;那一格。行列式只能取 ±1 和 0，意味着求逆时不会出现分数。<\/p>\n<h2>详解<\/h2>\n<p><strong>为什么全么模就整数<\/strong>：基本解 x_B = B⁻¹b。若 B 的行列式是 ±1，则 B⁻¹ 的元素全是整数（伴随矩阵除以 det，det = ±1 除不出分数）；再若 b 是整数向量，x_B 就是整数向量。<\/p>\n<p><strong>运输问题的矩阵是全么模的<\/strong>：它的约束矩阵每列只有两个 1（一个在行约束、一个在列约束），这种&quot;每列至多两个非零元且符号相反&quot;的结构叫<strong>网络矩阵<\/strong>，可以证明全么模。所以产销平衡的运输问题，LP 最优解自动是整数运输方案——这就是&quot;表上作业法&quot;敢直接调运量的理论依据。<\/p>\n<p><strong>指派问题同理<\/strong>：约束是&quot;每行一个、每列一个&quot;，也是全么模。<\/p>\n<p><strong>反过来，不全么模就要小心<\/strong>：第 3 章的例子里 LP 最优解是 (9/4, 15/4)，四分之三的出现就是矩阵不全么模的直接表现。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;约束全是整数&quot;就一定有整数解。<\/strong> 要看矩阵结构，不是看系数是否整数。\n<\/li><li>\n<strong>别以为全么模等于&quot;所有元素是 0/±1&quot;。<\/strong> 元素可以是别的整数，关键是所有子阵行列式受限。\n<\/li><li>\n<strong>别以为全么模问题一定简单。<\/strong> 判定一个矩阵是否全么模本身有算法，但问题规模大时仍要小心。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>运输问题 rank(A) = m+n−1<\/td><td>约束矩阵全么模，顶点整数<\/td><\/tr><tr><td>第 2 章<\/td><td>指派问题与匈牙利算法<\/td><td>全么模保证 LP 与 ILP 同解<\/td><\/tr><tr><td>第 3 章<\/td><td>割平面法<\/td><td>对照：不全么模时出现分数解<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">对偶与影子价格<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">割平面与分枝定界<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">匹配与增广路<\/a>\n<\/ul>", "c04": "<h1>割平面与分枝定界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两种解整数规划的通法：<strong>割平面<\/strong>往可行域里&quot;切一刀&quot;削掉带分数的角，<strong>分枝定界<\/strong>把问题按变量的取值范围&quot;劈成两半&quot;分别求解，用界来剪掉没希望的分支。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是整数规划的两大主力算法，几乎所有商用求解器（CPLEX、Gurobi）的内核都是这两者的组合。理解它们，才能理解&quot;为什么整数规划比线性规划难那么多&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[解 LP 松弛] --&gt; B{解是整数吗}\n    B --&gt;|是| C[得到最优 结束]\n    B --&gt;|否| D[选一个分数变量 x_j = 3.75]\n    D --&gt; E1[分支1: x_j &lt;= 3]\n    D --&gt; E2[分支2: x_j &gt;= 4]\n    E1 --&gt; F1[解子问题 得到界]\n    E2 --&gt; F2[解子问题 得到界]\n    F1 --&gt; G{界比当前最好整数解差吗}\n    F2 --&gt; G\n    G --&gt;|差| H[剪枝]\n    G --&gt;|不差| A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图重点：剪枝条件是&quot;这个分支的界已经不如手上已有的整数解&quot;。<strong>界越紧，剪得越早，算法越快。<\/strong><\/p>\n<h2>详解<\/h2>\n<p><strong>割平面（Gomory）<\/strong>：在 LP 最优表里找一行，右端项是分数；把该行拆成&quot;整数部分 + 分数部分&quot;，得到一个新的不等式，它<strong>对所有整数可行解都成立，但恰好切掉当前这个分数顶点<\/strong>。加进去重解 LP，直到解变整数。<\/p>\n<p>书上例子的关键两步：从 x₁ + (9/4)x₃ − (1/4)x₄ = 9/4 推出 x₃ + 3x₄ ≥ 1，等价于 4x₁ + 7x₂ ≤ 35；再加一刀 2x₁ + 3x₂ ≤ 15，最终得到整数解 (3,3)。<\/p>\n<p><strong>分枝定界<\/strong>：解 LP 松弛得到上界（max 问题）；一旦某个分支拿到整数可行解，就用它更新下界；任何分支的 LP 上界低于当前下界就剪掉。书上例子：根 −202.5 → 分支 x₁ ≥ 3 得 (3,3) = −198（更新下界）→ 另一边 −200 被剪、(9/5,4) = −198 被剪。<\/p>\n<p><strong>两者的关系<\/strong>：割平面是&quot;改约束&quot;，分枝定界是&quot;改范围&quot;，现代求解器两者混用（branch and cut）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 LP 松弛解取整就能用。<\/strong> 取整可能不可行、可能离最优很远（第 3 章的三重失败就是例子）。\n<\/li><li>\n<strong>别以为割平面越多越好。<\/strong> 割太多会让 LP 变慢、数值不稳定，实际要控制数量和深度。\n<\/li><li>\n<strong>别以为分枝定界一定要遍历全树。<\/strong> 好界能让它只走很小一部分。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>例 3.1<\/td><td>取整三重失败：(9/4,15/4)=−202.5，(2,4) 不可行，(2,3)=−168<\/td><\/tr><tr><td>第 3 章<\/td><td>Gomory 割推导<\/td><td>4x₁+7x₂ ≤ 35，再 2x₁+3x₂ ≤ 15<\/td><\/tr><tr><td>第 3 章<\/td><td>分枝定界树<\/td><td>根 −202.5 → (3,3)=−198<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">单纯形法<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">全么模与整数性<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">NP-完全与归约<\/a>\n<\/ul>", "c05": "<h1>匹配与增广路<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章、第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>匹配是&quot;把点两两配对且不重复&quot;；增广路是一条&quot;从头到尾交替走未匹配边和匹配边、两端都未匹配&quot;的路，沿着它换边就能让匹配多一条。<\/p>\n<h2>为什么重要<\/h2>\n<p>指派问题、婚配问题、排班问题都是匹配。<strong>Berge 定理<\/strong>给出判定最优的判据，<strong>匈牙利算法<\/strong>和 <strong>Edmonds 花算法<\/strong>给出求解方法，这一套是组合优化里最经典的结构。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[当前匹配 M] --&gt; B[找增广路：未匹配点出发 交替走]\n    B --&gt; C{找到吗}\n    C --&gt;|找到| D[沿路翻转：匹配边变非匹配 反之]\n    D --&gt; A\n    C --&gt;|没有| E[当前匹配最大 Berge 定理]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图重点：整个算法就是&quot;不断找增广路 → 翻转&quot;。终止条件由 Berge 定理保证正确。<\/p>\n<h2>详解<\/h2>\n<p><strong>Berge 定理<\/strong>：匹配 M 是最大匹配，当且仅当不存在增广路。这条定理把&quot;最优性&quot;转化成一个可搜索的结构。<\/p>\n<p><strong>二分图<\/strong>：点分成左右两边，边只跨两边。二分图的最大匹配有匈牙利算法（本质是反复找增广路），复杂度 O(VE)。<\/p>\n<p><strong>一般图<\/strong>：奇环（花）会让增广路搜索失效，Edmonds 的<strong>花算法<\/strong>把奇环缩成一个点继续搜索，从而解决一般图匹配。<\/p>\n<p><strong>König 定理<\/strong>：二分图中&quot;最大匹配的大小 = 最小顶点覆盖的大小&quot;。这条对偶关系是二分图理论的核心，也是很多证明的工具。<\/p>\n<p><strong>Hall 婚配定理<\/strong>：二分图存在饱和左侧所有点的匹配，当且仅当左侧任意 k 个点的邻居总数 ≥ k。这是&quot;匹配存在性&quot;的充要条件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;每个点都有边&quot;就能匹配上。<\/strong> Hall 条件看的是&quot;任意子集的邻居数&quot;，不是单点的度数。\n<\/li><li>\n<strong>别以为一般图和二分图算法通用。<\/strong> 奇环会让朴素增广失效，必须用花算法。\n<\/li><li>\n<strong>别以为最大匹配唯一。<\/strong> 大小唯一，具体方案可能多解。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>指派问题与匈牙利算法<\/td><td>4×4 例子最优 15，逐轮减、划、补<\/td><\/tr><tr><td>第 4 章<\/td><td>匹配、Berge 定理、Edmonds 花算法<\/td><td>增广路判最优<\/td><\/tr><tr><td>第 4 章<\/td><td>König 定理、Hall 定理<\/td><td>匹配与覆盖的对偶<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">全么模与整数性<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">最大流最小割<\/a>\n<\/ul>", "c06": "<h1>最大流最小割<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在一个带容量的网络里，从源点到汇点能送出的最大流量，正好等于把源和汇分开所需切掉的最小容量——两者永远相等。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是网络优化里最漂亮的对偶定理，也是&quot;最小割 = 最大流&quot;这一整类问题的基石。运输、通信、图像分割、项目调度都靠它。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    S[源 s] --&gt;|3| A[a]\n    S --&gt;|2| B[b]\n    A --&gt;|2| C[c]\n    B --&gt;|3| C\n    C --&gt;|4| T[汇 t]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这个网络的最大流是 4，最小割是 c→t 这条边（容量 4）。看图时可以自己验：s 出来的总容量只有 5，但 a、b 到 c 的总容量是 5，c 到 t 只有 4，所以卡在 4。<\/p>\n<h2>详解<\/h2>\n<p><strong>Ford–Fulkerson 方法<\/strong>：在<strong>残余网络<\/strong>里不断找增广路（还能再送流量的路径），找到就沿着它加压，直到找不到为止。残余网络里<strong>反向边<\/strong>是关键——它允许&quot;撤销&quot;之前的流量分配，这是算法正确的核心。<\/p>\n<p><strong>为什么反向边重要<\/strong>：贪心地先送一条路可能堵住更好的分配，反向边给了&quot;反悔&quot;的机会。没有反向边，算法会卡在局部最优。<\/p>\n<p><strong>Edmonds–Karp<\/strong>：把找增广路改成 BFS（每次找最短的增广路），复杂度 O(VE²)，避免 Ford–Fulkerson 在无理容量时的慢收敛。<\/p>\n<p><strong>最小割怎么找<\/strong>：最大流结束后，在残余网络里从 s 出发能到达的点集记 S，其余记 T，(S,T) 就是一个最小割。<\/p>\n<p><strong>最小费用最大流<\/strong>：在&quot;流量最大&quot;的前提下让总费用最小，做法是每次沿&quot;单位费用最省&quot;的增广路加压（用最短路找路），是运输问题的一般化。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;送满每条边&quot;就是最大流。<\/strong> 中间瓶颈会限制总量，要看割。\n<\/li><li>\n<strong>别以为增广路必须走&quot;没用过的边&quot;。<\/strong> 残余网络里反向边也算通路。\n<\/li><li>\n<strong>别以为最大流唯一。<\/strong> 流量值唯一，具体分配可能多种。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>最大流最小割定理<\/td><td>maxflow = mincut = 4（书上自拟网络）<\/td><\/tr><tr><td>第 4 章<\/td><td>Ford–Fulkerson 与 Edmonds–Karp<\/td><td>残余网络 + 反向边<\/td><\/tr><tr><td>第 4 章<\/td><td>最小费用最大流<\/td><td>最短路增广<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">匹配与增广路<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">近似比与 PTAS<\/a>\n<\/ul>", "c07": "<h1>NP-完全与归约<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章、第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>如果一个问题属于 NP（解可以在多项式时间内被验证），且所有 NP 问题都能多项式归约到它，它就是 <strong>NP-完全<\/strong>的；归约的意思是&quot;把 A 的实例改写成 B 的实例，使得答案保持一致&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>它给出&quot;这个问题有多难&quot;的严格说法。判定一个问题是 NP-完全的，就等于说&quot;别指望找到多项式算法（除非 P = NP）&quot;，从而把精力转向近似算法、特殊情形或启发式。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    P[P：多项式可解] --&gt; NP[NP：解可多项式验证]\n    NP --&gt; NPC[NP-完全：NP 中最难的一类]\n    NPC --&gt; SAT[SAT Cook 1971]\n    SAT --&gt; TSP[TSP]\n    SAT --&gt; CLIQUE[团 着色]\n    SAT --&gt; BP[装箱]\n    NPC --&gt; NPH[NP-难：不比 NPC 更容易 可不在 NP 内]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图重点：P ⊆ NP ⊆ NP-难 的层次关系，以及&quot;从 SAT 出发的归约树&quot;——第一个 NP-完全问题是 Cook 证明的 SAT，其余都是归约过去的。<\/p>\n<h2>详解<\/h2>\n<p><strong>四个盒子<\/strong>：<\/p>\n<ul><li>\n<strong>P<\/strong>：有多项式算法。\n<\/li><li>\n<strong>NP<\/strong>：解能在多项式时间验证（不要求能构造）。\n<\/li><li>\n<strong>NP-完全<\/strong>：在 NP 里，且所有 NP 问题都能归约到它。\n<\/li><li>\n<strong>NP-难<\/strong>：所有 NP 问题都能归约到它，但它自己可以不在 NP 里（如优化版的 TSP）。\n<\/ul>\n<p><strong>归约的方向不能搞反<\/strong>：要证&quot;问题 B 是 NP-完全的&quot;，做法是&quot;取一个已知 NP-完全问题 A，把 A 的实例多项式时间改写成 B 的实例，且答案一致&quot;。也就是 <strong>A ≤ₚ B<\/strong>，把已知难的往新问题上靠。<\/p>\n<p><strong>两步证明套路<\/strong>：<\/p>\n<ol><li>\n证 B ∈ NP（给出解，能在多项式时间验证）。\n<\/li><li>\n证 A ≤ₚ B（写出改写方法，并证明&quot;A 有解 ⇔ B 有解&quot;）。\n<\/ol>\n<p><strong>结构决定难度<\/strong>：第 5 章的四组对照最能说明问题——最短路好解、最长路难解；2-着色好解、3-着色难解；指派好解、三维指派难解。<strong>约束只加了一点点，难度跨一个数量级。<\/strong><\/p>\n<p><strong>强 NP-完全<\/strong>：若问题的数值被规模的多项式界住（B(I) ≤ p(x(I))），则它是强 NP-完全的；强 NP-完全问题<strong>不存在伪多项式算法<\/strong>（定理 5.2）。这解释了为什么背包有 O(nC) 的 DP，而 TSP、装箱没有。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;我没想到多项式算法&quot;就等于 NP-完全。<\/strong> 需要严格归约。\n<\/li><li>\n<strong>别以为 NP-完全问题绝对无解。<\/strong> 小规模精确算法、特殊结构、近似算法都可行。\n<\/li><li>\n<strong>别以为归约方向可以反过来。<\/strong> 方向反了证明的是另一件事。\n<\/li><li>\n<strong>别以为伪多项式算法是多项式算法。<\/strong> O(nC) 里 C 是数值，不是规模。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>P/NP/NPC/NP-hard 四盒<\/td><td>Cook 1971、Karp 1972<\/td><\/tr><tr><td>第 5 章<\/td><td>结构决定难度四对照<\/td><td>最短路 vs 最长路等<\/td><\/tr><tr><td>第 5 章<\/td><td>强 NP-完全（定义 5.5、定理 5.2）<\/td><td>无伪多项式算法<\/td><\/tr><tr><td>第 6 章<\/td><td>装箱是强 NP-完全<\/td><td>只有渐进 PTAS<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">割平面与分枝定界<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">近似比与 PTAS<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">竞争比<\/a>\n<\/ul>", "c08": "<h1>近似比与 PTAS<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章、第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>近似比 ρ 是&quot;算法解的目标值 / 最优值&quot;的最坏上界；PTAS 是一族算法，对任意 ε &gt; 0 都能在多项式时间（ε 固定时）内做到 1+ε 的近似。<\/p>\n<h2>为什么重要<\/h2>\n<p>NP-难问题求不了精确最优，工程上全靠近似算法。近似比是&quot;能承诺什么&quot;的合同条款，PTAS/FPTAS 是&quot;能承诺到什么程度&quot;的分级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[NP-难问题] --&gt; B[精确算法：只对小规模可行]\n    A --&gt; C[近似算法]\n    C --&gt; D[常数近似比 rho]\n    C --&gt; E[PTAS：任意 eps 多项式时间]\n    E --&gt; F[FPTAS：对 1/eps 也多项式]\n    C --&gt; G[启发式：无理论保证]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图重点：从&quot;有常数界&quot;到&quot;任意精度&quot;是一条越来越强的阶梯，FPTAS 是最高一档。<\/p>\n<h2>详解<\/h2>\n<p><strong>近似比定义<\/strong>：对最小化问题，ρ = max over 实例 of (C_A / C*)；最大化问题反过来。ρ = 1 表示最优，ρ = 2 表示最坏差一倍。<\/p>\n<p><strong>要证明 ρ，需要两件事<\/strong>：给出算法的上界（A 的解得 ≤ ρ·OPT），并给一个实例说明界是紧的（不能更小）。<\/p>\n<p><strong>经典例子<\/strong>：<\/p>\n<ul><li>\n顶点覆盖的 2-近似（取极大匹配，两端都选）。\n<\/li><li>\nTSP 的 MST 双树法 2-近似（MST ≤ OPT，2MST ≤ 2OPT，三角不等式抄近路不增成本）。\n<\/li><li>\n装箱 FFD 的 11/9。\n<\/ul>\n<p><strong>背包的贪心反例<\/strong>：容量 10，物品 A(6, 价值 7)、B(5,5)、C(5,5)。贪心按性价比先拿 A，得 7；最优是 B+C 得 10。比值 10/7 ≈ 1.43，说明&quot;按性价比贪心&quot;没有常数界（换个例子可以任意差）。<\/p>\n<p><strong>PTAS 与 FPTAS<\/strong>：PTAS 的运行时间可以是 n^{1/ε}（ε 固定时是多项式）；FPTAS 要求对 1/ε 也是多项式（如 O(n³/ε)）。背包有 FPTAS（价值缩放 + DP），装箱只有<strong>渐进<\/strong> PTAS。<\/p>\n<p><strong>为什么装箱没有 PTAS<\/strong>：装箱是强 NP-完全的，PTAS 会与强 NP-完全性矛盾（在 P ≠ NP 下）。渐进 PTAS 只对大实例保证，绕开这个矛盾。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 ρ = 2 就是&quot;平均差一倍&quot;。<\/strong> 那是最坏情况。\n<\/li><li>\n<strong>别以为启发式有名字就有保证。<\/strong> 最近邻、模拟退火大多没有理论界。\n<\/li><li>\n<strong>别以为 PTAS 一定实用。<\/strong> n^{1/ε} 在 ε = 0.01 时是 n^100，理论好看，实际跑不动。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>近似比定义、背包反例<\/td><td>贪心 7 vs 最优 10<\/td><\/tr><tr><td>第 5 章<\/td><td>GK/CK、MST 双树<\/td><td>ρ = 2<\/td><\/tr><tr><td>第 5 章<\/td><td>PTAS/FPTAS、PKP_ε<\/td><td>价值缩放<\/td><\/tr><tr><td>第 6 章<\/td><td>装箱 11/9 与渐进 PTAS<\/td><td>强 NP-完全的限制<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">NP-完全与归约<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">竞争比<\/a>\n<\/ul>", "c09": "<h1>竞争比<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在线算法 A 的竞争比是&quot;对所有输入序列，A 的花费与离线最优花费之比&quot;的上确界；它衡量最坏情况下要付几倍代价。<\/p>\n<h2>为什么重要<\/h2>\n<p>在线问题没有&quot;最优解&quot;可比（未来未知），竞争比是唯一严格的评价标准。它是第 5 章近似比思想在&quot;信息不全&quot;场景下的对应物。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[输入序列逐个到达] --&gt; B[在线算法立即决策]\n    B --&gt; C[记录花费 C_A]\n    A --&gt; D[离线算法预知全部]\n    D --&gt; E[最优花费 C_opt]\n    C --&gt; F[比值 C_A / C_opt]\n    E --&gt; F\n    F --&gt; G[对所有序列取上确界 = 竞争比]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图重点：两条分支用同一个输入序列，比值取最坏。<strong>它不是平均，是上确界。<\/strong><\/p>\n<h2>详解<\/h2>\n<p><strong>几个基准数字<\/strong>（记住了就等于记住了整章）：<\/p>\n<table><thead><tr><th>问题<\/th><th>最好竞争比<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>滑雪租赁<\/td><td>2 − 1/N<\/td><td>随机化可到 e/(e−1) ≈ 1.58<\/td><\/tr><tr><td>找钥匙（线性搜索）<\/td><td>9<\/td><td>等比翻倍方案，且被证明最优<\/td><\/tr><tr><td>在线 P\\<\/td><td>\\<\/td><td>Cₘₐₓ<\/td><td>2 − 1/m<\/td><td>m ≤ 3 时 LS 最优<\/td><\/tr><tr><td>Paging<\/td><td>k<\/td><td>LRU、FIFO 达到，且是下界<\/td><\/tr><tr><td>k-server<\/td><td>2k − 1<\/td><td>工作函数算法；下界 k<\/td><\/tr><\/tbody><\/table>\n<p><strong>常用证明手法<\/strong>：<\/p>\n<ul><li>\n<strong>构造坏实例<\/strong>：设计一个输入序列，让算法每次都做错（如 LRU 的循环访问）。\n<\/li><li>\n<strong>势函数/分摊分析<\/strong>：给状态定义一个&quot;势&quot;，证明每一步的真实花费 + 势的变化 ≤ ρ·最优花费。\n<\/li><li>\n<strong>几何级数<\/strong>：在线策略的参数（搜索步长、租买时机）要用等比，避免浪费累积。\n<\/ul>\n<p><strong>半在线<\/strong>：给定部分信息（总量已知），可以改善竞争比。这是现实中更常见的情形。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为竞争比小就一定实际好。<\/strong> 它对抗的是&quot;最坏输入&quot;，实际数据往往温和得多。\n<\/li><li>\n<strong>别以为随机化能改善最坏情况。<\/strong> 它改善的是期望值。\n<\/li><li>\n<strong>别以为离线最优可达。<\/strong> 它只是标杆。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>滑雪租赁<\/td><td>2 − 1/N<\/td><\/tr><tr><td>第 7 章<\/td><td>找钥匙<\/td><td>最优 9<\/td><\/tr><tr><td>第 7 章<\/td><td>在线排序下界<\/td><td>2 − 1/m；m=4 下界 √3<\/td><\/tr><tr><td>第 7 章<\/td><td>Paging、k-server、CNN<\/td><td>k；2k−1<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">近似比与 PTAS<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">Nash 均衡<\/a>（同为&quot;多主体/信息不全&quot;的决策模型）\n<\/ul>", "c10": "<h1>Nash 均衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在一个多人博弈里，如果没有任何一个参与者能通过<strong>单方面<\/strong>改变自己的策略而获得更高收益，这个局势就是 Nash 均衡。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;多人决策&quot;里唯一稳定的状态，也是分析市场、拍卖、谈判、交通的通用语言。它的两个关键性质——<strong>未必最优<\/strong>（囚徒困境）、<strong>未必存在纯策略<\/strong>（石头剪刀布）——构成了整章的主线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[参与者 i 的策略集 A_i 收益 u_i] --&gt; B[局势 a = a_1 ... a_n]\n    B --&gt; C{存在 i 与 a_i&#x27; 使 u_i 变大吗}\n    C --&gt;|存在| D[不是均衡]\n    C --&gt;|不存在| E[是 Nash 均衡]\n    E --&gt; F[纯策略均衡 可能不存在]\n    E --&gt; G[混合策略均衡 一定存在 Nash 1951]\n    E --&gt; H[PoA 衡量均衡离社会最优多远]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图重点：判定只有一句&quot;能不能单方面变好&quot;。存在性分纯策略（可能没有）与混合策略（一定有）。<\/p>\n<h2>详解<\/h2>\n<p><strong>严格定义<\/strong>：对每个 i 与每个 aᵢ′ ∈ Aᵢ，uᵢ(a) ≥ uᵢ(a₁,…,aᵢ′,…,aₙ)。<\/p>\n<p><strong>最优反应法<\/strong>：解&quot;在别人策略固定时我的最佳选择&quot;这个方程组，交点即均衡。<\/p>\n<p><strong>2×2 例子<\/strong>（囚徒困境型）：只要每个参与者的&quot;背叛&quot;在每个情形下都优于&quot;合作&quot;，双方背叛就是唯一的纯策略均衡。<\/p>\n<p><strong>混合策略例子<\/strong>（零和 2×2）：甲以 p 选甲1 使两列期望相等，得 p = 3/7，值 = 1/7。<\/p>\n<p><strong>存在性<\/strong>：Nash 1951 用 Brouwer 不动点定理证明&quot;有限博弈的混合策略均衡一定存在&quot;。这是博弈论最核心的定理。<\/p>\n<p><strong>PoA<\/strong>：最坏均衡的社会总福利 / 最优社会总福利。囚徒困境的 PoA &gt; 1；书上&quot;各自只顾小团体、被各个击破&quot;的例子 PoA 可趋于无穷。<\/p>\n<p><strong>三个经典模型<\/strong>：<\/p>\n<ul><li>\n<strong>Cournot<\/strong>：产量竞争，反应函数 q = (M − c − q&#x27;)/2，均衡 q = (M − c)/3。\n<\/li><li>\n<strong>Bertrand<\/strong>：价格竞争，均衡 p = c（价格战到底）。\n<\/li><li>\n<strong>Hotelling<\/strong>：位置竞争，两家挤中点；三家无纯策略均衡。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为均衡 = 最优。<\/strong> 囚徒困境的均衡是最差结果。\n<\/li><li>\n<strong>别以为没有纯策略均衡就没有均衡。<\/strong> 混合策略均衡由 Nash 定理保证存在。\n<\/li><li>\n<strong>别以为&quot;理性&quot;能带来好结果。<\/strong> 理性个体 + 无协调 = 可能集体受损，这正是 PoA 的意义。\n<\/li><li>\n<strong>别以为先出价没差别。<\/strong> Rubinstein 模型里先出价者分得 1/(1+δ)，比后出价者多。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章<\/td><td>矩阵博弈、鞍点<\/td><td>max-min = min-max 时纯策略解<\/td><\/tr><tr><td>第 8 章<\/td><td>囚徒困境（Tucker 1950）<\/td><td>均衡非最优<\/td><\/tr><tr><td>第 8 章<\/td><td>Nash 定义与存在性<\/td><td>混合策略必存在<\/td><\/tr><tr><td>第 8 章<\/td><td>Cournot / Bertrand / Hotelling<\/td><td>均衡产量、价格、位置<\/td><\/tr><tr><td>第 8 章<\/td><td>讨价还价<\/td><td>最大化增量乘积；轮流出价<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">对偶与影子价格<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">竞争比<\/a>\n<\/li><li>\n延伸：机制设计、拍卖理论\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：导言：优化三件套<\/strong><br>阅读：<a href=\"#/book/combinatorial-optimization-and-game-theory/chapter/ch00\">第 0 章：导言<\/a><br>检查点：能举一个局部最优不是全局最优的例子<\/li><li class='path-step' id='path-02'><strong>步骤 02：线性规划与对偶<\/strong><br>阅读：<a href=\"#/book/combinatorial-optimization-and-game-theory/chapter/ch01\">第 1 章：线性规划<\/a><br>检查点：手算单纯形表，得 x=(4,2)、值 14<\/li><li class='path-step' id='path-03'><strong>步骤 03：运输与指派<\/strong><br>阅读：<a href=\"#/book/combinatorial-optimization-and-game-theory/chapter/ch02\">第 2 章：运输与指派<\/a><br>检查点：运输最优 43，指派最优 15<\/li><li class='path-step' id='path-04'><strong>步骤 04：整数规划<\/strong><br>阅读：<a href=\"#/book/combinatorial-optimization-and-game-theory/chapter/ch03\">第 3 章：整数规划<\/a><br>检查点：复算 −202.5、−198、−168 三个值<\/li><li class='path-step' id='path-05'><strong>步骤 05：图与网络优化<\/strong><br>阅读：<a href=\"#/book/combinatorial-optimization-and-game-theory/chapter/ch04\">第 4 章：图与网络优化<\/a><br>检查点：MST 总权 13，最大流 4<\/li><li class='path-step' id='path-06'><strong>步骤 06：组合优化与复杂度<\/strong><br>阅读：<a href=\"#/book/combinatorial-optimization-and-game-theory/chapter/ch05\">第 5 章：组合优化<\/a><br>检查点：能写一个归约的两步证明<\/li><li class='path-step' id='path-07'><strong>步骤 07：排序与装箱<\/strong><br>阅读：<a href=\"#/book/combinatorial-optimization-and-game-theory/chapter/ch06\">第 6 章：排序与装箱<\/a><br>检查点：LPT 得 12，Johnson 得 11<\/li><li class='path-step' id='path-08'><strong>步骤 08：在线问题<\/strong><br>阅读：<a href=\"#/book/combinatorial-optimization-and-game-theory/chapter/ch07\">第 7 章：在线问题<\/a><br>检查点：推出滑雪租赁 2 − 1/N<\/li><li class='path-step' id='path-09'><strong>步骤 09：博弈论<\/strong><br>阅读：<a href=\"#/book/combinatorial-optimization-and-game-theory/chapter/ch08\">第 8 章：博弈论<\/a><br>检查点：解出 2×2 博弈值 1/7<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 0 章：导言<\/h2><div class='quiz-item' data-qid='ch00-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 一个优化问题的三件套是<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch00-q01' value='0'> 变量、数据、结果<\/label><label class='quiz-opt'><input type='radio' name='ch00-q01' value='1'> 决策变量、目标函数、约束条件<\/label><label class='quiz-opt'><input type='radio' name='ch00-q01' value='2'> 模型、算法、程序<\/label><label class='quiz-opt'><input type='radio' name='ch00-q01' value='3'> 输入、处理、输出<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch00-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 比附近所有解都好、但全局还有更好解的那个解，叫______。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 1 章：线性规划<\/h2><div class='quiz-item' data-qid='ch01-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 单纯形法每一步做的事是<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q03' value='0'> 在可行域内部随机取点<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='1'> 沿边从当前顶点走到相邻顶点<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='2'> 把约束全部删掉<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='3'> 用启发式搜索<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q04' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 检验数大于 0 表示把对应非基变量增大时，目标函数会______。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：运输与指派<\/h2><div class='quiz-item' data-qid='ch02-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 产销平衡运输问题的约束矩阵秩为<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='rad ss='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：博弈论<\/h1><div class='quiz-item' data-qid='ch08-q17' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Nash 均衡的判据是<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q17' value='0'> 所有人收益之和最大<\/label><label class='quiz-opt'><input type='radio' name='ch08-q17' value='1'> 没有任何人能单方面改变策略而获益<\/label><label class='quiz-opt'><input type='radio' name='ch08-q17' value='2'> 所有人收益相等<\/label><label class='quiz-opt'><input type='radio' name='ch08-q17' value='3'> 存在鞍点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q18' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> Cournot 模型中两家企业成本相同、需求为最高价减去总产量，均衡产量为______。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='决策变量'>决策变量 — 你能拍板决定的那个量 <span class=glossary-ref>（第 0 章：导言）<\/span><\/li><li data-term='目标函数'>目标函数 — 你想让它变大或变小的那个数 <span class=glossary-ref>（第 0 章：导言）<\/span><\/li><li data-term='约束条件'>约束条件 — 决策变量必须满足的限制 <span class=glossary-ref>（第 0 章：导言）<\/span><\/li><li data-term='可行解'>可行解 — 同时满足所有约束的一组取值 <span class=glossary-ref>（第 0 章：导言）<\/span><\/li><li data-term='可行域'>可行域 — 所有可行解组成的集合 <span class=glossary-ref>（第 0 章：导言）<\/span><\/li><li data-term='最优解'>最优解 — 可行域里让目标函数最好的一组取值 <span class=glossary-ref>（第 0 章：导言）<\/span><\/li><li data-term='最优值'>最优值 — 最优解对应的目标函数数值 <span class=glossary-ref>（第 0 章：导言）<\/span><\/li><li data-term='局部最优'>局部最优 — 只比附近解好、全局未必最好的解 <span class=glossary-ref>（第 0 章：导言）<\/span><\/li><li data-term='标准形'>标准形 — 最大化、等式约束、变量非负的规范形式 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='基本可行解'>基本可行解 — 非基变量取 0 且所有变量非负的解 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='顶点'>顶点 — 可行域多面体的角点，对应一个基本可行解 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='检验数'>检验数 — 让某个非基变量增加 1 单位时目标的改善量 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='退化'>退化 — 基本可行解里有基变量取值为 0 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='对偶问题'>对偶问题 — 与原 LP 共用数据、角色互换的影子问题 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='影子价格'>影子价格 — 每多一单位资源时最优目标的增量 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='互补松弛'>互补松弛 — 变量为正则约束紧，约束松则变量为 0 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='全么模'>全么模 — 所有方子阵行列式为 0 或正负 1 的矩阵 <span class=glossary-ref>（第 2 章：运输与指派）<\/span><\/li><li data-term='位势'>位势 — 运输问题里对偶变量的别称 <span class=glossary-ref>（第 2 章：运输与指派）<\/span><\/li><li data-term='闭回路'>闭回路 — 运输表里用于调整运量的闭合折线 <span class=glossary-ref>（第 2 章：运输与指派）<\/span><\/li><li data-term='匈牙利算法'>匈牙利算法 — 求指派问题最优解的逐轮减补法 <span class=glossary-ref>（第 2 章：运输与指派）<\/span><\/li><li data-term='稳定匹配'>稳定匹配 — 不存在双方都想换的配对 <span class=glossary-ref>（第 2 章：运输与指派）<\/span><\/li><li data-term='lp 松弛'>LP 松弛 — 把整数约束放掉后得到的线性规划 <span class=glossary-ref>（第 3 章：整数规划）<\/span><\/li><li data-term='割平面'>割平面 — 只切掉分数顶点、保留所有整数解的约束 <span class=glossary-ref>（第 3 章：整数规划）<\/span><\/li><li data-term='分枝定界'>分枝定界 — 按变量范围劈开问题、用界剪枝的搜索 <span class=glossary-ref>（第 3 章：整数规划）<\/span><\/li><li data-term='整数间隙'>整数间隙 — 松弛最优值与整数最优值的差 <span class=glossary-ref>（第 3 章：整数规划）<\/span><\/li><li data-term='匹配'>匹配 — 点两两配对且不重复的边集 <span class=glossary-ref>（第 4 章：图与网络优化）<\/span><\/li><li data-term='增广路'>增广路 — 能通过翻转让匹配多一条的路 <span class=glossary-ref>（第 4 章：图与网络优化）<\/span><\/li><li data-term='最小生成树'>最小生成树 — 连通所有点且总权最小的树 <span class=glossary-ref>（第 4 章：图与网络优化）<\/span><\/li><li data-term='最大流'>最大流 — 从源到汇能送出的最大流量 <span class=glossary-ref>（第 4 章：图与网络优化）<\/span><\/li><li data-term='最小割'>最小割 — 把源汇分开所需切掉的最小容量 <span class=glossary-ref>（第 4 章：图与网络优化）<\/span><\/li><li data-term='残余网络'>残余网络 — 记录每条边还能加多少、能撤多少的网络 <span class=glossary-ref>（第 4 章：图与网络优化）<\/span><\/li><li data-term='np'>NP — 解能在多项式时间内被验证的问题类 <span class=glossary-ref>（第 5 章：组合优化）<\/span><\/li><li data-term='np-完全'>NP-完全 — NP 中最难的一类，所有 NP 问题都能归约到它 <span class=glossary-ref>（第 5 章：组合优化）<\/span><\/li><li data-term='np-难'>NP-难 — 所有 NP 问题都能归约到它，自身可不在 NP 内 <span class=glossary-ref>（第 5 章：组合优化）<\/span><\/li><li data-term='归约'>归约 — 把 A 的实例改写成 B 的实例且答案一致 <span class=glossary-ref>（第 5 章：组合优化）<\/span><\/li><li data-term='强 np-完全'>强 NP-完全 — 数值被规模的多项式界住的 NP-完全问题 <span class=glossary-ref>（第 5 章：组合优化）<\/span><\/li><li data-term='伪多项式算法'>伪多项式算法 — 运行时间依赖数值大小而非规模的算法 <span class=glossary-ref>（第 5 章：组合优化）<\/span><\/li><li data-term='近似比'>近似比 — 算法解与最优解之比的最坏上界 <span class=glossary-ref>（第 5 章：组合优化）<\/span><\/li><li data-term='ptas'>PTAS — 任意精度、精度固定时多项式时间的算法族 <span class=glossary-ref>（第 5 章：组合优化）<\/span><\/li><li data-term='fptas'>FPTAS — 对精度倒数值也是多项式的 PTAS <span class=glossary-ref>（第 5 章：组合优化）<\/span><\/li><li data-term='三参数记法'>三参数记法 — α 机器环境、β 工件特征、γ 目标函数 <span class=glossary-ref>（第 6 章：排序与装箱）<\/span><\/li><li data-term='makespan'>makespan — 最大完工时间，最后一件完工的时刻 <span class=glossary-ref>（第 6 章：排序与装箱）<\/span><\/li><li data-term='交换论证'>交换论证 — 交换相邻元素证明贪心最优的手法 <span class=glossary-ref>（第 6 章：排序与装箱）<\/span><\/li><li data-term='渐进近似比'>渐进近似比 — 只在大实例上趋于常数的近似保证 <span class=glossary-ref>（第 6 章：排序与装箱）<\/span><\/li><li data-term='在线算法'>在线算法 — 输入未知、必须立即决策且不可反悔的算法 <span class=glossary-ref>（第 7 章：在线问题）<\/span><\/li><li data-term='竞争比'>竞争比 — 在线算法花费与离线最优之比的上确界 <span class=glossary-ref>（第 7 章：在线问题）<\/span><\/li><li data-term='半在线'>半在线 — 已知部分未来信息的在线问题 <span class=glossary-ref>（第 7 章：在线问题）<\/span><\/li><li data-term='缓存置换'>缓存置换 — 缓存满时决定踢掉哪一页的规则 <span class=glossary-ref>（第 7 章：在线问题）<\/span><\/li><li data-term='k-server'>k-server — k 台服务器移动去服务请求点的问题 <span class=glossary-ref>（第 7 章：在线问题）<\/span><\/li><li data-term='零和博弈'>零和博弈 — 一方所得恰为另一方所失的博弈 <span class=glossary-ref>（第 8 章：博弈论）<\/span><\/li><li data-term='鞍点'>鞍点 — 既是行最小、又是列最大的元素 <span class=glossary-ref>（第 8 章：博弈论）<\/span><\/li><li data-term='混合策略'>混合策略 — 按概率分布选择策略的做法 <span class=glossary-ref>（第 8 章：博弈论）<\/span><\/li><li data-term='nash 均衡'>Nash 均衡 — 没人能单方面改变策略而获益的局势 <span class=glossary-ref>（第 8 章：博弈论）<\/span><\/li><li data-term='最优反应'>最优反应 — 别人策略固定时自己的最佳选择 <span class=glossary-ref>（第 8 章：博弈论）<\/span><\/li><li data-term='无政府代价'>无政府代价 — 最坏均衡的社会福利与最优之比 <span class=glossary-ref>（第 8 章：博弈论）<\/span><\/li><li data-term='谈判解'>谈判解 — 最大化双方增量乘积的分配方案 <span class=glossary-ref>（第 8 章：博弈论）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：优化的三件套<\/h2>\n<p>作者反复用同一个骨架描述一切优化问题：<strong>决策变量 → 目标函数 → 约束条件<\/strong>。拿到任何新场景，先把这三样写出来，问题就成型了。再补四个词（可行解、可行域、最优解、最优值），就能开始讨论解法。<\/p>\n<p><strong>什么时候用<\/strong>：任何&quot;要怎么安排才最好&quot;的问题，从排课到送货到投资组合。<\/p>\n<p><strong>怎么用<\/strong>：先问&quot;我能决定什么&quot;（变量），再问&quot;好在哪&quot;（目标），最后问&quot;什么不能违反&quot;（约束）。三者缺一，问题就是没定义清楚。<\/p>\n<h2>框架：难度分层<\/h2>\n<p>作者判断一个问题难不难，不看它长得复杂不复杂，而看它的<strong>结构<\/strong>：约束是等式还是不等式、变量是连续还是离散、矩阵是否全么模、有没有特殊结构（网络、超增、凸性）。<\/p>\n<p>同一类问题里，结构的一个小改动会让难度跨数量级：最短路（多项式）vs 最长路（NP-难）、2-着色（多项式）vs 3-着色（NP-难）。<strong>所以看到新问题，先找它离哪个已知问题最近。<\/strong><\/p>\n<h2>决策规则<\/h2>\n<pre><code>要解一个优化问题\n├─ 是连续的吗？\n│   ├─ 是 → 线性？→ 单纯形法 / 内点法\n│   └─ 否 → 约束矩阵全么模吗？\n│        ├─ 是 → 直接解 LP，解自动整数\n│        └─ 否 → 规模小？→ 割平面 / 分枝定界\n│                规模大？→ 近似算法（先看有没有 PTAS/FPTAS）\n└─ 信息不全吗？\n    ├─ 完全不知未来 → 在线算法，用竞争比评价\n    └─ 知道部分信息 → 半在线算法<\/code><\/pre>\n<h2>决策规则：该用哪个&quot;比&quot;<\/h2>\n<table><thead><tr><th>场景<\/th><th>指标<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>离线、有最优解可比<\/td><td>近似比 ρ<\/td><td>最坏比最优差几倍<\/td><\/tr><tr><td>在线、未来未知<\/td><td>竞争比 ρ<\/td><td>最坏比离线最优差几倍<\/td><\/tr><tr><td>多人博弈<\/td><td>PoA<\/td><td>最坏均衡比社会最优差几倍<\/td><\/tr><\/tbody><\/table>\n<p>三个指标的形式几乎一样（都是&quot;最坏情况下的比值&quot;），但比较对象不同。<strong>记住这一点，就不会混用。<\/strong><\/p>\n<h2>反模式<\/h2>\n<p><strong>反模式 1：把 LP 松弛解直接取整。<\/strong> 作者用第 3 章的三重失败证明它不可靠：取整可能不可行，也可能离最优很远。<strong>替代方案<\/strong>：割平面、分枝定界，或先证明全么模。<\/p>\n<p><strong>反模式 2：用启发式的名字当保证。<\/strong> &quot;最近邻&quot;&quot;模拟退火&quot;听起来聪明，但没有理论界。<strong>替代方案<\/strong>：要么证明近似比，要么明确说&quot;这是经验方法&quot;。<\/p>\n<p><strong>反模式 3：拿&quot;平均表现&quot;冒充&quot;最坏保证&quot;。<\/strong> 竞争比、近似比都是上确界，平均数据好看不代表界好看。<strong>替代方案<\/strong>：分开报告&quot;理论界&quot;与&quot;实测表现&quot;。<\/p>\n<p><strong>反模式 4：忽略前提条件。<\/strong> 超增性、全么模、三角不等式、可行域有界——这些前提不成立时，结论就不成立。<strong>替代方案<\/strong>：用算法前先验前提。<\/p>\n<p><strong>反模式 5：把&quot;理性个体&quot;当成&quot;集体最优&quot;。<\/strong> 囚徒困境、Cournot 过度竞争、Bertrand 价格战，都是&quot;每个人理性、集体受损&quot;。<strong>替代方案<\/strong>：设计机制（合同、收费、规则）改变均衡。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式与结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>线性规划标准形<\/td><td>max c x，s.t. Ax = b，x ≥ 0<\/td><\/tr><tr><td>基本解<\/td><td>x_B = B⁻¹b，非基变量取 0<\/td><\/tr><tr><td>检验数<\/td><td>σ_j = c_j − c_B^T B⁻¹ A_j，σ_j ≤ 0 全成立时最优<\/td><\/tr><tr><td>最小比值<\/td><td>θ = min{b_i / a_ij : a_ij &gt; 0}<\/td><\/tr><tr><td>弱对偶<\/td><td>任意可行 x、y 有 c x ≤ b y<\/td><\/tr><tr><td>影子价格<\/td><td>y = (B⁻¹)^T c_B<\/td><\/tr><tr><td>运输问题秩<\/td><td>rank(A) = m + n − 1<\/td><\/tr><tr><td>位势检验<\/td><td>σ_ij = c_ij − (u_i + v_j)，全 ≥ 0 时最优<\/td><\/tr><tr><td>整数规划三事实<\/td><td>松弛是下界；可行解变少但更难；无通用取整法<\/td><\/tr><tr><td>MST 贪心<\/td><td>Kruskal（按边权）/ Prim（按点扩）<\/td><\/tr><tr><td>Dijkstra<\/td><td>非负权单源最短路，O(m log n)<\/td><\/tr><tr><td>最大流最小割<\/td><td>maxflow = mincut<\/td><\/tr><tr><td>归约方向<\/td><td>已知 NPC 的 A ≤ₚ 待证 B<\/td><\/tr><tr><td>强 NPC<\/td><td>B(I) ≤ p(x(I)) ⇒ 无伪多项式算法<\/td><\/tr><tr><td>MST 双树法<\/td><td>ρ = 2（需三角不等式）<\/td><\/tr><tr><td>FFD 装箱<\/td><td>≤ 11/9·OPT + 6/9<\/td><\/tr><tr><td>SPT<\/td><td>1‖∑Cⱼ 最优<\/td><\/tr><tr><td>EDD<\/td><td>1‖Lₘₐₓ 最优<\/td><\/tr><tr><td>LPT<\/td><td>P‖Cₘₐₓ，ρ = 4/3 − 1/(3m)<\/td><\/tr><tr><td>LS<\/td><td>P‖Cₘₐₓ，ρ = 2 − 1/m<\/td><\/tr><tr><td>Johnson<\/td><td>F2‖Cₘₐₓ 最优规则<\/td><\/tr><tr><td>滑雪租赁<\/td><td>2 − 1/N；随机化 e/(e−1)<\/td><\/tr><tr><td>找钥匙<\/td><td>最优竞争比 9<\/td><\/tr><tr><td>Paging<\/td><td>LRU/FIFO 竞争比 k<\/td><\/tr><tr><td>k-server<\/td><td>WFA 竞争比 2k − 1，下界 k<\/td><\/tr><tr><td>零和博弈<\/td><td>max-min = min-max 时鞍点，值 v<\/td><\/tr><tr><td>2×2 零和值<\/td><td>v = (ad − bc)/(a + d − b − c)<\/td><\/tr><tr><td>Cournot<\/td><td>q = (M − c)/3，p = (M + 2c)/3<\/td><\/tr><tr><td>Bertrand<\/td><td>p = c<\/td><\/tr><tr><td>谈判解<\/td><td>max (x − x₀)(y − y₀)，(x,y) ∈ S<\/td><\/tr><\/tbody><\/table>\n<h2>算法复杂度速记<\/h2>\n<table><thead><tr><th>问题<\/th><th>算法<\/th><th>复杂度<\/th><\/tr><\/thead><tbody><tr><td>线性规划<\/td><td>单纯形（实践）/ 内点（理论多项式）<\/td><td>—<\/td><\/tr><tr><td>指派<\/td><td>匈牙利<\/td><td>O(n³)<\/td><\/tr><tr><td>最短路<\/td><td>Dijkstra<\/td><td>O(m log n)<\/td><\/tr><tr><td>最小生成树<\/td><td>Kruskal / Prim<\/td><td>O(m log m)<\/td><\/tr><tr><td>最大流<\/td><td>Edmonds–Karp<\/td><td>O(VE²)<\/td><\/tr><tr><td>匹配（一般图）<\/td><td>Edmonds 花算法<\/td><td>O(V³)<\/td><\/tr><tr><td>背包<\/td><td>DP<\/td><td>O(nC)，伪多项式<\/td><\/tr><\/tbody><\/table>\n<h2>易错点清单<\/h2>\n<ol><li>\n单纯形最小比值只取正分母。\n<\/li><li>\n影子价格不等于市价。\n<\/li><li>\n取整 LP 解不保证可行。\n<\/li><li>\n全么模看的是子阵行列式，不是元素大小。\n<\/li><li>\n归约方向不能反。\n<\/li><li>\n竞争比是上确界不是平均。\n<\/li><li>\nα|β|γ 中 β 为空要写空位，不能省。\n<\/li><li>\nNash 均衡不等于社会最优。\n<\/ol>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 0 章：导言", "href": "#/chapter/ch00"}, {"label": "第 1 章：线性规划", "href": "#/chapter/ch01"}, {"label": "第 2 章：运输与指派", "href": "#/chapter/ch02"}, {"label": "第 3 章：整数规划", "href": "#/chapter/ch03"}, {"label": "第 4 章：图与网络优化", "href": "#/chapter/ch04"}, {"label": "第 5 章：组合优化", "href": "#/chapter/ch05"}, {"label": "第 6 章：排序与装箱", "href": "#/chapter/ch06"}, {"label": "第 7 章：在线问题", "href": "#/chapter/ch07"}, {"label": "第 8 章：博弈论", "href": "#/chapter/ch08"}]}, {"label": "概念", "children": [{"label": "单纯形法", "href": "#/concept/c01"}, {"label": "对偶与影子价格", "href": "#/concept/c02"}, {"label": "全么模与整数性", "href": "#/concept/c03"}, {"label": "割平面与分枝定界", "href": "#/concept/c04"}, {"label": "匹配与增广路", "href": "#/concept/c05"}, {"label": "最大流最小割", "href": "#/concept/c06"}, {"label": "NP-完全与归约", "href": "#/concept/c07"}, {"label": "近似比与 PTAS", "href": "#/concept/c08"}, {"label": "竞争比", "href": "#/concept/c09"}, {"label": "Nash 均衡", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 0 章：导言", "href": "#/quiz/ch00"}, {"label": "测验：第 1 章：线性规划", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：运输与指派", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：整数规划", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：图与网络优化", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：组合优化", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：排序与装箱", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：在线问题", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：博弈论", "href": "#/quiz/ch08"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch00": true, "ch01": true, "ch02": true, "ch03": true, "ch04": true, "ch05": true, "ch06": true, "ch07": true, "ch08": true}}};
